<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rug Siege</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #4a2f1d;
  --ink2: #8a6a4e;
  --honey: #f5b83d;
  --honey-d: #d9922a;
  --berry: #e5484d;
  --mint-d: #3d9150;
  --panel: rgba(255, 248, 236, 0.93);
}
html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #2a1e15;
  overscroll-behavior: none;
  font-family: 'Fredoka', 'Nunito', system-ui, sans-serif;
  color: var(--ink);
  -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; -webkit-tap-highlight-color: transparent; }
#app { position: absolute; overflow: hidden; background: #3a2a1e; user-select: none; -webkit-user-select: none; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#vignette {
  position: absolute; inset: 0; pointer-events: none; z-index: 1;
  background:
    radial-gradient(ellipse at 70% 0%, rgba(255, 220, 160, 0.16), transparent 45%),
    radial-gradient(ellipse at center, transparent 55%, rgba(30, 16, 6, 0.42) 100%);
}
#hurt { position: absolute; inset: 0; pointer-events: none; z-index: 3; opacity: 0; box-shadow: inset 0 0 120px 30px rgba(229, 72, 77, 0.75); }
#hurt.on { animation: hurt 0.6s ease-out; }
@keyframes hurt { 0% { opacity: 1; } 100% { opacity: 0; } }
#hud { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; pointer-events: none; }
#top, #preview, #dock { pointer-events: auto; }
#spacer { flex: 1; pointer-events: none; }
#top { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 14px 8px; }
.wordmark {
  display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 4px 18px 4px 8px; border-radius: 999px;
  background: linear-gradient(180deg, #ff7a6e, #e5484d); color: #fff; font-weight: 700; font-size: 21px;
  text-shadow: 0 2px 0 rgba(120, 20, 20, 0.35); box-shadow: 0 4px 0 #b8323a, 0 10px 22px rgba(60, 20, 10, 0.3);
}
.wordmark img { width: 40px; height: 40px; margin: -6px 0; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.25)); }
.stat {
  display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 4px 16px 4px 6px; border-radius: 999px;
  background: var(--panel); box-shadow: 0 4px 0 #d9c3a0, 0 10px 22px rgba(60, 30, 10, 0.22);
}
.stat .k { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink2); }
.stat b { display: inline-block; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); }
.stat.bump b { animation: bump 0.35s ease-out; }
.stat.hurtp { animation: wob 0.45s ease-out; }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.35); color: #c97a00; } 100% { transform: scale(1); } }
@keyframes wob { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-6px); background: #ffd9d6; } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
.coin, .heart, .flag { width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.coin { background: radial-gradient(circle at 35% 30%, #fff1b8, #ffcb45 45%, #e09a1c 80%); box-shadow: inset 0 -3px 0 #c27d10, 0 2px 3px rgba(0,0,0,0.2); }
.coin::after { content: ''; width: 12px; height: 12px; border-radius: 50%; border: 3px solid rgba(190, 120, 10, 0.55); }
.heart { background: radial-gradient(circle at 35% 30%, #ffb3b3, #f05a5f 50%, #c23a3f); box-shadow: inset 0 -3px 0 #a52a30, 0 2px 3px rgba(0,0,0,0.2); }
.heart::after { content: ''; width: 16px; height: 15px; margin-top: 2px; background: #fff; clip-path: path('M8 15 C2 10 0 6 2.5 3 C4.5 0.8 7 1.6 8 3.6 C9 1.6 11.5 0.8 13.5 3 C16 6 14 10 8 15 Z'); }
.flag { background: radial-gradient(circle at 35% 30%, #b8e3ff, #4f86c6 60%, #2f5f9a); box-shadow: inset 0 -3px 0 #284f80, 0 2px 3px rgba(0,0,0,0.2); color: #fff; font-size: 16px; }
#wave { margin-left: auto; flex-direction: column; align-items: stretch; gap: 3px; padding: 5px 16px 7px 6px; border-radius: 24px; }
#wave .row { display: flex; align-items: center; gap: 8px; }
#wavebar { height: 6px; margin-left: 4px; border-radius: 3px; background: #ead7b8; overflow: hidden; }
#wavefill { height: 100%; width: 0; background: linear-gradient(90deg, #7ed957, #3db36a); border-radius: 3px; transition: width 0.6s ease; }
#preview {
  align-self: flex-start; display: flex; align-items: center; gap: 2px; max-width: calc(100% - 28px); min-height: 50px;
  margin: 0 14px; padding: 4px 10px 4px 6px; overflow-x: auto; touch-action: pan-x; scrollbar-width: none;
  border-radius: 999px; background: var(--panel); box-shadow: 0 4px 0 #d9c3a0, 0 10px 22px rgba(60, 30, 10, 0.2);
}
#preview::-webkit-scrollbar { display: none; }
#nextlbl { flex: 0 0 auto; color: #fff; background: var(--ink2); font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; padding: 6px 11px; border-radius: 999px; margin-right: 4px; }
.prev { position: relative; flex: 0 0 auto; width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
.prev img { width: 42px; height: 42px; filter: drop-shadow(0 2px 1px rgba(60,30,10,0.25)); }
.prev.marked { background: rgba(245, 184, 61, 0.3); box-shadow: 0 0 0 2px var(--honey); }
.gapbadge { display: none; position: absolute; right: -4px; bottom: -4px; background: var(--honey); color: var(--ink); font: 700 9px/12px 'Fredoka', system-ui; padding: 0 4px; border-radius: 6px; box-shadow: 0 1px 0 var(--honey-d); }
.prev.hasgap .gapbadge { display: block; }
#dock {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 8px 14px calc(12px + env(safe-area-inset-bottom));
  padding: 10px 12px 14px; border-radius: 26px;
  background: linear-gradient(180deg, rgba(255, 249, 238, 0.96), rgba(246, 231, 207, 0.96));
  box-shadow: 0 5px 0 #cdb38c, 0 18px 40px rgba(40, 20, 6, 0.35);
}
#line { flex: 1 0 100%; min-height: 1.3em; color: var(--ink2); font-size: 15px; font-weight: 500; padding: 0 6px; }
#line b { color: var(--ink); font-weight: 700; }
.toy {
  position: relative; width: 98px; min-height: 104px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  padding: 4px 4px 8px; border: 0; border-radius: 20px; cursor: pointer; color: var(--ink);
  background: linear-gradient(180deg, #ffffff, #fbeedb); box-shadow: 0 5px 0 #d9bf98, 0 8px 14px rgba(60, 30, 10, 0.16);
  transition: transform 0.18s cubic-bezier(.3,1.6,.5,1), box-shadow 0.15s;
}
.toy:active { transform: translateY(3px); box-shadow: 0 2px 0 #d9bf98; }
.toy.sel { transform: translateY(-8px); background: linear-gradient(180deg, #fffbe8, #ffe8a8); box-shadow: 0 0 0 3px var(--honey), 0 7px 0 var(--honey-d), 0 16px 26px rgba(217, 146, 42, 0.45); }
.toy img { width: 64px; height: 64px; margin-bottom: -2px; filter: drop-shadow(0 3px 2px rgba(60,30,10,0.25)); }
.toy.sel img { animation: hop 0.9s ease-in-out infinite; }
@keyframes hop { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-5px) scale(1.06); } }
.toyname { font-size: 15px; font-weight: 600; line-height: 1.15; }
.toycost { display: inline-flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 700; color: #a8690c; }
.toycost::before { content: ''; width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff1b8, #ffcb45 50%, #e09a1c); box-shadow: inset 0 -1px 0 #c27d10; }
.toy.poor .toycost { color: #c0413f; }
.toy.poor img { filter: grayscale(0.6) opacity(0.7); }
#actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
#start {
  height: 60px; min-width: 160px; padding: 0 26px; border: 0; border-radius: 999px; cursor: pointer;
  background: linear-gradient(180deg, #7fe08a, #44b157); color: #fff; font-size: 22px; font-weight: 700;
  text-shadow: 0 2px 0 rgba(20, 90, 30, 0.45); box-shadow: 0 6px 0 #2f8a43, 0 12px 22px rgba(40, 120, 50, 0.4);
  animation: glow 1.6s ease-in-out infinite;
}
#start::before { content: '\25B6'; margin-right: 10px; font-size: 17px; }
#start:active { transform: translateY(4px); box-shadow: 0 2px 0 #2f8a43; }
@keyframes glow { 0%,100% { box-shadow: 0 6px 0 #2f8a43, 0 12px 22px rgba(40,120,50,0.4); } 50% { box-shadow: 0 6px 0 #2f8a43, 0 12px 34px rgba(100,230,110,0.8); } }
#start[hidden] { display: none; }
#speeds { display: flex; padding: 4px; border-radius: 999px; background: #ead7b8; box-shadow: inset 0 2px 3px rgba(80, 50, 20, 0.2); }
.spd { min-width: 56px; min-height: 50px; border: 0; border-radius: 999px; background: transparent; color: var(--ink2); font-size: 18px; font-weight: 700; cursor: pointer; }
.spd.on { background: linear-gradient(180deg, #ffd56a, var(--honey)); color: var(--ink); box-shadow: 0 3px 0 var(--honey-d); }
.glyph { width: 40px; height: 40px; }
.glyph.marble { border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, #b7ddf0 42%, #6e97b0); }
.glyph.pillow { width: 44px; height: 26px; border-radius: 40%; background: #f6a9bb; }
.glyph.fan { border-radius: 50%; background: conic-gradient(#7cc8b5 0 18%, #f6f1e7 0 33%, #7cc8b5 0 51%, #f6f1e7 0 66%, #7cc8b5 0 84%, #f6f1e7 0 100%); }
.glyph.band { width: 30px; height: 20px; border: 5px solid #f0c43a; border-radius: 40%; box-sizing: border-box; }
.glyph.soldier { background: #5f9440; border-radius: 6px 6px 9px 9px; }
.glyph.car { height: 20px; border-radius: 6px 10px 4px 4px; background: #e0453a; }
.glyph.teddy { border-radius: 50%; background: radial-gradient(circle at 40% 35%, #e0b07a, #c4844a 60%, #8a5a32); }
.glyph.block { border-radius: 6px; background: linear-gradient(135deg, #f0c85a, #c48a28); }
.glyph.balloon { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff8d96, #e23b4a 55%, #a12330); }
.glyph.tin { border-radius: 6px; background: linear-gradient(#e5ebef, #8d969e); }
.prev .glyph { width: 26px; height: 26px; }
#chips, #pops, #fly { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
.chip, .pop { position: absolute; transform: translate(-50%, -130%); pointer-events: auto; }
.chip {
  display: flex; align-items: center; gap: 6px; min-height: 48px; padding: 4px 16px 4px 6px; border-radius: 999px; border: 0;
  background: linear-gradient(180deg, #fffdf6, #fbe9c9); color: var(--ink); font-size: 17px; font-weight: 700; cursor: pointer;
  box-shadow: 0 4px 0 #d2b07c, 0 10px 18px rgba(40, 20, 6, 0.35); white-space: nowrap;
}
.chip .ico { width: 36px; height: 36px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; }
.chip[data-kind="up"] .ico { background: radial-gradient(circle at 35% 30%, #fff1b8, #ffcb45 50%, #e09a1c); color: #fff; font-size: 18px; text-shadow: 0 1px 0 #a86a00; }
.chip[data-kind="merge"] { background: linear-gradient(180deg, #f7efff, #e3d2ff); box-shadow: 0 4px 0 #a98bd6, 0 10px 18px rgba(40, 20, 60, 0.35); }
.chip[data-kind="merge"] .ico img { width: 40px; height: 40px; }
.chip .cst { display: inline-flex; align-items: center; gap: 3px; color: #a8690c; }
.chip .cst::before { content: ''; width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff1b8, #ffcb45 50%, #e09a1c); }
.chip.dim { opacity: 0.6; filter: grayscale(0.4); }
.pop { pointer-events: none; color: #ffd84a; font-size: 26px; font-weight: 700; -webkit-text-stroke: 1.5px #7a4a10; text-shadow: 0 3px 0 #7a4a10; }
.flycoin { position: absolute; left: 0; top: 0; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff1b8, #ffcb45 45%, #e09a1c 80%); box-shadow: inset 0 -2px 0 #c27d10, 0 2px 4px rgba(0,0,0,0.3); }
.flytxt { position: absolute; left: 0; top: 0; font-size: 34px; font-weight: 700; color: #fff; -webkit-text-stroke: 2px #6b3fb0; text-shadow: 0 4px 0 #6b3fb0; white-space: nowrap; }
#banner { position: absolute; left: 0; right: 0; top: 32%; z-index: 4; pointer-events: none; text-align: center; opacity: 0; }
#banner.show { animation: banner 2.1s cubic-bezier(.2,1.4,.4,1) forwards; }
#banner .big { font-size: clamp(44px, 8vw, 88px); font-weight: 700; color: #fff; -webkit-text-stroke: 3px #b8323a; text-shadow: 0 6px 0 #b8323a, 0 14px 30px rgba(40, 10, 0, 0.45); }
#banner.clear .big { -webkit-text-stroke-color: #2f8a43; text-shadow: 0 6px 0 #2f8a43, 0 14px 30px rgba(0, 40, 10, 0.45); }
#banner .small { display: inline-block; margin-top: 8px; padding: 6px 18px; border-radius: 999px; background: var(--panel); font-size: clamp(16px, 2.4vw, 22px); font-weight: 600; color: var(--ink); box-shadow: 0 4px 0 #d9c3a0; }
@keyframes banner {
  0% { opacity: 0; transform: scale(0.4) rotate(-6deg); }
  18% { opacity: 1; transform: scale(1.06) rotate(1deg); }
  28% { transform: scale(1) rotate(0); }
  78% { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(1.1) translateY(-30px); }
}
#end { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, rgba(40, 24, 12, 0.3), rgba(20, 12, 6, 0.7)); animation: fade 0.4s ease-out; }
#end[hidden] { display: none; }
@keyframes fade { from { opacity: 0; } }
#endcard { width: min(440px, calc(100% - 40px)); padding: 24px 26px 26px; border-radius: 32px; text-align: center; background: linear-gradient(180deg, #fffaf0, #f6e4c6); box-shadow: 0 8px 0 #cdb38c, 0 30px 60px rgba(20, 10, 0, 0.5); animation: cardIn 0.6s cubic-bezier(.3,1.6,.5,1); }
@keyframes cardIn { from { transform: scale(0.5) translateY(40px); opacity: 0; } }
#endart { display: flex; justify-content: center; align-items: flex-end; height: 70px; margin-top: -84px; }
#endart img { width: 96px; height: 96px; filter: drop-shadow(0 6px 4px rgba(60,30,10,0.35)); animation: hop 1.2s ease-in-out infinite; }
#endart img:nth-child(2) { animation-delay: -0.4s; width: 120px; height: 120px; }
#endart img:nth-child(3) { animation-delay: -0.8s; }
#endmsg { margin: 22px 0 4px; font-size: 40px; font-weight: 700; line-height: 1.1; color: var(--berry); }
#end.win #endmsg { color: var(--mint-d); }
#endsub { margin: 0 0 20px; font-size: 18px; color: var(--ink2); font-weight: 500; }
#endbtns { display: flex; gap: 12px; justify-content: center; }
#end button { min-width: 124px; min-height: 58px; padding: 10px 22px; border: 0; border-radius: 999px; font-size: 21px; font-weight: 700; cursor: pointer; }
#retry { background: linear-gradient(180deg, #7fe08a, #44b157); color: #fff; text-shadow: 0 2px 0 rgba(20,90,30,0.45); box-shadow: 0 5px 0 #2f8a43; }
#stop { background: #ead7b8; color: var(--ink); box-shadow: 0 5px 0 #cdb38c; }
#end button:active { transform: translateY(3px); }
#fallback { position: absolute; inset: 0; z-index: 6; display: flex; align-items: center; justify-content: center; color: #fff8ec; background: #2a1e15; padding: 24px; text-align: center; font-size: 20px; }
#fallback[hidden] { display: none; }
@keyframes shake {
  0%, 100% { transform: translate(-50%, -130%); }
  20% { transform: translate(calc(-50% - 5px), -130%); }
  40% { transform: translate(calc(-50% + 5px), -130%); }
  60% { transform: translate(calc(-50% - 3px), -130%); }
  80% { transform: translate(calc(-50% + 2px), -130%); }
}
.shake { animation: shake 0.3s linear; }
.toycost.shake { animation: dockshake 0.3s linear; }
@keyframes dockshake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@media (max-width: 760px) {
  .wordmark span, .stat .k { display: none; }
  .wordmark { padding: 4px 6px; }
  .stat { padding: 4px 12px 4px 4px; min-height: 40px; }
  .coin, .heart, .flag { width: 30px; height: 30px; }
  .stat b { font-size: 18px; white-space: nowrap; }
  #top { gap: 6px; padding-left: 8px; padding-right: 8px; }
  #wave { padding: 4px 12px 6px 4px; }
  #dock { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-left: 8px; margin-right: 8px; gap: 8px; padding: 8px 8px 10px; border-radius: 22px; }
  #line, #actions { grid-column: 1 / -1; }
  #line { font-size: 13px; }
  #actions { margin-left: 0; justify-content: space-between; }
  .toy { width: auto; min-width: 0; min-height: 86px; }
  .toy img { width: 48px; height: 48px; }
  .toyname { font-size: 13px; }
  #start { min-width: 120px; height: 52px; font-size: 19px; }
}
@media (max-height: 560px) and (min-width: 761px) {
  .toy { min-height: 84px; width: 84px; }
  .toy img { width: 46px; height: 46px; }
  #line { display: none; }
}
</style>
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>
  <div id="vignette"></div>
  <div id="hurt"></div>
  <div id="hud">
    <div id="top">
      <div class="wordmark"><img id="logo" alt="" hidden><span>Rug Siege</span></div>
      <div class="stat" id="goldStat"><i class="coin"></i><span class="k">Gold</span><b id="gold">110</b></div>
      <div class="stat" id="livesStat"><i class="heart"></i><span class="k">Lives</span><b id="lives">20</b></div>
      <div class="stat" id="wave"><div class="row"><i class="flag">&#9873;</i><span class="k">Wave</span><b id="waveNum">1 / 24</b></div><div id="wavebar"><div id="wavefill"></div></div></div>
    </div>
    <div id="preview"><span id="nextlbl">Next</span></div>
    <div id="spacer"></div>
    <div id="dock">
      <div id="line">Tap a toy, then a wood square.</div>
      <button type="button" class="toy" data-type="marble">
        <i class="glyph marble"></i><span class="toyname">Marble</span><span class="toycost">50</span>
      </button>
      <button type="button" class="toy" data-type="pillow">
        <i class="glyph pillow"></i><span class="toyname">Pillow</span><span class="toycost">90</span>
      </button>
      <button type="button" class="toy" data-type="fan">
        <i class="glyph fan"></i><span class="toyname">Fan</span><span class="toycost">70</span>
      </button>
      <button type="button" class="toy" data-type="band">
        <i class="glyph band"></i><span class="toyname">Band</span><span class="toycost">120</span>
      </button>
      <div id="actions">
        <div id="speeds">
          <button type="button" id="sp1" class="spd on">1×</button>
          <button type="button" id="sp2" class="spd">2×</button>
        </div>
        <button type="button" id="start">Start wave</button>
      </div>
    </div>
  </div>
  <div id="banner"><div class="big" id="bannerBig"></div><div class="small" id="bannerSmall"></div></div>
  <div id="chips"></div>
  <div id="pops"></div>
  <div id="fly"></div>
  <div id="end" hidden>
    <div id="endcard">
      <div id="endart"></div>
      <p id="endmsg"></p>
      <p id="endsub"></p>
      <div id="endbtns">
        <button type="button" id="retry">Retry</button>
        <button type="button" id="stop">Stop</button>
      </div>
    </div>
  </div>
  <div id="fallback" hidden>This browser can’t show the 3D room.</div>
</div>
<script src="sim.js"></script>
<script src="vendor/three.min.js"></script>
<script src="view.js"></script>
<script>
(function () {
  var COST = { marble: 50, pillow: 90, fan: 70, band: 120 };
  var UP = { marble: 80, pillow: 140, fan: 100, band: 170 };
  var NAMES = { bowl: 'Bowl', blanket: 'Blanket', catch: 'Catch' };

  var app = document.getElementById('app');
  var view = document.getElementById('view');
  var spacer = document.getElementById('spacer');
  var goldEl = document.getElementById('gold');
  var livesEl = document.getElementById('lives');
  var waveEl = document.getElementById('waveNum');
  var previewEl = document.getElementById('preview');
  var lineEl = document.getElementById('line');
  var startBtn = document.getElementById('start');
  var sp1 = document.getElementById('sp1');
  var sp2 = document.getElementById('sp2');
  var endEl = document.getElementById('end');
  var endMsg = document.getElementById('endmsg');
  var stopBtn = document.getElementById('stop');
  var retryBtn = document.getElementById('retry');
  var chipsEl = document.getElementById('chips');
  var popsEl = document.getElementById('pops');

  var state = RugSim.fresh();
  var selectedDock = null;
  var selectedId = null;
  var hoverToy = null;
  var hoverC = -1;
  var hoverR = -1;
  var acc = 0;
  var last = 0;
  var motionT = 0;
  var fx = [];
  var prevSig = null;
  var chipSig = '';
  var press = null;
  var blockClick = false;
  var blockTimer = 0;
  var popNodes = [];
  var flyEl = document.getElementById('fly');
  var goldStat = document.getElementById('goldStat');
  var livesStat = document.getElementById('livesStat');
  var hurtEl = document.getElementById('hurt');
  var bannerEl = document.getElementById('banner');
  var bannerBig = document.getElementById('bannerBig');
  var bannerSmall = document.getElementById('bannerSmall');
  var waveFill = document.getElementById('wavefill');
  var endSub = document.getElementById('endsub');
  var endArt = document.getElementById('endart');
  var LABEL = { marble: 'Marble', pillow: 'Pillow', fan: 'Fan', band: 'Band' };
  var shownGold = null;
  var shownLives = null;
  var lastPhase = 'idle';
  var endShown = false;
  var flying = 0;

  if (!RugView.mount(view)) {
    document.getElementById('fallback').hidden = false;
    return;
  }

  var toys = document.querySelectorAll('.toy');
  function thumbImg(type, cls) {
    var url = RugView.thumb && RugView.thumb(type);
    if (!url) return null;
    var im = document.createElement('img');
    im.src = url;
    im.alt = '';
    im.draggable = false;
    if (cls) im.className = cls;
    return im;
  }
  (function () {
    for (var t = 0; t < toys.length; t++) {
      var g = toys[t].querySelector('.glyph');
      var im = thumbImg(toys[t].getAttribute('data-type'));
      if (g && im) g.parentNode.replaceChild(im, g);
    }
    var logo = document.getElementById('logo');
    var lu = RugView.thumb && RugView.thumb('teddy');
    if (lu) { logo.src = lu; logo.hidden = false; }
  })();

  function restart(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  function showBanner(big, small, clear) {
    bannerBig.textContent = big;
    bannerSmall.textContent = small;
    bannerEl.classList.toggle('clear', !!clear);
    restart(bannerEl, 'show');
  }

  function flyCoins(res) {
    var gr = goldStat.getBoundingClientRect();
    var ar = app.getBoundingClientRect();
    var tx = gr.left - ar.left + 22;
    var ty = gr.top - ar.top + gr.height / 2;
    for (var n = 0; n < res.kills.length; n++) {
      var k = res.kills[n];
      if (k.x < 0 || flying > 14) continue;
      flying++;
      var c = document.createElement('div');
      c.className = 'flycoin';
      flyEl.appendChild(c);
      var mx = (k.x + tx) / 2 + (Math.random() - 0.5) * 120;
      var my = Math.min(k.y, ty) - 60 - Math.random() * 60;
      var anim = c.animate([
        { transform: 'translate(' + k.x + 'px,' + k.y + 'px) scale(0.4)', opacity: 0 },
        { transform: 'translate(' + k.x + 'px,' + (k.y - 40) + 'px) scale(1.2)', opacity: 1, offset: 0.2 },
        { transform: 'translate(' + mx + 'px,' + my + 'px) scale(1)', opacity: 1, offset: 0.55 },
        { transform: 'translate(' + tx + 'px,' + ty + 'px) scale(0.7)', opacity: 0.9 }
      ], { duration: 750 + Math.random() * 200, easing: 'cubic-bezier(.5,0,.6,1)' });
      anim.onfinish = (function (node) {
        return function () {
          node.remove();
          flying--;
          restart(goldStat, 'bump');
        };
      })(c);
    }
    for (n = 0; n < res.merges.length; n++) {
      var m = res.merges[n];
      if (m.x < 0) continue;
      var t = document.createElement('div');
      t.className = 'flytxt';
      t.textContent = (NAMES[m.type] || m.type) + '!';
      flyEl.appendChild(t);
      var a2 = t.animate([
        { transform: 'translate(' + m.x + 'px,' + m.y + 'px) translate(-50%,-50%) scale(0.3)', opacity: 0 },
        { transform: 'translate(' + m.x + 'px,' + (m.y - 30) + 'px) translate(-50%,-50%) scale(1.25)', opacity: 1, offset: 0.25 },
        { transform: 'translate(' + m.x + 'px,' + (m.y - 50) + 'px) translate(-50%,-50%) scale(1)', opacity: 1, offset: 0.75 },
        { transform: 'translate(' + m.x + 'px,' + (m.y - 90) + 'px) translate(-50%,-50%) scale(1)', opacity: 0 }
      ], { duration: 1300, easing: 'ease-out' });
      a2.onfinish = (function (node) { return function () { node.remove(); }; })(t);
    }
    if (res.leaks > 0) {
      restart(hurtEl, 'on');
      restart(livesStat, 'hurtp');
    }
  }

  function presentPhase() {
    var ph = state.phase;
    if (ph !== lastPhase) {
      if (lastPhase === 'idle' && ph === 'march') showBanner('Wave ' + RugSim.displayWave(state), 'Here they come!', false);
      else if (lastPhase === 'march' && ph === 'idle') showBanner('Wave ' + state.cleared + ' cleared!', 'Get ready for the next one', true);
      lastPhase = ph;
    }
    var fr = frozen();
    if (fr && !endShown) {
      endShown = true;
      var win = state.outcome === 'win';
      endEl.classList.toggle('win', win);
      endSub.textContent = win ? 'All 24 waves held back. Great job!' : 'You reached wave ' + RugSim.displayWave(state) + ' of 24. Try again?';
      endArt.textContent = '';
      var arts = win ? ['marble', 'teddy', 'fan'] : ['soldier', 'teddy', 'car'];
      for (var n = 0; n < arts.length; n++) {
        var im = thumbImg(arts[n]);
        if (im) endArt.appendChild(im);
      }
    } else if (!fr) {
      endShown = false;
    }
  }
  for (var i = 0; i < toys.length; i++) {
    (function (btn) {
      var type = btn.getAttribute('data-type');
      btn.addEventListener('pointerdown', function () { hoverToy = type; });
      btn.addEventListener('mouseenter', function () { hoverToy = type; });
      btn.addEventListener('mouseleave', function () { if (hoverToy === type) hoverToy = null; });
      btn.addEventListener('click', function () {
        selectedId = null;
        selectedDock = selectedDock === type ? null : type;
      });
    })(toys[i]);
  }

  function frozen() {
    return state.phase === 'won' || state.phase === 'lost' || state.phase === 'stopped';
  }

  function selectedTower() {
    if (selectedId == null) return null;
    var towers = state.towers || [];
    for (var n = 0; n < towers.length; n++) {
      if (towers[n].id === selectedId) return towers[n];
    }
    selectedId = null;
    return null;
  }

  function inBoard(c, r) {
    return c >= 0 && r >= 0 && c < 16 && r < 10;
  }

  function shakePrice(type) {
    var el = document.querySelector('.toy[data-type="' + type + '"] .toycost');
    if (!el) return;
    el.classList.remove('shake');
    void el.offsetWidth;
    el.classList.add('shake');
  }

  function shakeEl(el) {
    if (!el) return;
    el.classList.remove('shake');
    void el.offsetWidth;
    el.classList.add('shake');
  }

  function armBlock() {
    blockClick = true;
    if (blockTimer) clearTimeout(blockTimer);
    blockTimer = setTimeout(function () {
      blockClick = false;
      blockTimer = 0;
    }, 700);
  }

  function mergeOffers(sel) {
    var out = [];
    var dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    if (!sel) return out;
    for (var n = 0; n < dirs.length; n++) {
      var tw = RugSim.towerAt(state, sel.c + dirs[n][0], sel.r + dirs[n][1]);
      if (!tw) continue;
      var rec = RugSim.pair(sel.type, tw.type);
      if (!rec) continue;
      out.push({ c: tw.c, r: tw.r, type: rec.type, cost: rec.cost });
    }
    return out;
  }

  function doMerge(sel, c, r) {
    var res = RugSim.merge(state, sel.id, c, r);
    if (res && res.ok) selectedId = null;
    else if (res && res.reason === 'gold') {
      var btn = chipsEl.querySelector('[data-c="' + c + '"][data-r="' + r + '"]');
      shakeEl(btn);
    }
  }

  function cellAction(p) {
    var sel, tw, rec, placed, orth;
    if (!p || frozen()) return;
    sel = selectedTower();
    tw = RugSim.towerAt(state, p.c, p.r);
    if (tw) {
      if (sel && sel.id !== tw.id) {
        rec = RugSim.pair(sel.type, tw.type);
        orth = (sel.r === tw.r && Math.abs(sel.c - tw.c) === 1) ||
          (sel.c === tw.c && Math.abs(sel.r - tw.r) === 1);
        if (rec && orth) {
          doMerge(sel, tw.c, tw.r);
          return;
        }
      }
      if (selectedId === tw.id) selectedId = null;
      else {
        selectedId = tw.id;
        selectedDock = null;
      }
      return;
    }
    if (RugSim.cellKind(p.c, p.r) === 'wood') {
      if (selectedDock) {
        placed = RugSim.place(state, selectedDock, p.c, p.r);
        if (placed && !placed.ok && placed.reason === 'gold') shakePrice(selectedDock);
      } else if (selectedId != null) selectedId = null;
    }
  }

  function trySell(c, r) {
    var tower, sold;
    if (frozen() || !inBoard(c, r)) return;
    tower = RugSim.towerAt(state, c, r);
    if (!tower) return;
    sold = RugSim.sell(state, c, r);
    if (sold && sold.ok && selectedId === tower.id) selectedId = null;
  }

  view.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  view.addEventListener('pointerdown', function (e) {
    var p;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    p = RugView.pick(e.clientX, e.clientY);
    if (p) { hoverC = p.c; hoverR = p.r; }
    if (press && press.timer) clearTimeout(press.timer);
    press = { x: e.clientX, y: e.clientY, id: e.pointerId, c: p ? p.c : -1, r: p ? p.r : -1, sold: false, timer: 0 };
    press.timer = setTimeout(function () {
      if (!press || press.sold) return;
      press.sold = true;
      armBlock();
      trySell(press.c, press.r);
    }, 450);
    if (e.pointerType !== 'mouse') e.preventDefault();
    if (view.setPointerCapture) {
      try { view.setPointerCapture(e.pointerId); } catch (err) {}
    }
  });
  view.addEventListener('pointermove', function (e) {
    var p = RugView.pick(e.clientX, e.clientY);
    var dx, dy;
    if (p) { hoverC = p.c; hoverR = p.r; }
    else { hoverC = -1; hoverR = -1; }
    if (!press || e.pointerId !== press.id || press.sold) return;
    dx = e.clientX - press.x;
    dy = e.clientY - press.y;
    if (dx * dx + dy * dy > 100 && press.timer) {
      clearTimeout(press.timer);
      press.timer = 0;
    }
  });
  view.addEventListener('pointerup', function (e) {
    var p, touch;
    if (!press || e.pointerId !== press.id) return;
    if (press.timer) clearTimeout(press.timer);
    p = RugView.pick(e.clientX, e.clientY);
    touch = e.pointerType === 'touch' || e.pointerType === 'pen';
    if (touch && !press.sold) cellAction(p);
    if (touch || press.sold) armBlock();
    press = null;
    if (p) { hoverC = p.c; hoverR = p.r; }
  });
  view.addEventListener('pointercancel', function () {
    if (press && press.timer) clearTimeout(press.timer);
    press = null;
    hoverC = -1;
    hoverR = -1;
  });
  view.addEventListener('pointerleave', function (e) {
    if (e.pointerType === 'mouse') { hoverC = -1; hoverR = -1; }
  });
  view.addEventListener('click', function (e) {
    if (blockClick) {
      blockClick = false;
      if (blockTimer) clearTimeout(blockTimer);
      blockTimer = 0;
      return;
    }
    if (e.button !== 0) return;
    cellAction(RugView.pick(e.clientX, e.clientY));
  });
  view.addEventListener('contextmenu', function (e) {
    var p;
    e.preventDefault();
    p = RugView.pick(e.clientX, e.clientY);
    armBlock();
    if (p) trySell(p.c, p.r);
  });

  startBtn.addEventListener('click', function () {
    if (state.phase === 'idle') RugSim.startWave(state);
  });
  sp1.addEventListener('click', function () {
    if (state.phase === 'idle' || state.phase === 'march') RugSim.setSpeed(state, 1);
  });
  sp2.addEventListener('click', function () {
    if (state.phase === 'idle' || state.phase === 'march') RugSim.setSpeed(state, 2);
  });
  stopBtn.addEventListener('click', function () {
    RugSim.stop(state);
    stopBtn.hidden = true;
  });
  retryBtn.addEventListener('click', function () {
    state = RugSim.fresh();
    selectedDock = null;
    selectedId = null;
    hoverToy = null;
    hoverC = -1;
    hoverR = -1;
    acc = 0;
    motionT = 0;
    fx.length = 0;
    prevSig = null;
    chipSig = '';
    chipsEl.textContent = '';
    lastPhase = 'idle';
    endShown = false;
    var shaking = document.querySelectorAll('.shake');
    for (var s = 0; s < shaking.length; s++) shaking[s].classList.remove('shake');
  });

  function harvest(now) {
    var ev = state.events;
    if (!ev || !ev.length) return;
    for (var n = 0; n < ev.length; n++) {
      var e = ev[n];
      if (!e) continue;
      if (e.t === 'beam') fx.push({ t: 'beam', kind: e.kind, x0: e.x0, y0: e.y0, x1: e.x1, y1: e.y1, born: now, dur: e.kind === 'band' ? 0.35 : 0.12 });
      else if (e.t === 'splash') fx.push({ t: 'splash', x: e.x, y: e.y, r: e.r, born: now, dur: 0.2 });
      else if (e.t === 'pop') fx.push({ t: 'pop', x: e.x, y: e.y, n: e.n, born: now, dur: 0.6 });
      else if (e.t === 'roll') fx.push({ t: 'roll', x0: e.x0, y0: e.y0, x1: e.x1, y1: e.y1, born: now, dur: 0.25 });
    }
    ev.length = 0;
  }

  function syncPreview() {
    var items = RugSim.preview(state) || [];
    var sig = '';
    for (var n = 0; n < items.length; n++) sig += (n ? ',' : '') + items[n].type;
    if (sig !== prevSig) {
      prevSig = sig;
      var old = previewEl.querySelectorAll('.prev');
      for (var r = 0; r < old.length; r++) old[r].remove();
      for (var j = 0; j < items.length; j++) {
        var d = document.createElement('div');
        d.className = 'prev';
        var g = thumbImg(items[j].type);
        if (!g) {
          g = document.createElement('i');
          g.className = 'glyph ' + items[j].type;
        }
        var badge = document.createElement('span');
        badge.className = 'gapbadge';
        badge.textContent = 'gap';
        d.appendChild(g);
        d.appendChild(badge);
        previewEl.appendChild(d);
      }
    }
    var nodes = previewEl.querySelectorAll('.prev');
    for (var k = 0; k < nodes.length; k++) {
      var it = items[k];
      nodes[k].classList.toggle('marked', !!(it && it.marked));
      nodes[k].classList.toggle('hasgap', !!(it && it.gapChip));
    }
  }

  function syncHud() {
    var lineType, text, n, type, spd;
    if (shownGold !== state.gold) {
      if (shownGold != null && state.gold > shownGold && !flying) restart(goldStat, 'bump');
      shownGold = state.gold;
      goldEl.textContent = String(state.gold);
    }
    if (shownLives !== state.lives) {
      shownLives = state.lives;
      livesEl.textContent = String(state.lives);
    }
    waveEl.textContent = RugSim.displayWave(state) + ' / 24';
    waveFill.style.width = (Math.min(24, state.cleared) / 24 * 100) + '%';
    lineType = hoverToy || selectedDock;
    var lineKey = lineType || '';
    if (lineEl.getAttribute('data-k') !== lineKey) {
      lineEl.setAttribute('data-k', lineKey);
      if (!lineType) lineEl.textContent = 'Tap a toy, then a wood square.';
      else {
        text = RugSim.dockLine(lineType);
        lineEl.textContent = '';
        var nm = document.createElement('b');
        nm.textContent = (LABEL[lineType] || lineType) + ' ';
        lineEl.appendChild(nm);
        lineEl.appendChild(document.createTextNode(text == null ? '' : String(text)));
      }
    }
    for (n = 0; n < toys.length; n++) {
      type = toys[n].getAttribute('data-type');
      toys[n].classList.toggle('sel', selectedDock === type);
      toys[n].classList.toggle('poor', state.gold < COST[type]);
    }
    startBtn.hidden = state.phase !== 'idle';
    spd = state.speed == null ? 1 : state.speed;
    sp1.classList.toggle('on', spd === 1);
    sp2.classList.toggle('on', spd === 2);
    if (frozen()) {
      endEl.hidden = false;
      endMsg.textContent = state.outcome === 'win' ? 'You held the rug!' : 'They got through!';
      stopBtn.hidden = state.phase === 'stopped';
    } else {
      endEl.hidden = true;
    }
    syncPreview();
  }

  function syncChips(sel, offers) {
    var sig = sel ? String(sel.id) : '';
    var n;
    if (sel && UP[sel.type] != null && !sel.upgraded) sig += ':up:' + UP[sel.type];
    for (n = 0; n < offers.length; n++) sig += '|' + offers[n].c + ',' + offers[n].r + ',' + offers[n].type + ',' + offers[n].cost;
    if (frozen()) sig = '';
    if (sig !== chipSig) {
      chipSig = sig;
      chipsEl.textContent = '';
      if (sig && sel && UP[sel.type] != null && !sel.upgraded) {
        chipsEl.appendChild(makeChip('up', sel.c, sel.r, String(UP[sel.type]), sel.id, UP[sel.type]));
      }
      for (n = 0; n < offers.length; n++) {
        var of = offers[n];
        chipsEl.appendChild(makeChip('merge', of.c, of.r, (NAMES[of.type] || of.type) + ' ' + of.cost, sel.id, of.cost));
      }
    }
    var buttons = chipsEl.children;
    for (n = 0; n < buttons.length; n++) {
      var btn = buttons[n];
      var c = Number(btn.getAttribute('data-c'));
      var r = Number(btn.getAttribute('data-r'));
      var y = btn.getAttribute('data-kind') === 'up' ? 1.25 : 1.05;
      var p = RugView.project(c + 0.5, y, r + 0.5);
      btn.classList.toggle('dim', state.gold < Number(btn.getAttribute('data-cost')));
      if (!p) { btn.style.display = 'none'; continue; }
      btn.style.display = 'block';
      btn.style.left = p.x + 'px';
      btn.style.top = p.y + 'px';
    }
  }

  function makeChip(kind, c, r, label, id, cost) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chip';
    var ico = document.createElement('span');
    ico.className = 'ico';
    var txt = document.createElement('span');
    var cst = document.createElement('span');
    cst.className = 'cst';
    cst.textContent = String(cost);
    if (kind === 'up') {
      ico.textContent = '\u2191';
      txt.textContent = 'Upgrade';
    } else {
      var tt = String(label).split(' ')[0];
      var mt = null;
      for (var key in NAMES) if (NAMES[key] === tt) mt = key;
      var im = mt ? thumbImg(mt) : null;
      if (im) ico.appendChild(im);
      else ico.textContent = '\u2728';
      txt.textContent = tt;
    }
    btn.appendChild(ico);
    btn.appendChild(txt);
    btn.appendChild(cst);
    btn.setAttribute('data-kind', kind);
    btn.setAttribute('data-c', String(c));
    btn.setAttribute('data-r', String(r));
    btn.setAttribute('data-cost', String(cost));
    btn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      e.preventDefault();
      if (frozen()) return;
      if (kind === 'up') {
        var up = RugSim.upgrade(state, id);
        if (up && !up.ok && up.reason === 'gold') shakeEl(btn);
      } else {
        var sel = selectedTower();
        if (sel) doMerge(sel, c, r);
      }
    });
    return btn;
  }

  function syncPops(now) {
    var pops = [];
    var n;
    for (n = 0; n < fx.length; n++) if (fx[n].t === 'pop') pops.push(fx[n]);
    while (popNodes.length < pops.length) {
      var d = document.createElement('div');
      d.className = 'pop';
      popsEl.appendChild(d);
      popNodes.push(d);
    }
    for (n = 0; n < popNodes.length; n++) {
      if (n >= pops.length) { popNodes[n].style.display = 'none'; continue; }
      var f = pops[n];
      var k = (now - f.born) / (f.dur * 1000);
      var p = RugView.project(f.x, 0.45 + k * 0.9, f.y);
      if (!p) { popNodes[n].style.display = 'none'; continue; }
      popNodes[n].style.display = 'block';
      popNodes[n].style.left = p.x + 'px';
      popNodes[n].style.top = p.y + 'px';
      popNodes[n].style.opacity = String(Math.max(0, 1 - k));
      popNodes[n].textContent = '+' + f.n;
    }
  }

  function measure() {
    var vv = window.visualViewport;
    var left = vv ? vv.offsetLeft : 0;
    var top = vv ? vv.offsetTop : 0;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    app.style.left = left + 'px';
    app.style.top = top + 'px';
    app.style.width = w + 'px';
    app.style.height = h + 'px';
    var c = view.getBoundingClientRect();
    var s = spacer.getBoundingClientRect();
    RugView.setSafe({
      x: s.left - c.left,
      y: s.top - c.top,
      w: s.width,
      h: s.height
    });
  }

  function woodGhost() {
    if (frozen() || !selectedDock) return null;
    if (!inBoard(hoverC, hoverR)) return null;
    if (RugSim.cellKind(hoverC, hoverR) !== 'wood') return null;
    if (RugSim.towerAt(state, hoverC, hoverR)) return null;
    return {
      type: selectedDock,
      c: hoverC,
      r: hoverR,
      ok: state.gold >= COST[selectedDock]
    };
  }

  function frame(now) {
    var realDelta = last ? (now - last) / 1000 : 0;
    last = now;
    if (!(realDelta > 0)) realDelta = 0;
    if (realDelta > 0.25) realDelta = 0.25;
    harvest(now);
    acc += realDelta * (state.phase === 'march' ? state.speed : 0);
    var stepDt = 1 / 60;
    while (acc >= stepDt && state.phase === 'march') {
      RugSim.step(state, stepDt);
      acc -= stepDt;
    }
    if (state.phase !== 'march') acc = 0;
    harvest(now);
    if (state.phase === 'idle' || state.phase === 'march') motionT += realDelta;
    for (var n = fx.length - 1; n >= 0; n--) {
      if (now - fx[n].born >= fx[n].dur * 1000) fx.splice(n, 1);
    }

    var ghost = woodGhost();
    var sel = selectedTower();
    var range = null;
    if (ghost) range = { c: ghost.c, r: ghost.r, radius: RugSim.rangeOf(ghost) };
    else if (sel) range = { c: sel.c, r: sel.r, radius: RugSim.rangeOf(sel) };
    var hover = null;
    if (selectedDock && inBoard(hoverC, hoverR)) {
      var legal = RugSim.cellKind(hoverC, hoverR) === 'wood' && !RugSim.towerAt(state, hoverC, hoverR);
      hover = { c: hoverC, r: hoverR, ok: legal && state.gold >= COST[selectedDock], mode: 'place' };
    }
    measure();
    var res = RugView.frame(state, {
      time: motionT,
      now: now,
      fx: fx,
      ghost: ghost,
      range: range,
      hover: hover,
      showGrid: !!selectedDock,
      selectedId: sel ? sel.id : null
    });
    if (res) flyCoins(res);
    presentPhase();
    syncChips(sel, frozen() ? [] : mergeOffers(sel));
    syncPops(now);
    syncHud();
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', measure);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', measure);
    window.visualViewport.addEventListener('scroll', measure);
  }
  measure();

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
