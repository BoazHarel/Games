<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b1238">
    <title>Christmas Snowman Builder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevent scrolling */
            background: #0b1238;
            touch-action: none; /* Disable default touch actions */
            font-family: 'Fredoka', 'Arial Rounded MT Bold', Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        #gameCanvas {
            display: block;
            position: absolute;
            left: 0;
            top: 0;
            touch-action: none;
        }

        /* The toolbar itself is painted on the canvas (frosted panel + icicles). */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100px;
            pointer-events: none;
            z-index: 10;
        }

        .instruction {
            position: absolute;
            left: 50%;
            bottom: calc(22px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            max-width: calc(100% - 140px);
            box-sizing: border-box;
            padding: 12px 24px 13px;
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(36, 56, 120, 0.92), rgba(20, 32, 78, 0.92));
            border: 2.5px solid rgba(255, 255, 255, 0.75);
            box-shadow: 0 10px 28px rgba(12, 22, 60, 0.35), inset 0 2px 0 rgba(255,255,255,0.25);
            text-align: center;
            color: #fff;
            font-size: clamp(15px, 2.3vw, 22px);
            font-weight: 600;
            letter-spacing: 0.2px;
            line-height: 1.25;
            text-shadow: 0 2px 0 rgba(10, 20, 60, 0.45);
            pointer-events: none;
            animation: popIn 0.8s cubic-bezier(.2, 1.5, .4, 1) both, fadeOut 8s forwards;
            user-select: none;
            z-index: 15;
        }

        #mute-btn {
            position: absolute;
            bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            right: calc(16px + env(safe-area-inset-right, 0px));
            width: 58px;
            height: 58px;
            border-radius: 50%;
            font-size: 26px;
            line-height: 1;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 35% 30%, #ffffff, #dce9fa 60%, #b3c9ea);
            border: 3px solid #ffffff;
            box-shadow: 0 6px 16px rgba(10, 30, 80, 0.4), inset 0 -3px 0 rgba(80, 110, 170, 0.25);
            color: #1f2a44;
            cursor: pointer;
            z-index: 20;
            transition: transform 0.15s cubic-bezier(.2, 1.6, .4, 1);
            -webkit-tap-highlight-color: transparent;
        }
        #mute-btn:active { transform: scale(0.88); }

        @keyframes fadeOut {
            0% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; }
        }
        @keyframes popIn {
            0% { transform: translateX(-50%) translateY(30px) scale(0.6); }
            100% { transform: translateX(-50%) translateY(0) scale(1); }
        }

        @media (max-width: 520px) {
            .instruction { max-width: calc(100% - 100px); padding: 10px 16px; left: calc(50% - 30px); }
            @keyframes popIn {
                0% { transform: translateX(-50%) translateY(30px) scale(0.6); }
                100% { transform: translateX(-50%) translateY(0) scale(1); }
            }
            #mute-btn { width: 52px; height: 52px; font-size: 23px; }
        }
    </style>
</head>
<body>

<div id="ui-layer">
    <!-- Visual cues for the toolbar (painted on the canvas) -->
</div>

<div class="instruction">Stack 3 snowballs to make them come alive! 🎁 Try the Gift Box!</div>
<button id="mute-btn">🔊</button>
<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // --- Audio Engine (Synthesized) ---
    const AudioEngine = {
        ctx: null,
        enabled: true,
        init: function() {
            window.AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
        },
        playTone: function(freq, type, duration, vol = 0.1) {
            if (!this.enabled || !this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gain.gain.setValueAtTime(vol, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
        },
        playPop: function() { this.playTone(600, 'sine', 0.1); },
        playThud: function() { this.playTone(100, 'triangle', 0.1, 0.2); },
        playSplash: function() {
            // Simple noise burst approximation
            if (!this.enabled || !this.ctx) return;
            const bufferSize = this.ctx.sampleRate * 0.5;
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = this.ctx.createBufferSource();
            noise.buffer = buffer;
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
            noise.connect(gain);
            gain.connect(this.ctx.destination);
            noise.start();
        },
        playSuccess: function() {
            if (!this.enabled || !this.ctx) return;
            const now = this.ctx.currentTime;
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + i * 0.1);
                gain.gain.setValueAtTime(0.1, now + i * 0.1);
                gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.5);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now + i * 0.1);
                osc.stop(now + i * 0.1 + 0.5);
            });
        }
    };

    document.getElementById('mute-btn').addEventListener('click', () => {
        if (!AudioEngine.ctx) AudioEngine.init(); // Init on first user interaction
        AudioEngine.enabled = !AudioEngine.enabled;
        document.getElementById('mute-btn').textContent = AudioEngine.enabled ? '🔊' : '🔇';
    });

    // Init audio on first touch anywhere if not ready
    document.addEventListener('touchstart', () => { if(!AudioEngine.ctx) AudioEngine.init(); }, {once:true});
    document.addEventListener('mousedown', () => { if(!AudioEngine.ctx) AudioEngine.init(); }, {once:true});


    // Game State
    let width, height;
    let snowflakes = [];
    let gameObjects = [];
    let confetti = [];
    let draggingItem = null;
    let dragOffsetX = 0;
    let dragOffsetY = 0;

    // Rolling State
    let isRolling = false;
    let rollingBall = null;
    let lastRollPos = {x:0, y:0};

    // Global Animation Time
    let time = 0;
    let windSpeed = 0;

    // Configuration
    const GROUND_HEIGHT_RATIO = 0.25;
    const MAX_SNOWFLAKES = 100;
    const TOOLBAR_HEIGHT = 100;
    const GRAVITY = 0.8;
    const BOUNCE = 0.2;
    const FRICTION = 0.9;

    // Lake Config
    let LAKE_RADIUS = 200;

    // Tools available in the toolbar
    const TOOLS = [
        { type: 'hat', icon: '🎩', x: 0, y: 50, size: 50 },
        { type: 'carrot', icon: '🥕', x: 0, y: 50, size: 40 },
        { type: 'eye', icon: '⚫', x: 0, y: 50, size: 20 },
        { type: 'stick', icon: 'STICK_DRAW', x: 0, y: 50, size: 45 },
        { type: 'scarf', icon: '🧣', x: 0, y: 50, size: 50 },
        { type: 'arms', icon: 'ARMS_DRAW', x: 0, y: 50, size: 40 },
        { type: 'gift', icon: '🎁', x: 0, y: 50, size: 45 } // NEW
    ];

    // =====================================================================
    // --- Presentation layer (visual only: scenery, sprites, particles) ---
    // =====================================================================
    const DPR = Math.min(window.devicePixelRatio || 1, 2);
    const TAU = Math.PI * 2;
    const OUT = '#1f2a44';          // cartoon outline ink
    const PAD = 48;                 // parallax overscan
    const scene = {};
    let fx = [];                    // visual particles
    let tracks = [];                // rolling marks in the snow
    let smoke = [];                 // cabin chimney smoke
    let par = 0, parTarget = 0;     // parallax amount (-0.5 .. 0.5)

    function makeLayer(w, h, scale) {
        const s = scale || DPR;
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.ceil(w * s));
        c.height = Math.max(1, Math.ceil(h * s));
        const x = c.getContext('2d');
        x.setTransform(s, 0, 0, s, 0, 0);
        return { c, x, w, h };
    }
    function mulberry32(a) {
        return function() {
            a |= 0; a = a + 0x6D2B79F5 | 0;
            let t = Math.imul(a ^ a >>> 15, 1 | a);
            t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
    }
    function lin(c, x0, y0, x1, y1, stops) {
        const g = c.createLinearGradient(x0, y0, x1, y1);
        stops.forEach(s => g.addColorStop(s[0], s[1]));
        return g;
    }
    function rad(c, x0, y0, r0, x1, y1, r1, stops) {
        const g = c.createRadialGradient(x0, y0, r0, x1, y1, r1);
        stops.forEach(s => g.addColorStop(s[0], s[1]));
        return g;
    }
    function rrect(c, x, y, w, h, r) {
        c.beginPath();
        c.moveTo(x + r, y);
        c.arcTo(x + w, y, x + w, y + h, r);
        c.arcTo(x + w, y + h, x, y + h, r);
        c.arcTo(x, y + h, x, y, r);
        c.arcTo(x, y, x + w, y, r);
        c.closePath();
    }
    function star4(c, x, y, r) {
        const k = r * 0.22;
        c.beginPath();
        c.moveTo(x, y - r);
        c.quadraticCurveTo(x + k, y - k, x + r, y);
        c.quadraticCurveTo(x + k, y + k, x, y + r);
        c.quadraticCurveTo(x - k, y + k, x - r, y);
        c.quadraticCurveTo(x - k, y - k, x, y - r);
        c.closePath();
    }
    function star5(c, x, y, r) {
        c.beginPath();
        for (let i = 0; i < 10; i++) {
            const a = -Math.PI / 2 + i * Math.PI / 5;
            const rr = i % 2 ? r * 0.45 : r;
            c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
        }
        c.closePath();
    }
    function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

    // ---------- Sprites (built once) ----------
    const SB_R = 120, SB_C = 128;
    const SB = (function() {      // shaded snowball
        const L = makeLayer(256, 256);
        const x = L.x, c = SB_C, r = SB_R;
        x.beginPath(); x.arc(c, c, r, 0, TAU);
        x.fillStyle = rad(x, c - 42, c - 50, 6, c, c, r * 1.02,
            [[0, '#ffffff'], [0.35, '#fbfdff'], [0.7, '#e3edf9'], [0.9, '#c9daf0'], [1, '#aec4e4']]);
        x.fill();
        x.save(); x.clip();
        // bounce light from the snow below
        x.fillStyle = rad(x, c + 20, c + 150, 10, c + 20, c + 150, 120,
            [[0, 'rgba(255,255,255,0.75)'], [1, 'rgba(255,255,255,0)']]);
        x.fillRect(0, 0, 256, 256);
        // soft core shadow band
        x.strokeStyle = 'rgba(120,150,205,0.18)';
        x.lineWidth = 26;
        x.beginPath(); x.arc(c - 18, c - 22, r + 18, 0.05 * Math.PI, 0.75 * Math.PI); x.stroke();
        x.restore();
        // glossy highlight
        x.save(); x.translate(c - 46, c - 52); x.rotate(-0.6);
        x.fillStyle = rad(x, 0, 0, 2, 0, 0, 34, [[0, 'rgba(255,255,255,1)'], [1, 'rgba(255,255,255,0)']]);
        x.beginPath(); x.ellipse(0, 0, 36, 22, 0, 0, TAU); x.fill();
        x.restore();
        // outline
        x.beginPath(); x.arc(c, c, r, 0, TAU);
        x.strokeStyle = 'rgba(58,86,140,0.62)';
        x.lineWidth = 5;
        x.stroke();
        return L;
    })();
    const SHADOW = (function() {
        const L = makeLayer(128, 64);
        const x = L.x;
        x.save(); x.translate(64, 32); x.scale(1, 0.5);
        x.fillStyle = rad(x, 0, 0, 0, 0, 0, 62, [[0, 'rgba(38,58,112,0.5)'], [0.55, 'rgba(38,58,112,0.25)'], [1, 'rgba(38,58,112,0)']]);
        x.beginPath(); x.arc(0, 0, 62, 0, TAU); x.fill();
        x.restore();
        return L;
    })();
    function makeGlow(rgb) {
        const L = makeLayer(128, 128);
        const x = L.x;
        x.fillStyle = rad(x, 64, 64, 0, 64, 64, 64, [[0, `rgba(${rgb},0.9)`], [0.35, `rgba(${rgb},0.35)`], [1, `rgba(${rgb},0)`]]);
        x.fillRect(0, 0, 128, 128);
        return L;
    }
    const GLOW_WARM = makeGlow('255,200,110');
    const GLOW_GOLD = makeGlow('255,236,150');
    const FLAKE = (function() {
        const L = makeLayer(32, 32);
        const x = L.x;
        x.fillStyle = rad(x, 16, 16, 0, 16, 16, 16, [[0, 'rgba(255,255,255,1)'], [0.35, 'rgba(255,255,255,0.85)'], [1, 'rgba(255,255,255,0)']]);
        x.fillRect(0, 0, 32, 32);
        return L;
    })();
    function makeAuroraStrip(c1, c2) {
        const L = makeLayer(8, 256, 1);
        const x = L.x;
        x.fillStyle = lin(x, 0, 0, 0, 256, [[0, `rgba(${c2},0)`], [0.25, `rgba(${c2},0.35)`], [0.55, `rgba(${c1},0.55)`], [0.72, `rgba(${c1},0.9)`], [0.8, `rgba(${c1},0.3)`], [1, `rgba(${c1},0)`]]);
        x.fillRect(0, 0, 8, 256);
        return L;
    }
    const AURORA_A = makeAuroraStrip('110,255,190', '120,170,255');
    const AURORA_B = makeAuroraStrip('190,130,255', '255,140,210');
    const BUTTON = (function() {
        const L = makeLayer(160, 160);
        const x = L.x, c = 80, r = 60;
        x.fillStyle = rad(x, c, c + 12, 0, c, c + 12, r + 14, [[0, 'rgba(5,12,40,0.5)'], [0.75, 'rgba(5,12,40,0.25)'], [1, 'rgba(5,12,40,0)']]);
        x.beginPath(); x.arc(c, c + 12, r + 14, 0, TAU); x.fill();
        x.beginPath(); x.arc(c, c, r, 0, TAU);
        x.fillStyle = rad(x, c - 18, c - 24, 4, c, c, r, [[0, '#ffffff'], [0.55, '#eaf2fd'], [0.85, '#c8daf3'], [1, '#a9c1e6']]);
        x.fill();
        x.lineWidth = 5; x.strokeStyle = 'rgba(255,255,255,0.95)'; x.stroke();
        x.beginPath(); x.arc(c, c, r + 3.5, 0, TAU);
        x.lineWidth = 2.5; x.strokeStyle = 'rgba(20,36,84,0.45)'; x.stroke();
        x.beginPath(); x.ellipse(c, c - r * 0.52, r * 0.62, r * 0.3, 0, 0, TAU);
        x.fillStyle = lin(x, 0, c - r * 0.85, 0, c - r * 0.2, [[0, 'rgba(255,255,255,0.9)'], [1, 'rgba(255,255,255,0)']]);
        x.fill();
        return L;
    })();

    // ---------- Scenery helpers ----------
    function drawPine(x, bx, by, h, col, colDark, snow) {
        const w = h * 0.34;
        x.fillStyle = '#4a3324';
        x.fillRect(bx - h * 0.035, by - h * 0.12, h * 0.07, h * 0.14);
        const tiers = 4;
        for (let i = 0; i < tiers; i++) {
            const tw = w * (1 - i * 0.2);
            const yb = by - h * 0.1 - i * h * 0.2;
            const yt = yb - h * 0.36;
            x.beginPath();
            x.moveTo(bx - tw, yb);
            x.lineTo(bx, yt);
            x.lineTo(bx + tw, yb);
            x.quadraticCurveTo(bx, yb - h * 0.05, bx - tw, yb);
            x.fillStyle = lin(x, bx - tw, 0, bx + tw, 0, [[0, col], [0.55, col], [1, colDark]]);
            x.fill();
            // snow on the tier
            const sy = yt + (yb - yt) * 0.55;
            const sw = tw * 0.55;
            x.beginPath();
            x.moveTo(bx, yt - 1);
            x.lineTo(bx + sw, sy);
            x.quadraticCurveTo(bx + sw * 0.6, sy - h * 0.035, bx + sw * 0.3, sy + h * 0.02);
            x.quadraticCurveTo(bx, sy - h * 0.04, bx - sw * 0.35, sy + h * 0.025);
            x.quadraticCurveTo(bx - sw * 0.7, sy - h * 0.03, bx - sw, sy);
            x.closePath();
            x.fillStyle = snow;
            x.fill();
        }
    }

    function drawCabin(x, cx, by, s) {
        const w = s * 1.3, h = s * 0.72;
        const left = cx - w / 2;
        const info = {};
        // chimney
        x.fillStyle = '#8a4b3a';
        x.fillRect(cx + w * 0.18, by - h - s * 0.62, s * 0.18, s * 0.5);
        x.fillStyle = '#f7fbff';
        rrect(x, cx + w * 0.16, by - h - s * 0.68, s * 0.23, s * 0.09, s * 0.04); x.fill();
        info.chimX = cx + w * 0.18 + s * 0.09;
        info.chimY = by - h - s * 0.68;
        // walls (logs)
        x.fillStyle = lin(x, 0, by - h, 0, by, [[0, '#8b5a36'], [1, '#5e3a22']]);
        x.fillRect(left, by - h, w, h);
        x.strokeStyle = 'rgba(40,20,10,0.35)';
        x.lineWidth = Math.max(1, s * 0.025);
        for (let yy = by - h + h / 5; yy < by; yy += h / 5) {
            x.beginPath(); x.moveTo(left, yy); x.lineTo(left + w, yy); x.stroke();
        }
        // windows
        info.windows = [];
        const ww = s * 0.26, wh = s * 0.24;
        [[left + w * 0.14, by - h * 0.72], [left + w * 0.62, by - h * 0.72]].forEach(([wx, wy]) => {
            x.fillStyle = '#3b2414';
            x.fillRect(wx - 2, wy - 2, ww + 4, wh + 4);
            x.fillStyle = lin(x, 0, wy, 0, wy + wh, [[0, '#fff3b0'], [1, '#ffb347']]);
            x.fillRect(wx, wy, ww, wh);
            x.fillStyle = '#3b2414';
            x.fillRect(wx + ww / 2 - 1, wy, 2, wh);
            x.fillRect(wx, wy + wh / 2 - 1, ww, 2);
            x.fillStyle = '#f7fbff';
            rrect(x, wx - 3, wy + wh, ww + 6, s * 0.06, s * 0.03); x.fill();
            info.windows.push({ x: wx + ww / 2, y: wy + wh / 2, r: s * 0.55 });
        });
        // door
        x.fillStyle = '#4a2a17';
        rrect(x, left + w * 0.42, by - h * 0.62, w * 0.16, h * 0.62, s * 0.05); x.fill();
        x.fillStyle = '#ffd36b';
        x.beginPath(); x.arc(left + w * 0.54, by - h * 0.3, s * 0.02, 0, TAU); x.fill();
        // wreath on door
        x.strokeStyle = '#2f9e44'; x.lineWidth = s * 0.035;
        x.beginPath(); x.arc(left + w * 0.5, by - h * 0.47, s * 0.05, 0, TAU); x.stroke();
        x.fillStyle = '#e03131';
        x.beginPath(); x.arc(left + w * 0.5, by - h * 0.41, s * 0.018, 0, TAU); x.fill();
        // roof
        const ov = s * 0.14;
        x.beginPath();
        x.moveTo(left - ov, by - h + s * 0.02);
        x.lineTo(cx, by - h - s * 0.55);
        x.lineTo(left + w + ov, by - h + s * 0.02);
        x.closePath();
        x.fillStyle = '#5a2f22'; x.fill();
        // thick snow on the roof
        x.beginPath();
        x.moveTo(left - ov - s * 0.04, by - h + s * 0.03);
        x.lineTo(cx, by - h - s * 0.62);
        x.lineTo(left + w + ov + s * 0.04, by - h + s * 0.03);
        x.quadraticCurveTo(left + w + ov - s * 0.05, by - h + s * 0.1, left + w * 0.8, by - h + s * 0.02);
        x.quadraticCurveTo(left + w * 0.7, by - h + s * 0.12, left + w * 0.55, by - h + s * 0.02);
        x.quadraticCurveTo(left + w * 0.35, by - h + s * 0.1, left + w * 0.2, by - h + s * 0.02);
        x.quadraticCurveTo(left, by - h + s * 0.12, left - ov - s * 0.04, by - h + s * 0.03);
        x.closePath();
        x.fillStyle = lin(x, 0, by - h - s * 0.6, 0, by - h + s * 0.1, [[0, '#ffffff'], [1, '#d9e5f6']]);
        x.fill();
        // icicles under roof
        x.fillStyle = 'rgba(220,240,255,0.95)';
        for (let i = 0; i < 6; i++) {
            const ix = left + w * (0.08 + i * 0.17);
            x.beginPath(); x.moveTo(ix - s * 0.025, by - h + s * 0.05); x.lineTo(ix + s * 0.025, by - h + s * 0.05);
            x.lineTo(ix, by - h + s * (0.12 + (i % 2) * 0.06)); x.closePath(); x.fill();
        }
        return info;
    }

    function hillY(xx, base, amp, f1, f2, p1, p2) {
        return base - amp * (0.55 + 0.3 * Math.sin(xx * f1 + p1) + 0.15 * Math.sin(xx * f2 + p2));
    }

    function ridge(rng, n, rough) {
        const pts = new Array(n + 1).fill(0);
        pts[0] = rng(); pts[n] = rng();
        let step = n, disp = 1;
        while (step > 1) {
            const half = step / 2;
            for (let i = half; i < n; i += step) pts[i] = (pts[i - half] + pts[i + half]) / 2 + (rng() - 0.5) * disp;
            step = half; disp *= rough;
        }
        let mn = Infinity, mx = -Infinity;
        pts.forEach(p => { mn = Math.min(mn, p); mx = Math.max(mx, p); });
        return pts.map(p => (p - mn) / (mx - mn || 1));
    }

    function buildScene() {
        const gY = height - (height * GROUND_HEIGHT_RATIO);
        const top = TOOLBAR_HEIGHT;
        const span = clamp(gY - top, 90, Math.max(460, (gY - top) * 0.72));
        const S = span / 460;
        const rng = mulberry32(20241225);
        scene.gY = gY; scene.span = span;
        const skyBot = gY - span * 0.6;

        // ---- SKY (1x is plenty for smooth gradients) ----
        const sky = makeLayer(width, gY + 60, 1);
        let x = sky.x;
        x.fillStyle = lin(x, 0, 0, 0, gY + 60, [[0, '#070d2e'], [0.25, '#13205a'], [0.5, '#2c3a86'], [0.72, '#6a63b0'], [0.88, '#c993c2'], [1, '#f6c2c4']]);
        x.fillRect(0, 0, width, gY + 60);
        // moon
        const mr = clamp(span * 0.075, 14, 36);
        const mx = width * 0.8, my = top + Math.max(mr + 14, (skyBot - top) * 0.42);
        scene.moon = { x: mx, y: my, r: mr };
        x.fillStyle = rad(x, mx, my, mr, mx, my, mr * 6, [[0, 'rgba(255,245,215,0.45)'], [0.3, 'rgba(255,230,200,0.12)'], [1, 'rgba(255,230,200,0)']]);
        x.fillRect(mx - mr * 6, my - mr * 6, mr * 12, mr * 12);
        x.beginPath(); x.arc(mx, my, mr, 0, TAU);
        x.fillStyle = rad(x, mx - mr * 0.35, my - mr * 0.35, 1, mx, my, mr, [[0, '#fffdf2'], [0.7, '#fff2c9'], [1, '#f2dca6']]);
        x.fill();
        x.fillStyle = 'rgba(214,190,140,0.35)';
        [[0.3, -0.2, 0.22], [-0.35, 0.25, 0.16], [0.1, 0.42, 0.11], [-0.2, -0.4, 0.09]].forEach(([a, b, r]) => {
            x.beginPath(); x.arc(mx + a * mr, my + b * mr, r * mr, 0, TAU); x.fill();
        });
        // gentle top vignette
        x.fillStyle = lin(x, 0, 0, 0, top + 80, [[0, 'rgba(0,0,20,0.35)'], [1, 'rgba(0,0,20,0)']]);
        x.fillRect(0, 0, width, top + 80);
        scene.sky = sky;

        // stars
        scene.stars = [];
        const starCount = Math.round(clamp(width * (skyBot - top) / 5000, 30, 140));
        for (let i = 0; i < starCount; i++) {
            scene.stars.push({ x: rng() * width, y: top * 0.4 + rng() * (skyBot + span * 0.15 - top * 0.4),
                r: 0.6 + rng() * 1.3, p: rng() * TAU, f: 0.02 + rng() * 0.05, big: rng() < 0.12 });
        }
        // aurora ribbons
        const aTop = top + 6;
        const aH = Math.max(60, (skyBot - top) * 0.75 + span * 0.12);
        scene.aurora = [
            { sp: AURORA_A, y: aTop, h: aH, a1: aH * 0.18, a2: aH * 0.1, f1: 0.0045, f2: 0.011, s1: 0.008, s2: 0.006, f3: 0.0035, p: 0.5, alpha: 0.5 },
            { sp: AURORA_B, y: aTop + aH * 0.15, h: aH * 0.8, a1: aH * 0.14, a2: aH * 0.08, f1: 0.006, f2: 0.014, s1: 0.006, s2: 0.009, f3: 0.005, p: 2.4, alpha: 0.32 }
        ];

        const W2 = width + PAD * 2;

        // ---- MOUNTAINS ----
        const mTop = gY - span * 0.62 - 8;
        const mtn = makeLayer(W2, gY + 30 - mTop);
        x = mtn.x; x.translate(0, -mTop);
        const ranges = [
            { amp: 0.6, lo: 0.35, c1: '#8090cc', c2: '#b4b3df', snow: '#f1f0ff', rough: 0.55 },
            { amp: 0.42, lo: 0.25, c1: '#5e6db4', c2: '#a49fd4', snow: '#e7e9ff', rough: 0.5 }
        ];
        ranges.forEach(rg => {
            const n = 64;
            const pts = ridge(rng, n, rg.rough);
            const ys = pts.map(p => gY + 20 - (rg.lo + (1 - rg.lo) * p) * span * rg.amp);
            const path = () => {
                x.beginPath(); x.moveTo(0, gY + 30);
                for (let i = 0; i <= n; i++) x.lineTo(i / n * W2, ys[i]);
                x.lineTo(W2, gY + 30); x.closePath();
            };
            path();
            x.fillStyle = lin(x, 0, gY - span * rg.amp, 0, gY + 20, [[0, rg.c1], [1, rg.c2]]);
            x.fill();
            // snow caps
            x.save(); path(); x.clip();
            const capBase = gY + 20 - span * rg.amp * 0.68;
            x.beginPath(); x.moveTo(0, mTop - 10);
            for (let xx = 0; xx <= W2; xx += 14) x.lineTo(xx, capBase + ((xx / 14) % 2 ? 9 : -5) * S + Math.sin(xx * 0.02) * 10 * S);
            x.lineTo(W2, mTop - 10); x.closePath();
            x.fillStyle = lin(x, 0, mTop, 0, capBase + 10, [[0, '#ffffff'], [1, rg.snow]]);
            x.fill();
            // moonlit faces: light the slopes that face right
            x.fillStyle = 'rgba(255,255,255,0.12)';
            for (let i = 0; i < n; i++) {
                if (ys[i + 1] < ys[i]) continue;
                x.beginPath(); x.moveTo(i / n * W2, ys[i]); x.lineTo((i + 1) / n * W2, ys[i + 1]);
                x.lineTo((i + 1) / n * W2, gY + 30); x.lineTo(i / n * W2, gY + 30); x.closePath(); x.fill();
            }
            x.restore();
        });
        // haze
        x.fillStyle = lin(x, 0, gY - span * 0.3, 0, gY + 20, [[0, 'rgba(240,200,225,0)'], [1, 'rgba(240,205,230,0.55)']]);
        x.fillRect(0, gY - span * 0.3, W2, span * 0.3 + 30);
        scene.mtn = mtn; scene.mtnTop = mTop;

        // ---- MID HILLS with distant pines ----
        const hTop = gY - span * 0.36;
        const mid = makeLayer(W2, gY + 30 - hTop);
        x = mid.x; x.translate(0, -hTop);
        const midY = xx => hillY(xx, gY + 6, span * 0.26, 0.0042, 0.011, 1.3, 0.2);
        const midTrees = [];
        for (let xx = 0; xx < W2; xx += (14 + rng() * 34) * Math.max(0.6, S)) {
            if (rng() < 0.55) midTrees.push([xx, midY(xx) + 4 + rng() * 8, (16 + rng() * 22) * Math.max(0.55, S)]);
        }
        midTrees.forEach(t => drawPine(x, t[0], t[1], t[2], '#6b7fb8', '#56679e', '#e6ecfb'));
        x.beginPath(); x.moveTo(0, gY + 30);
        for (let xx = 0; xx <= W2; xx += 8) x.lineTo(xx, midY(xx));
        x.lineTo(W2, gY + 30); x.closePath();
        x.fillStyle = lin(x, 0, gY - span * 0.3, 0, gY + 10, [[0, '#cfdcf3'], [1, '#aebfe4']]);
        x.fill();
        // front row of distant pines sitting on the hill line
        for (let i = 0; i < midTrees.length; i += 2) {
            const t = midTrees[i];
            drawPine(x, t[0] + 9, midY(t[0] + 9) + 6, t[2] * 0.9, '#5d73ad', '#4b5e96', '#eef2fd');
        }
        scene.mid = mid; scene.midTop = hTop;

        // ---- NEAR HILLS: big pines + cozy cabin ----
        const nTop = gY - span * 0.5;
        const near = makeLayer(W2, gY + 30 - nTop);
        x = near.x; x.translate(0, -nTop);
        const nearY = xx => hillY(xx, gY + 4, span * 0.13, 0.0031, 0.0093, 4.1, 1.7);
        x.beginPath(); x.moveTo(0, gY + 30);
        for (let xx = 0; xx <= W2; xx += 8) x.lineTo(xx, nearY(xx));
        x.lineTo(W2, gY + 30); x.closePath();
        x.fillStyle = lin(x, 0, gY - span * 0.15, 0, gY + 20, [[0, '#f5f8fe'], [1, '#d3dff3']]);
        x.fill();
        x.strokeStyle = 'rgba(255,255,255,0.9)'; x.lineWidth = 2;
        x.beginPath();
        for (let xx = 0; xx <= W2; xx += 8) xx === 0 ? x.moveTo(xx, nearY(xx)) : x.lineTo(xx, nearY(xx));
        x.stroke();
        const cabS = clamp(span * 0.15, 26, 66);
        const cabX = PAD + Math.max(cabS * 1.4, width * (width > 700 ? 0.17 : 0.2));
        const cabBase = nearY(cabX) + cabS * 0.12;
        // trees: clusters, avoiding the cabin
        const nearTrees = [];
        for (let xx = 10; xx < W2; xx += (40 + rng() * 90) * Math.max(0.6, S)) {
            if (Math.abs(xx - cabX) < cabS * 1.3) continue;
            if (rng() < 0.5) continue;
            const cnt = 1 + Math.floor(rng() * 3);
            for (let k = 0; k < cnt; k++) {
                const tx = xx + k * 22 * S + rng() * 10;
                if (Math.abs(tx - cabX) < cabS * 1.3) continue;
                nearTrees.push([tx, nearY(tx) + 6 + rng() * 10, (50 + rng() * 60) * Math.max(0.5, S)]);
            }
        }
        // two trees framing the cabin
        nearTrees.push([cabX - cabS * 1.25, nearY(cabX - cabS * 1.25) + 10, 92 * Math.max(0.5, S)]);
        nearTrees.push([cabX + cabS * 1.3, nearY(cabX + cabS * 1.3) + 8, 70 * Math.max(0.5, S)]);
        nearTrees.sort((a, b) => a[1] - b[1]);
        const cab = drawCabin(x, cabX, cabBase, cabS);
        nearTrees.forEach(t => drawPine(x, t[0], t[1], t[2], '#2d6268', '#1f4a51', '#f7fbff'));
        // fairy lights garland on the cabin's framing tree
        scene.lights = [];
        const ft = nearTrees.find(t => Math.abs(t[0] - (cabX - cabS * 1.25)) < 1);
        if (ft) {
            for (let i = 0; i < 9; i++) {
                const k = i / 8;
                const ty = ft[1] - ft[2] * (0.18 + k * 0.62);
                const tw = ft[2] * 0.3 * (1 - k * 0.8);
                scene.lights.push({ x: ft[0] - PAD + (i % 2 ? tw : -tw) * 0.6, y: ty, c: ['255,90,90', '255,220,90', '120,220,255', '140,255,150'][i % 4], p: i * 1.3 });
            }
        }
        scene.near = near; scene.nearTop = nTop;
        scene.cabin = { chimX: cab.chimX - PAD, chimY: cab.chimY, windows: cab.windows.map(w => ({ x: w.x - PAD, y: w.y, r: w.r })) };

        // ---- GROUND + LAKE (no parallax: it's the play field) ----
        const gTop = Math.min(gY - 24, height - LAKE_RADIUS - 28);
        const ground = makeLayer(width, height - gTop);
        x = ground.x; x.translate(0, -gTop);
        const edge = xx => gY + 5 * Math.sin(xx * 0.006 + 0.7) + 7 * Math.sin(xx * 0.0021 + 2);
        const groundPath = () => {
            x.beginPath(); x.moveTo(0, height + 2);
            for (let xx = 0; xx <= width + 8; xx += 8) x.lineTo(xx, edge(xx));
            x.lineTo(width, height + 2); x.closePath();
        };
        groundPath();
        x.fillStyle = lin(x, 0, gY - 12, 0, height, [[0, '#cbd9f0'], [0.12, '#e3ecf9'], [0.5, '#f1f6fd'], [1, '#e1eaf8']]);
        x.fill();
        x.save(); groundPath(); x.clip();
        // soft shadow band under the horizon
        x.fillStyle = lin(x, 0, gY - 10, 0, gY + 40, [[0, 'rgba(140,160,215,0.35)'], [1, 'rgba(140,160,215,0)']]);
        x.fillRect(0, gY - 12, width, 54);
        // drifts
        const grng = mulberry32(77);
        const nd = Math.max(4, Math.round(width / 220));
        for (let i = 0; i < nd; i++) {
            const dx = (i + 0.2 + grng() * 0.6) / nd * width;
            const dy = gY + 40 + grng() * (height - gY - 70);
            const rw = 70 + grng() * 120, rh = 10 + grng() * 16;
            x.fillStyle = lin(x, 0, dy - rh, 0, dy + rh, [[0, 'rgba(255,255,255,0.95)'], [0.6, 'rgba(250,252,255,0.6)'], [1, 'rgba(170,190,228,0.45)']]);
            x.beginPath(); x.ellipse(dx, dy, rw, rh, 0, Math.PI, TAU); x.fill();
            x.fillStyle = 'rgba(170,190,228,0.25)';
            x.beginPath(); x.ellipse(dx + rw * 0.1, dy + 1, rw * 0.95, rh * 0.35, 0, 0, Math.PI); x.fill();
        }
        // tiny blue snow texture
        for (let i = 0; i < width * 0.25; i++) {
            const tx = grng() * width, ty = gY + 10 + grng() * (height - gY);
            x.fillStyle = `rgba(150,175,220,${0.08 + grng() * 0.12})`;
            x.beginPath(); x.ellipse(tx, ty, 2 + grng() * 4, 1 + grng() * 1.4, 0, 0, TAU); x.fill();
        }
        x.restore();
        // crisp highlight on the ground's edge
        x.strokeStyle = 'rgba(255,255,255,0.95)'; x.lineWidth = 2.5;
        x.beginPath();
        for (let xx = 0; xx <= width + 8; xx += 8) xx === 0 ? x.moveTo(xx, edge(xx)) : x.lineTo(xx, edge(xx));
        x.stroke();

        // lake (bottom-right corner, same circle the physics uses)
        const R = LAKE_RADIUS, LX = width, LY = height;
        x.beginPath(); x.arc(LX, LY, R + 18, 0, TAU);
        x.fillStyle = rad(x, LX, LY, R, LX, LY, R + 18, [[0, 'rgba(150,175,220,0.7)'], [1, 'rgba(255,255,255,0)']]);
        x.fill();
        x.beginPath(); x.arc(LX, LY, R + 7, 0, TAU);
        x.fillStyle = '#f7faff'; x.fill();
        x.beginPath(); x.arc(LX, LY, R, 0, TAU);
        x.fillStyle = rad(x, LX, LY, 0, LX, LY, R, [[0, '#0a2f63'], [0.5, '#12569a'], [0.82, '#2a85cc'], [0.96, '#6cc0f2'], [1, '#bfe8ff']]);
        x.fill();
        x.save(); x.beginPath(); x.arc(LX, LY, R, 0, TAU); x.clip();
        // moon reflection streak
        x.fillStyle = 'rgba(255,240,200,0.18)';
        for (let i = 0; i < 6; i++) {
            const ry = LY - R * (0.78 - i * 0.12);
            x.beginPath(); x.ellipse(LX - R * 0.42 + (i % 2) * 6, ry, R * (0.12 - i * 0.012), 2.5, 0, 0, TAU); x.fill();
        }
        // ice floes near the rim
        for (let i = 0; i < 5; i++) {
            const a = Math.PI + 0.12 + (i / 5) * (Math.PI / 2 - 0.2) + grng() * 0.12;
            const d = R * (0.8 + grng() * 0.1);
            const fx0 = LX + Math.cos(a) * d, fy0 = LY + Math.sin(a) * d;
            x.fillStyle = 'rgba(236,248,255,0.9)';
            x.beginPath(); x.ellipse(fx0, fy0, 10 + grng() * 14, 5 + grng() * 5, a + Math.PI / 2, 0, TAU); x.fill();
            x.fillStyle = 'rgba(120,170,220,0.4)';
            x.beginPath(); x.ellipse(fx0 + 1, fy0 + 3, 9 + grng() * 10, 2.5, a + Math.PI / 2, 0, Math.PI); x.fill();
        }
        x.restore();
        x.beginPath(); x.arc(LX, LY, R - 2, 0, TAU);
        x.strokeStyle = 'rgba(220,244,255,0.95)'; x.lineWidth = 4; x.stroke();
        x.beginPath(); x.arc(LX, LY, R + 7, 0, TAU);
        x.strokeStyle = 'rgba(110,140,195,0.55)'; x.lineWidth = 2; x.stroke();
        // reeds poking out of the snow bank
        for (let i = 0; i < 4; i++) {
            const a = Math.PI + 0.25 + i * 0.32;
            const bx = LX + Math.cos(a) * (R + 12), by = LY + Math.sin(a) * (R + 12);
            x.strokeStyle = '#7b6a4a'; x.lineWidth = 2; x.lineCap = 'round';
            for (let k = -1; k <= 1; k++) {
                x.beginPath(); x.moveTo(bx + k * 4, by); x.quadraticCurveTo(bx + k * 6, by - 14, bx + k * 9, by - 26 - Math.abs(k) * -4); x.stroke();
            }
            x.fillStyle = '#5a3e26';
            x.beginPath(); x.ellipse(bx, by - 24, 3, 7, 0, 0, TAU); x.fill();
            x.fillStyle = '#ffffff';
            x.beginPath(); x.ellipse(bx, by - 29, 3, 2, 0, 0, TAU); x.fill();
        }
        scene.ground = ground; scene.groundTop = gTop;

        // sparkle points on the snow
        scene.sparkles = [];
        for (let i = 0; i < Math.round(width / 22); i++) {
            const sx = grng() * width, sy = gY + 12 + grng() * (height - gY - 16);
            if (Math.hypot(sx - LX, sy - LY) < R + 24) continue;
            scene.sparkles.push({ x: sx, y: sy, p: grng() * TAU, f: 0.02 + grng() * 0.03, s: 3 + grng() * 4 });
        }

        // ---- TOOLBAR panel (frosted night glass with a snowy ledge + icicles) ----
        const T = TOOLBAR_HEIGHT;
        const tb = makeLayer(width, T + 34);
        x = tb.x;
        x.fillStyle = lin(x, 0, 0, 0, T, [[0, 'rgba(8,16,52,0.82)'], [1, 'rgba(26,44,110,0.62)']]);
        x.fillRect(0, 0, width, T);
        x.fillStyle = 'rgba(255,255,255,0.08)';
        x.fillRect(0, 0, width, 1.5);
        const trng = mulberry32(9);
        for (let xx = 0; xx < width; xx += 12 + trng() * 22) {
            const len = 6 + trng() * 20;
            x.beginPath(); x.moveTo(xx - 4, T + 2); x.lineTo(xx + 4, T + 2); x.lineTo(xx + trng() * 2 - 1, T + 2 + len); x.closePath();
            x.fillStyle = lin(x, 0, T, 0, T + len, [[0, 'rgba(235,248,255,0.95)'], [1, 'rgba(160,210,250,0.35)']]);
            x.fill();
        }
        x.beginPath(); x.moveTo(0, T + 5);
        let bx = 0;
        x.lineTo(0, T - 7);
        while (bx < width) {
            const bw = 18 + trng() * 26;
            x.quadraticCurveTo(bx + bw / 2, T - 13 - trng() * 6, bx + bw, T - 7);
            bx += bw;
        }
        x.lineTo(width, T + 5);
        bx = width;
        while (bx > 0) {
            const bw = 26 + trng() * 30;
            x.quadraticCurveTo(bx - bw / 2, T + 9, bx - bw, T + 4);
            bx -= bw;
        }
        x.closePath();
        x.fillStyle = lin(x, 0, T - 16, 0, T + 8, [[0, '#ffffff'], [1, '#cddcf2']]);
        x.fill();
        x.strokeStyle = 'rgba(120,150,205,0.7)'; x.lineWidth = 1.5; x.stroke();
        scene.toolbar = tb;
    }

    // Initialization
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.round(width * DPR);
        canvas.height = Math.round(height * DPR);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

        LAKE_RADIUS = Math.min(width, height) * 0.35;
        if (LAKE_RADIUS < 150) LAKE_RADIUS = 150;

        const spacing = width / TOOLS.length;
        TOOLS.forEach((tool, index) => {
            tool.x = (spacing * index) + (spacing / 2);
        });

        buildScene();
    }

    window.addEventListener('resize', resize);
    resize();

    // Parallax follows the finger / mouse (visual only)
    window.addEventListener('pointermove', e => { parTarget = e.clientX / width - 0.5; }, {passive: true});
    window.addEventListener('pointerdown', e => { parTarget = e.clientX / width - 0.5; }, {passive: true});

    // ---------- Visual particles & juice hooks ----------
    function addFx(p) { if (fx.length < 450) fx.push(p); }
    function fxPuff(x, y, n, spread, up) {
        for (let i = 0; i < n; i++) {
            addFx({ k: 'puff', x: x + (Math.random() - 0.5) * spread * 0.6, y, vx: (Math.random() - 0.5) * spread * 0.25,
                vy: -Math.random() * (up || 2), g: 0.06, life: 0, max: 26 + Math.random() * 22, r: 3 + Math.random() * 5, grow: 0.12 });
        }
    }
    function fxSparkle(x, y, n, colors, speed) {
        for (let i = 0; i < n; i++) {
            const a = Math.random() * TAU, sp = (speed || 3) * (0.4 + Math.random());
            addFx({ k: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1, g: 0.04, life: 0, max: 34 + Math.random() * 26,
                r: 4 + Math.random() * 6, rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 0.3,
                c: colors[Math.floor(Math.random() * colors.length)] });
        }
    }
    function fxRing(x, y, r0, r1, c, max) { addFx({ k: 'ring', x, y, r0, r1, c, life: 0, max: max || 30, vx: 0, vy: 0, g: 0 }); }
    function fxLand(o, vy) {
        const v = getVis(o);
        v.sq = Math.min(0.28, Math.abs(vy) * 0.028);
        v.sqv = 0;
        const bottom = o.y + (o.type === 'snowball' ? o.size : o.size / 2);
        fxPuff(o.x, bottom, Math.min(12, 3 + Math.abs(vy) | 0), (o.type === 'snowball' ? o.size : o.size * 0.6) * 1.6, 1.5);
    }
    function fxSplash(o) {
        for (let i = 0; i < 14; i++) {
            const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.2, sp = 2 + Math.random() * 4;
            addFx({ k: 'drop', x: o.x, y: o.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 0.25, life: 0, max: 40, r: 2 + Math.random() * 3 });
        }
        fxRing(o.x, o.y, 6, 60, '200,235,255', 40);
    }

            v.px = o.x;
            // squash spring
            v.sqv += -v.sq * 0.3; v.sqv *= 0.72; v.sq += v.sqv;

            if (o.type === 'snowball' && o.isAlive && Math.random() < 0.035) {
                const a = Math.random() * TAU;
                fxSparkle(o.x + Math.cos(a) * o.size, o.y + Math.sin(a) * o.size, 1, ['255,236,150', '255,255,255', '170,230,255'], 0.8);
            }
        });
        TOOLS.forEach(t => {
            if (t.sc === undefined) { t.sc = 1; t.scv = 0; }
            t.scv += (1 - t.sc) * 0.3; t.scv *= 0.7; t.sc += t.scv;

        for (let i = fx.length - 1; i >= 0; i--) {
            const p = fx[i];

        for (let i = tracks.length - 1; i >= 0; i--) { if (++tracks[i].life >= tracks[i].max) tracks.splice(i, 1); }

        if (scene.cabin && time % 14 === 0) smoke.push({ x: scene.cabin.chimX + (Math.random() - 0.5) * 3, y: scene.cabin.chimY, r: 4 + Math.random() * 3, life: 0, max: 150 + Math.random() * 40, ph: Math.random() * TAU });

    }

        c.quadraticCurveTo(s * 0.45, s * 0.06, s * 0.62, s * 0.2);
        c.quadraticCurveTo(s * 0.4, s * 0.32, s * 0.04, s * 0.25); c.closePath();
        c.fillStyle = '#1864ab'; c.fill(); c.stroke();
        c.beginPath(); c.moveTo(-s * 0.42, s * 0.2);
        c.bezierCurveTo(-s * 0.44, -s * 0.42, s * 0.34, -s * 0.44, s * 0.36, s * 0.18);
        c.quadraticCurveTo(-s * 0.03, s * 0.26, -s * 0.42, s * 0.2); c.closePath();
        c.fillStyle = lin(c, 0, -s * 0.3, 0, s * 0.22, [[0, '#74c0fc'], [0.5, '#339af0'], [1, '#1971c2']]); c.fill(); c.stroke();
        c.strokeStyle = 'rgba(16,60,120,0.45)'; c.lineWidth = Math.max(1, s * 0.025);
        c.beginPath(); c.moveTo(-s * 0.04, -s * 0.27); c.quadraticCurveTo(-s * 0.08, 0, -s * 0.03, s * 0.22); c.stroke();
        c.beginPath(); c.moveTo(-s * 0.04, -s * 0.27); c.quadraticCurveTo(-s * 0.32, -s * 0.1, -s * 0.36, s * 0.18); c.stroke();
        c.fillStyle = '#ffd43b'; c.strokeStyle = OUT; c.lineWidth = Math.max(1, s * 0.025);
        star5(c, s * 0.14, -s * 0.02, s * 0.1); c.fill(); c.stroke();
        c.beginPath(); c.arc(-s * 0.04, -s * 0.28, s * 0.05, 0, TAU);
        c.fillStyle = '#1864ab'; c.lineWidth = Math.max(1.4, s * 0.035); c.fill(); c.stroke();
    }
    function drawItemArt(c, icon, s, type, blink) {
        if (type === 'gift') return drawGift(c);
        switch (icon) {
            case 'STICK_DRAW': return drawStick(c, s);
            case 'ARMS_DRAW': return drawArms(c, s);
            case '🎩': return drawHat(c, s);
            case '🥕': return drawCarrot(c, s);
            case '⚫': return drawCoal(c, s, blink === undefined ? 1 : blink);
            case '🧣': return drawScarf(c, s);
            case '👑': return drawCrown(c, s);
            case '👓': return drawGlasses(c, s);
            case '🎀': return drawBow(c, s);
            case '🍭': return drawLollipop(c, s);
            case '🧢': return drawCap(c, s);
        }
        c.font = `${s}px Arial`; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillStyle = 'rgba(0,0,0,0.2)'; c.fillText(icon, 2, 2);
        c.fillStyle = '#000'; c.fillText(icon, 0, 0);
    }

    function drawSnowball(o, dx) {
        const r = o.size, v = getVis(o);
        ctx.save();
        ctx.translate(dx, o.y + r);
        ctx.scale(v.sc * (1 + v.sq), v.sc * (1 - v.sq));
        ctx.translate(0, -r);
        const k = r / SB_R;
        ctx.drawImage(SB.c, -SB_C * k, -SB_C * k, SB.w * k, SB.h * k);
        if (r > 9) {
            ctx.strokeStyle = 'rgba(130,160,210,0.4)';
            ctx.lineWidth = Math.max(1, r * 0.035);
            ctx.lineCap = 'round';
            for (const sp of v.spk) {
                const a = sp.a + v.angle;
                const px = Math.cos(a) * sp.d * r, py = Math.sin(a) * sp.d * r;
                ctx.beginPath(); ctx.arc(px, py, sp.s * r, a + 0.4, a + 0.4 + sp.ar); ctx.stroke();
            }
        }
        ctx.restore();
    }
    // ---------- end presentation helpers ----------

    // --- Classes ---

    const CONFETTI_COLORS = ['#ff4d6d', '#ffd43b', '#4dabf7', '#69db7c', '#ffffff', '#b197fc', '#ff922b'];
    class Confetti {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.vx = (Math.random() - 0.5) * 10;
            this.vy = (Math.random() - 0.5) * 10 - 5;
            this.size = Math.random() * 5 + 5;
            this.color = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
            this.life = 100;
            this.rot = Math.random() * TAU;
            this.vr = (Math.random() - 0.5) * 0.4;
            this.flip = Math.random() * TAU;
            this.round = Math.random() < 0.25;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += 0.2; // Gravity
            this.vx *= 0.95;
            this.life -= 1;
            this.rot += this.vr;
            this.flip += 0.2;
        }
        draw() {
            ctx.save();
            ctx.translate(this.x + this.size / 2, this.y + this.size / 2);
            ctx.rotate(this.rot);
            ctx.scale(1, Math.cos(this.flip));
            ctx.globalAlpha = Math.min(1, this.life / 25);
            ctx.fillStyle = this.color;
            if (this.round) { ctx.beginPath(); ctx.arc(0, 0, this.size / 2, 0, TAU); ctx.fill(); }
            else ctx.fillRect(-this.size / 2, -this.size * 0.3, this.size, this.size * 0.6);
            ctx.restore();
        }
    }

    class Snowflake {
        constructor() {
            this.reset();
        }

        reset() {
            this.z = Math.random(); // depth (visual only)
            this.x = Math.random() * width;
            this.y = Math.random() * -height;
            this.size = Math.random() * 3 + 2;
            this.speed = (Math.random() * 1 + 0.5) * (0.6 + 0.7 * this.z);
            this.wobble = Math.random() * Math.PI * 2;
        }

        update() {
            this.y += this.speed;
            this.x += Math.sin(this.wobble) * 0.5 + windSpeed * 2; // Add wind
            this.wobble += 0.05;

            if (this.y > height - (height * GROUND_HEIGHT_RATIO) + 20) {
                this.reset();
            }
        }

        draw() {
            const r = this.size * (0.55 + 0.9 * this.z) * 1.5;
            ctx.globalAlpha = 0.45 + 0.5 * this.z;
            ctx.drawImage(FLAKE.c, this.x - r, this.y - r, r * 2, r * 2);
            ctx.globalAlpha = 1;
        }
    }

    class GameObject {
        constructor(type, x, y, size, icon = null) {
            this.type = type; // 'snowball', 'decoration', 'gift'
            this.x = x;
            this.y = y;
            this.size = size;
            this.icon = icon;
            this.isDragging = false;
            this.isDead = false;

            // Physics properties
            this.vx = 0;
            this.vy = 0;
            this.mass = type === 'snowball' ? size : size * 0.5;

            // Attachment properties
            this.parent = null;
            this.children = [];
            this.offsetX = 0;
            this.offsetY = 0;

            // Animation
            this.rotation = 0;
            this.danceOffset = 0;
            this.isAlive = false; // For snowman stack
        }

        updatePhysics(groundLevel, allObjects) {
            // "Living" Animation state (if part of a complete snowman)
            if (this.parent && this.parent.isAlive) {
                this.isAlive = true;
            }
            if (this.isAlive && !this.isDragging) {
                // Gentle sway
                this.danceOffset = Math.sin(time * 0.05 + (this.y * 0.01)) * 3;
            } else {
                this.danceOffset = 0;
            }

            // If attached to a parent, just follow it.
            if (this.parent) {
                this.x = this.parent.x + this.offsetX + this.danceOffset;
                this.y = this.parent.y + this.offsetY;
                // Add sway to rotation for arms/scarf
                if (this.type === 'decoration') {
                    this.rotation = Math.sin(time * 0.1) * 0.1;
                }
                this.vx = 0;
                this.vy = 0;
                return;
            }

            // Check Lake Collision
            const distToLake = Math.sqrt((this.x - width)**2 + (this.y - height)**2);
            if (distToLake < LAKE_RADIUS) {
                if (!this.sinking) { AudioEngine.playSplash(); fxSplash(this); }
                this.sinking = true;

                this.x += (width - this.x) * 0.05;
                this.y += 2;
                this.size *= 0.95;

                if (this.size < 5) {
                    this.isDead = true;
                    if (this.children.length > 0) {
                        this.children.forEach(child => child.isDead = true);
                    }
                }
                return;
            }

            if (this.isDragging) {
                this.vx = 0;
                this.vy = 0;
                return;
            }

            // LOCK PHYSICS for Living Snowmen so they don't fall off while dancing
            if (this.isAlive) {
                this.vx = 0;
                this.vy = 0;
                return;
            }

            // Apply Gravity
            this.vy += GRAVITY;
            this.y += this.vy;
            this.x += this.vx;

            // Air Friction
            this.vx *= FRICTION;

            // 1. Ground Collision
            let bottomY = this.y + (this.type === 'snowball' ? this.size : this.size/2);

            if (bottomY > groundLevel) {
                this.y = groundLevel - (this.type === 'snowball' ? this.size : this.size/2);

                // Play thud sound on impact if speed was high
                if (Math.abs(this.vy) > 2) { AudioEngine.playThud(); fxLand(this, this.vy); }

                this.vy *= -BOUNCE;
                if (Math.abs(this.vy) < 1) this.vy = 0;
                this.vx *= 0.8;
            }

            // 2. Object Collision
            for (let other of allObjects) {
                if (other === this) continue;
                if (other.isDragging) continue;
                if (other.parent) continue;
                if (other.isDead) continue;

                let dist = Math.sqrt((this.x - other.x)**2 + (this.y - other.y)**2);
                let minDist = (this.type === 'snowball' ? this.size : 15) +
                              (other.type === 'snowball' ? other.size : 15);

                if (dist < minDist && this.y < other.y) {
                    let angle = Math.atan2(this.y - other.y, this.x - other.x);
                    let overlap = minDist - dist;
                    this.y += Math.sin(angle) * overlap;
                    this.vx += Math.cos(angle) * 0.1;
                    this.vy *= -0.1;
                    this.vx *= 0.6;

                    // Trigger sound on collision occasionally
                    if (Math.abs(this.vy) > 1) AudioEngine.playThud();
                }
            }

            // Screen Boundaries
            if (this.x < 0) { this.x = 0; this.vx *= -1; }
            if (this.x > width) { this.x = width; this.vx *= -1; }
        }

        draw() {
            const drawX = this.x + this.danceOffset;

            if (this.type === 'snowball') {
                drawSnowball(this, drawX);
                return;
            }

            const v = getVis(this);
            ctx.save();
            ctx.translate(drawX, this.y);
            if (this.icon === 'STICK_DRAW') {
                ctx.rotate(this.rotation);
            } else if (this.icon === 'ARMS_DRAW') {
                ctx.rotate(this.rotation + Math.sin(time * 0.1)*0.2); // Extra wave for arms
            } else if (this.type === 'gift') {
                // little "open me!" wiggle every few seconds
                const ph = (time + v.seed * 150) % 150;
                if (!this.isDragging && ph < 24) ctx.rotate(Math.sin(ph * 0.8) * 0.14 * (1 - ph / 24));
            } else if (this.icon === '🧣') {
                // Wind effect on scarf
                ctx.rotate(Math.sin(time * 0.15 + windSpeed * 5) * 0.3);
            } else {
                ctx.rotate(this.rotation);
            }
            ctx.scale(v.sc * (1 + v.sq), v.sc * (1 - v.sq));

            let blink = 1;
            if (this.icon === '⚫' && this.isAlive) {
                const cyc = (time + v.seed * 300) % 190;
                if (cyc < 10) blink = Math.max(0.12, Math.abs(Math.cos(cyc / 10 * Math.PI)));
            }
            drawItemArt(ctx, this.icon, this.size, this.type, blink);
            ctx.restore();
        }

        isHit(tx, ty) {
            const hitSize = this.type === 'snowball' ? this.size : this.size;
            const dist = Math.sqrt((tx - this.x) ** 2 + (ty - this.y) ** 2);
            return dist < hitSize + 15;
        }
    }

    // Populate Snowflakes
    for (let i = 0; i < MAX_SNOWFLAKES; i++) {
        snowflakes.push(new Snowflake());
    }

    // --- Logic: Detect Snowmen ---
    function checkSnowmanAlive() {
        // Reset alive state
        gameObjects.forEach(o => o.isAlive = false);

        // Find stacks of 3 snowballs
        const balls = gameObjects.filter(o => o.type === 'snowball' && !o.isDragging && !o.isDead);

        // Simple heuristic: A ball is "on" another if distance is close and Y is higher (smaller value)
        // We look for Bottom -> Middle -> Top

        balls.forEach(bottom => {
            if (bottom.size < 40) return; // Must be decent base

            // Find middle
            const middle = balls.find(m =>
                m !== bottom &&
                Math.abs(m.x - bottom.x) < bottom.size &&
                m.y < bottom.y &&
                m.y > bottom.y - bottom.size * 2.5
            );

            if (middle) {
                // Find top
                const top = balls.find(t =>
                    t !== bottom && t !== middle &&
                    Math.abs(t.x - middle.x) < middle.size &&
                    t.y < middle.y &&
                    t.y > middle.y - middle.size * 2.5
                );

                if (top) {
                    // We have a stack of 3!
                    if (!bottom.wasAlive) {
                        // Just became alive!
                        AudioEngine.playSuccess();
                        createConfetti(top.x, top.y);
                        bottom.wasAlive = true;
                    }
                    bottom.isAlive = true;
                    middle.isAlive = true;
                    top.isAlive = true;
                } else {
                    bottom.wasAlive = false;
                }
            } else {
                bottom.wasAlive = false;
            }
        });
    }

    function createConfetti(x, y) {
        for(let i=0; i<30; i++) {
            confetti.push(new Confetti(x, y));
        }
        // extra celebration sparkle (visual only)
        fxRing(x, y, 10, 110, '255,236,150', 36);
        fxSparkle(x, y, 14, ['255,236,150', '255,255,255', '255,140,180', '140,220,255'], 4);
    }

    // --- Input Handling ---

    function getTouchPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: clientX - rect.left,
            y: clientY - rect.top
        };
    }

    function handleStart(e) {
        if (e.cancelable) e.preventDefault();
        const pos = getTouchPos(e);
        AudioEngine.playPop();

        // 1. Check Toolbar
        if (pos.y < TOOLBAR_HEIGHT) {
            TOOLS.forEach(tool => {
                const dist = Math.sqrt((pos.x - tool.x) ** 2 + (pos.y - tool.y) ** 2);
                if (dist < 40) {
                    const newType = tool.type === 'gift' ? 'gift' : 'decoration';
                    const newDeco = new GameObject(newType, pos.x, pos.y, tool.size, tool.icon);
                    gameObjects.push(newDeco);
                    draggingItem = newDeco;
                    draggingItem.isDragging = true;
                    dragOffsetX = 0;
                    dragOffsetY = 0;
                    fxPick(tool); getVis(newDeco).sc = 0.55;
                }
            });
            return;
        }

        // 2. Check Existing Objects
        for (let i = gameObjects.length - 1; i >= 0; i--) {
            if (gameObjects[i].isHit(pos.x, pos.y)) {

                // Special: Click Gift to open
                if (gameObjects[i].type === 'gift' && !gameObjects[i].isDragging) {
                    openGift(gameObjects[i]);
                    return;
                }

                draggingItem = gameObjects[i];

                // DETACH if attached
                if (draggingItem.parent) {
                    const parent = draggingItem.parent;
                    const childIndex = parent.children.indexOf(draggingItem);
                    if (childIndex > -1) {
                        parent.children.splice(childIndex, 1);
                    }
                    draggingItem.parent = null;
                }

                draggingItem.isDragging = true;
                draggingItem.vx = 0;
                draggingItem.vy = 0;
                dragOffsetX = draggingItem.x - pos.x;
                dragOffsetY = draggingItem.y - pos.y;

                gameObjects.splice(i, 1);
                gameObjects.push(draggingItem);

                // If parent moved, bring children
                if (draggingItem.children && draggingItem.children.length > 0) {
                    draggingItem.children.forEach(child => {
                        const cIndex = gameObjects.indexOf(child);
                        if (cIndex > -1) {
                            gameObjects.splice(cIndex, 1);
                            gameObjects.push(child);
                        }
                    });
                }

                return;
            }
        }

        // 3. Ground Interaction -> Start Rolling
        const groundLevel = height - (height * GROUND_HEIGHT_RATIO);
        if (pos.y > groundLevel - 50) {
            isRolling = true;
            lastRollPos = pos;

            // Start a tiny snowball
            rollingBall = new GameObject('snowball', pos.x, pos.y, 10);
            rollingBall.isDragging = true;
            gameObjects.push(rollingBall);
            fxPuff(pos.x, pos.y + 8, 5, 30, 1.8);
        }
    }

    function openGift(gift) {
        // Remove gift box
        gift.isDead = true;
        AudioEngine.playSuccess();
        createConfetti(gift.x, gift.y);

        // Spawn random special item
        const specialItems = [
            {icon: '👑', size: 50}, // Crown
            {icon: '👓', size: 40}, // Glasses
            {icon: '🎀', size: 40}, // Bow
            {icon: '🍭', size: 45}, // Lollipop
            {icon: '🧢', size: 50}  // Blue Cap
        ];
        const randomItem = specialItems[Math.floor(Math.random() * specialItems.length)];
        const newItem = new GameObject('decoration', gift.x, gift.y - 20, randomItem.size, randomItem.icon);
        newItem.vy = -5; // Pop up
        gameObjects.push(newItem);
        getVis(newItem).sc = 0.2;
        fxPuff(gift.x, gift.y, 8, 50, 2.5);
    }

    function handleMove(e) {
        if (e.cancelable) e.preventDefault();
        const pos = getTouchPos(e);

        if (draggingItem) {
            draggingItem.x = pos.x + dragOffsetX;
            draggingItem.y = pos.y + dragOffsetY;
            draggingItem.vx = 0;
            draggingItem.vy = 0;

        } else if (isRolling && rollingBall) {
            const dx = pos.x - lastRollPos.x;
            const dy = pos.y - lastRollPos.y;
            const dist = Math.sqrt(dx*dx + dy*dy);

            rollingBall.x = pos.x;
            const groundY = height - (height * GROUND_HEIGHT_RATIO);
            rollingBall.y = Math.max(pos.y, groundY);

            if (rollingBall.size < 80) {
                rollingBall.size += dist * 0.05;
                if(dist > 5 && Math.random() > 0.8) AudioEngine.playPop(); // Crunch sound
            }
            fxRoll(rollingBall, dist);

            lastRollPos = pos;
        }
    }

    function handleEnd(e) {
        if (draggingItem) {
            draggingItem.isDragging = false;

            // ATTACH logic
            if (draggingItem.type === 'decoration') {
                for (const other of gameObjects) {
                    if (other.type === 'snowball' && other !== draggingItem) {
                        const dist = Math.sqrt((draggingItem.x - other.x)**2 + (draggingItem.y - other.y)**2);
                        if (dist < other.size) {
                            draggingItem.parent = other;
                            other.children.push(draggingItem);
                            draggingItem.offsetX = draggingItem.x - other.x;
                            draggingItem.offsetY = draggingItem.y - other.y;
                            draggingItem.vx = 0;
                            draggingItem.vy = 0;
                            AudioEngine.playPop();
                            fxAttach(draggingItem);
                            break;
                        }
                    }
                }
            }

            // Delete if in toolbar
            if (!draggingItem.parent && draggingItem.y < TOOLBAR_HEIGHT) {
                const index = gameObjects.indexOf(draggingItem);
                if (index > -1) { gameObjects.splice(index, 1); fxPoof(draggingItem); }
            }
            draggingItem = null;
        }

        if (isRolling) {
            isRolling = false;
            if (rollingBall) {
                rollingBall.isDragging = false;
                if (rollingBall.size < 15) {
                    const index = gameObjects.indexOf(rollingBall);
                    if (index > -1) gameObjects.splice(index, 1);
                }
                rollingBall = null;
            }
        }
    }

    canvas.addEventListener('mousedown', handleStart);
    canvas.addEventListener('mousemove', handleMove);
    canvas.addEventListener('mouseup', handleEnd);
    canvas.addEventListener('touchstart', handleStart, {passive: false});
    canvas.addEventListener('touchmove', handleMove, {passive: false});
    canvas.addEventListener('touchend', handleEnd);

    // --- Rendering ---

    const ICON_FIT = { '🎩': 1.12, '🥕': 1.0, '⚫': 0.9, 'STICK_DRAW': 0.85, '🧣': 1.32, 'ARMS_DRAW': 1.2 };
    const ICON_SHIFT = { '🧣': -0.3, '🎩': 0.04 };

    function drawToolbar() {
        ctx.drawImage(scene.toolbar.c, 0, 0, scene.toolbar.w, scene.toolbar.h);

        // drop-to-put-away highlight
        if (draggingItem && draggingItem.y < TOOLBAR_HEIGHT) {
            ctx.fillStyle = `rgba(255,120,150,${0.18 + 0.08 * Math.sin(time * 0.2)})`;
            ctx.fillRect(0, 0, width, TOOLBAR_HEIGHT - 8);
        }

        const spacing = width / TOOLS.length;
        const br = Math.max(20, Math.min(37, spacing / 2 - 5));
        TOOLS.forEach((tool, i) => {
            const sc = tool.sc === undefined ? 1 : tool.sc;
            const bob = Math.sin(time * 0.045 + i * 0.9) * 2;
            ctx.save();
            ctx.translate(tool.x, tool.y + bob * 0.5);
            ctx.scale(sc, sc);
            const k = br / 60;
            ctx.drawImage(BUTTON.c, -80 * k, -80 * k, 160 * k, 160 * k);
            // icon
            let fit;
            if (tool.icon === '🎁') fit = (br * 1.25) / 46;
            else if (tool.icon === '⚫') fit = (br * 0.78) / (tool.size * ICON_FIT['⚫']);
            else fit = (br * 1.28) / (tool.size * (ICON_FIT[tool.icon] || 1));
            ctx.translate(0, bob * 0.5 + (tool.icon === '🎁' ? 4 * fit : (ICON_SHIFT[tool.icon] || 0) * tool.size * fit));
            ctx.scale(fit, fit);
            drawItemArt(ctx, tool.icon, tool.size, tool.type === 'gift' ? 'gift' : 'decoration', 1);
            ctx.restore();
        });
    }

    function drawSkyAndScenery() {
        const t = time;
        ctx.drawImage(scene.sky.c, 0, 0, scene.sky.w, scene.sky.h);

        // twinkling stars
        ctx.fillStyle = '#ffffff';
        for (const s of scene.stars) {
            const a = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.f + s.p));
            ctx.globalAlpha = a;
            if (s.big) {
                star4(ctx, s.x, s.y, s.r * 3.2); ctx.fill();
            } else {
                ctx.fillRect(s.x - s.r / 2, s.y - s.r / 2, s.r, s.r);
            }
        }
        ctx.globalAlpha = 1;

        // aurora curtains
        ctx.globalCompositeOperation = 'lighter';
        for (const rb of scene.aurora) {
            for (let x = -12; x < width + 12; x += 9) {
                const y = rb.y + Math.sin(x * rb.f1 + t * rb.s1 + rb.p) * rb.a1 + Math.sin(x * rb.f2 - t * rb.s2) * rb.a2 + rb.a1;
                const h = rb.h * (0.7 + 0.35 * Math.sin(x * 0.009 + t * 0.012 + rb.p));
                const w = 0.5 + 0.5 * Math.sin(x * rb.f3 + t * 0.006 + rb.p);
                const a = rb.alpha * w * w;
                if (a < 0.02) continue;
                ctx.globalAlpha = a;
                ctx.drawImage(rb.sp.c, x - 3, y, 15, h);
            }
        }
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';

        const pm = -PAD - par * 12, ph = -PAD - par * 22, pn = -PAD - par * 34;
        ctx.drawImage(scene.mtn.c, pm, scene.mtnTop, scene.mtn.w, scene.mtn.h);
        ctx.drawImage(scene.mid.c, ph, scene.midTop, scene.mid.w, scene.mid.h);

        // chimney smoke (behind the near layer edge but above mid hills)
        const sOff = PAD + pn;
        for (const s of smoke) {
            const k = s.life / s.max;
            ctx.globalAlpha = 0.38 * Math.sin(Math.min(1, k * 4) * Math.PI / 2) * (1 - k);
            const rr = s.r * 1.8;
            ctx.drawImage(FLAKE.c, s.x + sOff - rr, s.y - rr, rr * 2, rr * 2);
        }
        ctx.globalAlpha = 1;

        ctx.drawImage(scene.near.c, pn, scene.nearTop, scene.near.w, scene.near.h);

        // warm cabin window glow + twinkly tree lights
        ctx.globalCompositeOperation = 'lighter';
        scene.cabin.windows.forEach((w, i) => {
            ctx.globalAlpha = 0.42 + 0.1 * Math.sin(t * 0.09 + i * 2) + 0.05 * Math.sin(t * 0.31 + i);
            ctx.drawImage(GLOW_WARM.c, w.x + sOff - w.r, w.y - w.r, w.r * 2, w.r * 2);
        });
        for (const L of scene.lights) {
            const a = 0.5 + 0.5 * Math.sin(t * 0.07 + L.p);
            ctx.globalAlpha = 0.35 + 0.65 * a;
            ctx.fillStyle = `rgb(${L.c})`;
            ctx.beginPath(); ctx.arc(L.x + sOff, L.y, 2.2, 0, TAU); ctx.fill();
            ctx.globalAlpha = 0.25 * a;
            ctx.beginPath(); ctx.arc(L.x + sOff, L.y, 6, 0, TAU); ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
    }

    function drawGroundLayer() {
        const t = time;
        ctx.drawImage(scene.ground.c, 0, scene.groundTop, scene.ground.w, scene.ground.h);

        // lake ripples + glints
        const R = LAKE_RADIUS;
        ctx.lineWidth = 2;
        for (let i = 0; i < 3; i++) {
            const k = (t * 0.003 + i / 3) % 1;
            ctx.strokeStyle = `rgba(200,236,255,${0.28 * Math.sin(k * Math.PI)})`;
            ctx.beginPath(); ctx.arc(width, height, R * (0.2 + 0.72 * k), Math.PI, Math.PI * 1.5); ctx.stroke();
        }
        ctx.fillStyle = '#ffffff';
        for (let i = 0; i < 5; i++) {
            const a = Math.PI + 0.25 + i * 0.27, d = R * (0.35 + (i * 0.37) % 0.5);
            const tw = Math.max(0, Math.sin(t * 0.05 + i * 1.7));
            if (tw < 0.05) continue;
            ctx.globalAlpha = tw;
            star4(ctx, width + Math.cos(a) * d, height + Math.sin(a) * d, 5 * tw); ctx.fill();
        }
        ctx.globalAlpha = 1;

        // snow sparkles
        for (const sp of scene.sparkles) {
            const a = Math.pow(Math.max(0, Math.sin(t * sp.f + sp.p)), 10);
            if (a < 0.03) continue;
            ctx.globalAlpha = a * 0.55;
            ctx.fillStyle = '#8cc4ff';
            star4(ctx, sp.x, sp.y, sp.s * 1.5); ctx.fill();
            ctx.globalAlpha = a;
            ctx.fillStyle = '#ffffff';
            star4(ctx, sp.x, sp.y, sp.s); ctx.fill();
        }
        ctx.globalAlpha = 1;

        // rolling tracks
        for (const tr of tracks) {
            const k = 1 - tr.life / tr.max;
            ctx.fillStyle = `rgba(130,158,210,${0.22 * k})`;
            ctx.beginPath(); ctx.ellipse(tr.x, tr.y, tr.r, tr.r * 0.28, 0, 0, TAU); ctx.fill();
        }
    }

    function drawObjectUnderlays(groundLevel) {
        for (const o of gameObjects) {
            if (o.parent || o.sinking) continue;
            const v = getVis(o);
            const isBall = o.type === 'snowball';
            const r = isBall ? o.size : o.size * 0.5;
            const dx = o.x + o.danceOffset;
            if (isBall && o.isAlive) {
                const g = r * (2.6 + 0.15 * Math.sin(time * 0.08));
                ctx.globalAlpha = 0.3;
                ctx.drawImage(GLOW_GOLD.c, dx - g, o.y - g, g * 2, g * 2);
            }
            const bottom = o.y + r;
            const sy = Math.max(groundLevel, bottom - 2);
            const lift = Math.max(0, sy - bottom);
            const fade = clamp(1 - lift / 260, 0.12, 1);
            const w = (isBall ? r * 2.3 : o.size * 1.1) * (0.7 + 0.3 * fade) * v.sc;
            ctx.globalAlpha = fade * (o === draggingItem ? 0.6 : 1);
            ctx.drawImage(SHADOW.c, dx - w / 2, sy - w * 0.13, w, w * 0.26);
        }
        ctx.globalAlpha = 1;
    }

    function drawFx() {
        for (const p of fx) {
            const k = p.life / p.max;
            if (p.k === 'puff') {
                const a = (1 - k) * Math.min(1, p.life / 4);
                ctx.globalAlpha = 0.28 * a;
                ctx.fillStyle = '#8ea9d8';
                ctx.beginPath(); ctx.arc(p.x, p.y + p.r * 0.35, p.r * 0.95, 0, TAU); ctx.fill();
                ctx.globalAlpha = a;
                const rr = p.r * 1.7;
                ctx.drawImage(FLAKE.c, p.x - rr, p.y - rr, rr * 2, rr * 2);
            } else if (p.k === 'spark') {
                ctx.globalAlpha = 1 - k * k;
                ctx.fillStyle = `rgb(${p.c})`;
                ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
                star4(ctx, 0, 0, p.r * (1 - k * 0.5)); ctx.fill();
                ctx.restore();
            } else if (p.k === 'ring') {
                const e = 1 - Math.pow(1 - k, 3);
                ctx.globalAlpha = 1 - k;
                ctx.strokeStyle = `rgb(${p.c})`;
                ctx.lineWidth = 5 * (1 - k) + 1;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r0 + (p.r1 - p.r0) * e, 0, TAU); ctx.stroke();
            } else if (p.k === 'ripple') {
                ctx.globalAlpha = 0.7 * (1 - k);
                ctx.strokeStyle = '#d8f1ff';
                ctx.lineWidth = 2;
                const r = p.r0 + (p.r1 - p.r0) * k;
                ctx.beginPath(); ctx.ellipse(p.x, p.y, r, r * 0.35, 0, 0, TAU); ctx.stroke();
            } else if (p.k === 'drop') {
                ctx.globalAlpha = 1 - k;
                ctx.fillStyle = '#bfe6ff';
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
            }
        }
        ctx.globalAlpha = 1;
    }

    function render() {
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        const groundLevel = height - (height * GROUND_HEIGHT_RATIO) + 20;

        drawSkyAndScenery();
        for (const f of snowflakes) if (f.z < 0.55) f.draw();
        drawGroundLayer();
        drawObjectUnderlays(groundLevel);

        const held = o => draggingItem && (o === draggingItem || o.parent === draggingItem);
        gameObjects.forEach(obj => { if (!held(obj)) obj.draw(); });

        confetti.forEach(c => c.draw());
        drawFx();
        for (const f of snowflakes) if (f.z >= 0.55) f.draw();

        drawToolbar();

        // the item in your hand is always drawn on top
        if (draggingItem) gameObjects.forEach(obj => { if (held(obj)) obj.draw(); });
    }

    // --- Game Loop ---
    // Logic runs at a fixed 60 steps/sec so the game feels the same on 60Hz and 120Hz tablets.
    function step() {
        time++;
        // Wind oscilates
        windSpeed = Math.sin(time * 0.01) * 0.5;

        snowflakes.forEach(flake => flake.update());

        const groundLevel = height - (height * GROUND_HEIGHT_RATIO) + 20;

        checkSnowmanAlive();

        gameObjects.forEach(obj => {
            obj.updatePhysics(groundLevel, gameObjects);
        });

        // Update Confetti
        confetti = confetti.filter(c => c.life > 0);
        confetti.forEach(c => c.update());

        gameObjects = gameObjects.filter(obj => !obj.isDead);

        updateVisuals();
    }

    const STEP_MS = 1000 / 60;
    let lastTs = null, acc = 0;
    function animate(ts) {
        if (lastTs === null || ts === undefined) { step(); }
        else {
            acc += Math.min(100, ts - lastTs);
            let n = 0;
            while (acc >= STEP_MS * 0.9 && n < 5) { step(); acc -= STEP_MS; n++; }
            if (n === 5) acc = 0;
        }
        if (ts !== undefined) lastTs = ts;
        render();
        requestAnimationFrame(animate);
    }

    animate();

</script>
</body>
</html>
