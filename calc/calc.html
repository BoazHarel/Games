<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#2a1868">
    <title>Math Wiz 3000</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
    <style>
        /* ================= Palette & tokens ================= */
        :root {
            --night-1: #160d3d;
            --night-2: #2f1880;
            --night-3: #5a2a9e;
            --pink: #ff5fa2;
            --gold: #ffd84d;
            --mint: #54f2c0;
            --sky: #4cc3ff;
            --ink: #2d2170;

            --gap: clamp(7px, 1.5vmin, 14px);
            --depth: 6px;
            --radius: clamp(14px, 2.4vmin, 22px);

            --num-size: clamp(22px, min(7.4vw, 4.9vh), 46px);
            --sci-size: clamp(15px, min(4.8vw, 3.2vh), 30px);
            --screen-h: clamp(118px, 21vh, 230px);
            --display-size: clamp(40px, min(13vw, 8.4vh), 92px);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Fredoka', 'Trebuchet MS', sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 12% 8%, rgba(255, 95, 162, 0.42), transparent 38%),
                radial-gradient(circle at 92% 92%, rgba(76, 195, 255, 0.36), transparent 42%),
                radial-gradient(circle at 80% 18%, rgba(255, 216, 77, 0.16), transparent 30%),
                linear-gradient(160deg, var(--night-1) 0%, var(--night-2) 52%, var(--night-3) 100%);
            background-color: var(--night-1);
            overscroll-behavior: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        /* ================= Sky (animated backdrop) ================= */
        #sky {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            width: 3px; height: 3px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 6px 1px rgba(255,255,255,0.8);
            animation: twinkle var(--tw, 3s) ease-in-out infinite;
            animation-delay: var(--td, 0s);
            opacity: 0.2;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.15; transform: scale(0.7); }
            50% { opacity: 1; transform: scale(1.25); }
        }
        .glyph {
            position: absolute;
            font-family: 'Lilita One', 'Fredoka', sans-serif;
            color: #fff;
            opacity: 0.09;
            animation: drift var(--dd, 14s) ease-in-out infinite alternate;
            animation-delay: var(--dl, 0s);
            will-change: transform;
        }
        @keyframes drift {
            from { transform: translate(0, 0) rotate(-12deg); }
            to   { transform: translate(var(--dx, 20px), var(--dy, -40px)) rotate(14deg); }
        }

        #fx {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        /* ================= Layout ================= */
        .stage {
            position: relative;
            z-index: 1;
            height: 100vh;
            height: 100dvh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
        }

        .device {
            position: relative;
            width: 100%;
            max-width: 660px;
            height: 100%;
            max-height: 1180px;
            display: flex;
            flex-direction: column;
            gap: clamp(8px, 1.4vmin, 14px);
            padding: clamp(10px, 2vmin, 20px);
            border-radius: clamp(24px, 4vmin, 40px);
            background:
                radial-gradient(circle at 20% 0%, rgba(255,255,255,0.9), transparent 45%),
                linear-gradient(180deg, #f7f2ff 0%, #e7ddff 55%, #d9cbff 100%);
            box-shadow:
                0 30px 70px rgba(8, 0, 40, 0.55),
                0 0 0 4px rgba(255,255,255,0.18),
                inset 0 3px 0 rgba(255,255,255,0.95),
                inset 0 -8px 0 rgba(90, 60, 180, 0.18);
        }

        /* ================= Header ================= */
        .topbar {
            position: relative;
            display: flex;
            align-items: center;
            gap: clamp(8px, 1.6vmin, 14px);
            height: clamp(50px, 7.5vh, 82px);
            flex-shrink: 0;
            padding: 0 4px;
            z-index: 5;
        }
        .owl {
            height: 118%;
            width: auto;
            aspect-ratio: 1;
            flex-shrink: 0;
            margin-top: -10px;
            filter: drop-shadow(0 4px 4px rgba(45, 33, 112, 0.25));
            transform-origin: 50% 90%;
        }
        .owl .eyes-happy, .owl .eyes-oops { display: none; }
        .owl.happy .eyes-open, .owl.oops .eyes-open { display: none; }
        .owl.happy .eyes-happy { display: inline; }
        .owl.oops .eyes-oops { display: inline; }
        .owl .pupils { animation: blink 5s infinite; transform-origin: 50% 62%; transform-box: view-box; }
        @keyframes blink {
            0%, 94%, 100% { transform: scaleY(1); }
            97% { transform: scaleY(0.1); }
        }
        .owl.hop { animation: hop 0.6s cubic-bezier(.3,1.6,.5,1); }
        @keyframes hop {
            0% { transform: translateY(0) rotate(0); }
            35% { transform: translateY(-14%) rotate(-8deg); }
            70% { transform: translateY(0) rotate(5deg); }
            100% { transform: translateY(0) rotate(0); }
        }
        .owl.wobble { animation: wobble 0.5s ease-in-out; }
        @keyframes wobble {
            0%, 100% { transform: rotate(0); }
            25% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
        }

        .title {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Lilita One', 'Fredoka', sans-serif;
            font-size: clamp(22px, min(6.4vw, 4.2vh), 42px);
            line-height: 1;
            white-space: nowrap;
        }
        .title .word {
            background: linear-gradient(180deg, #6a4cff 0%, #3b2a9f 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 2px 0 rgba(255,255,255,0.9));
        }
        .title .badge {
            font-size: 0.55em;
            padding: 0.22em 0.5em 0.18em;
            border-radius: 999px;
            color: #fff;
            background: linear-gradient(180deg, #ff7cb5, #ff3f8e);
            box-shadow: 0 3px 0 #c8246a, 0 6px 10px rgba(200, 36, 106, 0.3);
            transform: rotate(-6deg) translateY(-2px);
            letter-spacing: 0.04em;
        }

        .counter {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px 6px 8px;
            border-radius: 999px;
            background: linear-gradient(180deg, #ffffff, #f1eaff);
            box-shadow: 0 4px 0 #c9b8ef, 0 8px 14px rgba(60, 30, 140, 0.18), inset 0 2px 0 #fff;
            font-weight: 700;
            font-size: clamp(16px, min(4.6vw, 3vh), 26px);
            color: var(--ink);
        }
        .counter svg { width: 1.45em; height: 1.45em; }
        .counter.bump { animation: bump 0.45s cubic-bezier(.3,1.8,.5,1); }
        @keyframes bump {
            0% { transform: scale(1); }
            40% { transform: scale(1.3) rotate(-5deg); }
            100% { transform: scale(1); }
        }
        .counter .star-icon { animation: spin-star 6s linear infinite; }
        @keyframes spin-star { to { transform: rotate(360deg); } }

        .bubble {
            position: absolute;
            left: clamp(30px, 6vh, 60px);
            top: 92%;
            padding: 8px 16px;
            border-radius: 18px;
            background: #fff;
            color: var(--ink);
            font-weight: 700;
            font-size: clamp(15px, min(4vw, 2.6vh), 22px);
            white-space: nowrap;
            box-shadow: 0 6px 0 rgba(45, 33, 112, 0.18), 0 10px 20px rgba(0,0,0,0.25);
            transform-origin: 20px -8px;
            transform: scale(0);
            opacity: 0;
            transition: transform 0.25s cubic-bezier(.3,1.6,.5,1), opacity 0.2s;
            z-index: 6;
            pointer-events: none;
        }
        .bubble::before {
            content: '';
            position: absolute;
            left: 16px;
            top: -9px;
            border: 10px solid transparent;
            border-top: 0;
            border-bottom-color: #fff;
        }
        .bubble.show { transform: scale(1); opacity: 1; }
        .bubble.oops { background: #ffe3e8; color: #b0213f; }
        .bubble.oops::before { border-bottom-color: #ffe3e8; }

        /* ================= Screen ================= */
        .screen {
            position: relative;
            flex-shrink: 0;
            height: var(--screen-h);
            border-radius: calc(var(--radius) + 6px);
            padding: clamp(10px, 2vmin, 18px) clamp(14px, 2.6vmin, 24px);
            background:
                radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 1.5px) 0 0 / 16px 16px,
                radial-gradient(ellipse at 30% 0%, rgba(120, 90, 255, 0.45), transparent 60%),
                linear-gradient(165deg, #231b62 0%, #160f45 70%, #120c38 100%);
            box-shadow:
                0 0 0 5px #3b2b94,
                0 0 0 8px #b9a6ff,
                inset 0 6px 18px rgba(0,0,0,0.55),
                inset 0 -2px 0 rgba(255,255,255,0.06);
            margin: 8px 8px 4px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            overflow: hidden;
        }
        .screen::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(115deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 32%, transparent 33%);
            pointer-events: none;
        }
        .screen.shake { animation: shake 0.45s cubic-bezier(.36,.07,.19,.97); }
        @keyframes shake {
            10%, 90% { transform: translateX(-2px); }
            20%, 80% { transform: translateX(5px); }
            30%, 50%, 70% { transform: translateX(-9px); }
            40%, 60% { transform: translateX(9px); }
        }
        .screen.flash-ok { animation: flash-ok 0.7s ease-out; }
        @keyframes flash-ok {
            0% { box-shadow: 0 0 0 5px #3b2b94, 0 0 0 8px #ffe066, 0 0 40px 10px rgba(255, 216, 77, 0.8), inset 0 6px 18px rgba(0,0,0,0.55); }
            100% { box-shadow: 0 0 0 5px #3b2b94, 0 0 0 8px #b9a6ff, 0 0 0 0 rgba(255,216,77,0), inset 0 6px 18px rgba(0,0,0,0.55); }
        }

        #history-display {
            color: #b9a9ff;
            font-weight: 500;
            font-size: clamp(15px, min(4.4vw, 2.7vh), 26px);
            height: 1.4em;
            line-height: 1.4em;
            overflow: hidden;
            white-space: nowrap;
            text-align: right;
            letter-spacing: 0.04em;
            opacity: 0.9;
        }

        .display-row {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            transform-origin: right center;
        }
        .display-row.pop { animation: pop 0.22s ease-out; }
        @keyframes pop {
            0% { transform: scale(1); }
            45% { transform: scale(1.045); }
            100% { transform: scale(1); }
        }
        .deg {
            flex-shrink: 0;
            align-self: center;
            font-size: clamp(11px, 1.6vh, 15px);
            font-weight: 700;
            letter-spacing: 0.12em;
            color: var(--gold);
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(255, 216, 77, 0.12);
            border: 1.5px solid rgba(255, 216, 77, 0.45);
        }
        #display {
            flex: 1;
            min-width: 0;
            width: 100%;
            border: 0;
            outline: none;
            background: transparent;
            padding: 0;
            text-align: right;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: var(--display-size);
            line-height: 1.15;
            color: #ffffff;
            text-shadow: 0 3px 0 rgba(0,0,0,0.35);
            filter: drop-shadow(0 0 12px rgba(130, 200, 255, 0.5));
            caret-color: transparent;
            cursor: default;
            transition: color 0.25s, filter 0.25s;
            overflow-x: auto;
            scrollbar-width: none;
        }
        #display::-webkit-scrollbar { display: none; }
        #display::placeholder { color: #ffffff; opacity: 0.92; }
        #display.result {
            color: var(--gold);
            filter: drop-shadow(0 0 14px rgba(255, 216, 77, 0.65));
        }
        #display.error {
            color: #ff7d93;
            filter: drop-shadow(0 0 14px rgba(255, 90, 120, 0.65));
        }

        /* ================= Keypad ================= */
        .keypad {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: var(--gap);
        }
        .pad {
            min-height: 0;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            column-gap: var(--gap);
            row-gap: calc(var(--gap) + var(--depth) * 0.6);
            padding: var(--gap) var(--gap) calc(var(--gap) + var(--depth));
            border-radius: calc(var(--radius) + 8px);
        }
        .pad-sci {
            flex: 0.86;
            background: linear-gradient(180deg, rgba(120, 80, 230, 0.16), rgba(120, 80, 230, 0.08));
            box-shadow: inset 0 3px 8px rgba(60, 30, 140, 0.18), inset 0 -2px 0 rgba(255,255,255,0.6);
        }
        .pad-num {
            flex: 1;
            background: linear-gradient(180deg, rgba(76, 140, 255, 0.14), rgba(76, 140, 255, 0.06));
            box-shadow: inset 0 3px 8px rgba(40, 60, 160, 0.18), inset 0 -2px 0 rgba(255,255,255,0.6);
        }

        .key {
            --face-1: #ffffff;
            --face-2: #f2ebff;
            --edge: #c6b4f0;
            --label: var(--ink);
            --glow: rgba(60, 30, 140, 0.25);

            position: relative;
            width: 100%;
            height: 100%;
            min-height: 0;
            border: 0;
            margin: 0;
            padding: 0;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: var(--num-size);
            line-height: 1;
            color: var(--label);
            background: linear-gradient(180deg, var(--face-1) 0%, var(--face-2) 100%);
            box-shadow:
                0 var(--depth) 0 var(--edge),
                0 calc(var(--depth) + 5px) 12px var(--glow),
                inset 0 2px 0 rgba(255,255,255,0.75),
                inset 0 -3px 0 rgba(0,0,0,0.06);
            transform: translateY(0);
            transition: transform 0.07s ease-out, box-shadow 0.07s ease-out, filter 0.15s;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
            outline: none;
        }
        /* glossy highlight */
        .key::before {
            content: '';
            position: absolute;
            left: 8%;
            right: 8%;
            top: 5%;
            height: 42%;
            border-radius: calc(var(--radius) - 4px) calc(var(--radius) - 4px) 50% 50% / calc(var(--radius) - 4px) calc(var(--radius) - 4px) 30% 30%;
            background: linear-gradient(180deg, rgba(255,255,255,0.45), rgba(255,255,255,0));
            pointer-events: none;
        }
        .key span { position: relative; }
        .key:active, .key.btn-active {
            transform: translateY(calc(var(--depth) - 1px));
            box-shadow:
                0 1px 0 var(--edge),
                0 3px 5px var(--glow),
                inset 0 2px 0 rgba(255,255,255,0.6),
                inset 0 -2px 0 rgba(0,0,0,0.06);
            filter: brightness(1.06) saturate(1.1);
        }
        .key:focus-visible { box-shadow: 0 var(--depth) 0 var(--edge), 0 0 0 4px var(--gold); }
        @media (hover: hover) {
            .key:hover { filter: brightness(1.05); }
        }

        .k-light span, .key:not(.k-num) span { text-shadow: 0 2px 0 rgba(0,0,0,0.16); }
        .k-num span { text-shadow: none; }

        .k-paren {
            --face-1: #b0bbff; --face-2: #8494ff; --edge: #5463d6;
            --label: #fff; --glow: rgba(84, 99, 214, 0.35);
            font-size: var(--sci-size);
        }
        .k-sci {
            --face-1: #dcb2ff; --face-2: #b47bff; --edge: #8549dc;
            --label: #fff; --glow: rgba(133, 73, 220, 0.35);
            font-size: var(--sci-size);
        }
        .k-sci.italic span { font-style: italic; font-family: Georgia, 'Times New Roman', serif; font-weight: 700; }
        .k-op {
            --face-1: #6fd8ff; --face-2: #2ea6f2; --edge: #1874bd;
            --label: #fff; --glow: rgba(24, 116, 189, 0.38);
            font-size: calc(var(--num-size) * 1.12);
        }
        .k-ac {
            --face-1: #ff95a6; --face-2: #ff5675; --edge: #cf2f52;
            --label: #fff; --glow: rgba(207, 47, 82, 0.38);
            font-size: var(--sci-size);
            font-weight: 700;
        }
        .k-del {
            --face-1: #ffcd7a; --face-2: #ff9d3a; --edge: #d36f12;
            --label: #fff; --glow: rgba(211, 111, 18, 0.38);
            font-size: var(--sci-size);
            font-weight: 700;
        }
        .k-del svg { width: 1.5em; height: 1.5em; position: relative; }
        .root-icon { width: 1.45em; height: 1.1em; position: relative; filter: drop-shadow(0 2px 0 rgba(0,0,0,0.16)); }
        .k-eq {
            --face-1: #7ff5ad; --face-2: #22cc6e; --edge: #129650;
            --label: #fff; --glow: rgba(18, 150, 80, 0.45);
            grid-column: span 2;
            font-size: calc(var(--num-size) * 1.25);
            animation: eq-glow 2.6s ease-in-out infinite;
        }
        .k-eq .spark {
            position: absolute;
            width: 0.42em;
            height: 0.42em;
            opacity: 0.9;
            animation: twinkle 2.2s ease-in-out infinite;
        }
        .k-eq .spark.s1 { left: 16%; top: 22%; }
        .k-eq .spark.s2 { right: 18%; bottom: 24%; animation-delay: 1.1s; width: 0.32em; height: 0.32em; }
        @keyframes eq-glow {
            0%, 100% { box-shadow: 0 var(--depth) 0 var(--edge), 0 calc(var(--depth) + 5px) 12px var(--glow), 0 0 0 0 rgba(84, 242, 160, 0), inset 0 2px 0 rgba(255,255,255,0.75); }
            50% { box-shadow: 0 var(--depth) 0 var(--edge), 0 calc(var(--depth) + 5px) 12px var(--glow), 0 0 22px 4px rgba(84, 242, 160, 0.55), inset 0 2px 0 rgba(255,255,255,0.75); }
        }
        .k-eq:active, .k-eq.btn-active { animation: none; }

        /* ================= Landscape: pads side by side ================= */
        @media (min-aspect-ratio: 6/5) {
            :root {
                --num-size: clamp(18px, min(3.6vw, 6.2vh), 46px);
                --sci-size: clamp(14px, min(2.4vw, 4.4vh), 30px);
                --screen-h: clamp(84px, 21vh, 190px);
                --display-size: clamp(34px, min(6.4vw, 11vh), 92px);
            }
            .device { max-width: 1240px; max-height: 900px; }
            .keypad { flex-direction: row; }
            .pad-sci { flex: 0.9; }
            .pad-num { flex: 1; }
        }

        /* Short screens (phones in landscape) */
        @media (max-height: 520px) {
            :root {
                --depth: 4px;
                --gap: 6px;
                --screen-h: clamp(64px, 20vh, 110px);
                --display-size: clamp(28px, 11vh, 52px);
                --num-size: clamp(16px, 6vh, 28px);
                --sci-size: clamp(12px, 4.4vh, 20px);
                --radius: 12px;
            }
            .stage { padding: 6px; }
            .device { padding: 8px; gap: 6px; border-radius: 22px; }
            .topbar { height: 38px; }
            .title { font-size: 22px; }
            .counter { font-size: 15px; padding: 3px 10px 3px 6px; }
            .screen { margin: 6px 6px 2px; padding: 6px 14px; }
            #history-display { font-size: 13px; }
        }

        /* Narrow phones in portrait */
        @media (max-width: 420px) and (max-aspect-ratio: 6/5) {
            .stage { padding: 6px; }
            .device { border-radius: 26px; }
            .title .badge { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            .star, .glyph, .k-eq, .k-eq .spark, .counter .star-icon, .owl .pupils { animation: none !important; }
        }
    </style>
</head>
<body>

<div id="sky" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<div class="stage">
<main class="device">

    <!-- Header -->
    <header class="topbar">
        <svg class="owl" id="owl" viewBox="0 0 100 100" aria-hidden="true">
            <defs>
                <linearGradient id="owlBody" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#ffc56b"/>
                    <stop offset="1" stop-color="#ff9a3c"/>
                </linearGradient>
                <linearGradient id="hatGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#7a5cff"/>
                    <stop offset="1" stop-color="#3f2bb3"/>
                </linearGradient>
            </defs>
            <!-- body -->
            <ellipse cx="50" cy="68" rx="31" ry="29" fill="url(#owlBody)"/>
            <ellipse cx="50" cy="78" rx="18" ry="16" fill="#ffe6bf"/>
            <path d="M22 70 q-6 10 4 18" stroke="#e57f22" stroke-width="5" fill="none" stroke-linecap="round"/>
            <path d="M78 70 q6 10 -4 18" stroke="#e57f22" stroke-width="5" fill="none" stroke-linecap="round"/>
            <!-- eyes -->
            <g class="eyes-open">
                <circle cx="38" cy="62" r="11" fill="#fff"/>
                <circle cx="62" cy="62" r="11" fill="#fff"/>
                <g class="pupils">
                    <circle cx="39" cy="63" r="5.5" fill="#2d2170"/>

<!-- Visual effects engine (presentation only) -->
<script>
    const FX = (() => {
        const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const canvas = document.getElementById('fx');
        const ctx = canvas.getContext('2d');
        const screenEl = document.getElementById('screen');
        const rowEl = document.getElementById('display-row');
        const displayEl = document.getElementById('display');
        const owl = document.getElementById('owl');
        const bubble = document.getElementById('bubble');
        const counter = document.getElementById('counter');
        const countEl = document.getElementById('magic-count');
        const COLORS = ['#ff5fa2', '#ffd84d', '#54f2c0', '#4cc3ff', '#b47bff', '#ff9d3a'];
        const GLYPHS = ['+', '×', '÷', '−', '=', '★'];
        const CHEERS = ['Abracadabra!', 'Magic!', 'Wow!', 'Super math!', 'You got it!', 'Brilliant!', 'Math wizard!'];
        const OOPS = ['Oops! Try again', 'Hmm, tricky!', 'Uh-oh!'];
        let particles = [];
        let running = false;
        let dpr = 1, W = 0, H = 0;
        let magic = 0;
        let bubbleTimer = null, owlTimer = null;

        // --- Sky: twinkling stars + floating math glyphs ---
        (function buildSky() {
            const sky = document.getElementById('sky');
            const frag = document.createDocumentFragment();
            for (let i = 0; i < 46; i++) {
                const s = document.createElement('div');
                s.className = 'star';
                const size = Math.random() < 0.2 ? 4 : (Math.random() < 0.5 ? 3 : 2);
                s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${size}px;height:${size}px;--tw:${(2+Math.random()*3).toFixed(2)}s;--td:${(-Math.random()*5).toFixed(2)}s`;
                frag.appendChild(s);
            }
            const sym = ['+', '−', '×', '÷', 'π', '√', '=', '%', '2', '7', '∞', '³'];
            for (let i = 0; i < 16; i++) {
                const g = document.createElement('div');
                g.className = 'glyph';
                g.textContent = sym[i % sym.length];
                const fs = 40 + Math.random() * 90;
                g.style.cssText = `left:${(i * 6.3 + Math.random() * 5) % 100}%;top:${Math.random()*92}%;font-size:${fs}px;--dd:${(10+Math.random()*10).toFixed(1)}s;--dl:${(-Math.random()*10).toFixed(1)}s;--dx:${(Math.random()*60-30).toFixed(0)}px;--dy:${(-30-Math.random()*50).toFixed(0)}px`;
                frag.appendChild(g);
            }
            sky.appendChild(frag);
        })();

        function resize() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            W = window.innerWidth; H = window.innerHeight;
            canvas.width = Math.round(W * dpr);
            canvas.height = Math.round(H * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        window.addEventListener('resize', () => { resize(); fit(); });
        resize();

        function starPath(c, r) {
            c.beginPath();
            for (let i = 0; i < 10; i++) {
                const rad = i % 2 ? r * 0.45 : r;
                const a = (i * Math.PI) / 5 - Math.PI / 2;
                c.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
            }
            c.closePath();
        }

        function spawn(x, y, n, opts = {}) {
            for (let i = 0; i < n; i++) {
                const ang = opts.spreadAll ? Math.random() * Math.PI * 2 : (-Math.PI / 2) + (Math.random() - 0.5) * Math.PI * 1.25;
                const sp = (opts.speed || 9) * (0.45 + Math.random() * 0.75);
                const r = Math.random();
                particles.push({
                    x, y,
                    vx: Math.cos(ang) * sp,
                    vy: Math.sin(ang) * sp,
                    g: opts.gravity != null ? opts.gravity : 0.32,
                    rot: Math.random() * 6.28,
                    vr: (Math.random() - 0.5) * 0.35,
                    size: (opts.size || 9) * (0.6 + Math.random() * 0.8),
                    color: opts.color || COLORS[(Math.random() * COLORS.length) | 0],
                    shape: opts.shape != null ? opts.shape : (r < 0.42 ? 0 : r < 0.66 ? 1 : r < 0.88 ? 2 : 3),
                    glyph: GLYPHS[(Math.random() * GLYPHS.length) | 0],
                    life: 0,
                    max: opts.life || (70 + Math.random() * 50),
                    wob: Math.random() * 6.28
                });
            }
            if (!running) { running = true; last = performance.now(); requestAnimationFrame(tick); }
        }

        let last = 0;
        function tick(now) {
            const dt = Math.min(2.5, (now - last) / 16.67);
            last = now;
            ctx.clearRect(0, 0, W, H);
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.life += dt;
                p.vy += p.g * dt;
                p.vx *= Math.pow(0.985, dt);
                p.vy *= Math.pow(0.985, dt);
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.rot += p.vr * dt;
                p.wob += 0.12 * dt;
                if (p.life >= p.max || p.y > H + 40) { particles.splice(i, 1); continue; }
                const fade = Math.min(1, (p.max - p.life) / 22);
                ctx.save();
                ctx.globalAlpha = fade;
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot);
                ctx.fillStyle = p.color;
                const s = p.size;
                if (p.shape === 0) {
                    ctx.scale(1, Math.abs(Math.cos(p.wob)) * 0.8 + 0.2);
                    ctx.fillRect(-s / 2, -s / 3, s, s * 0.66);
                } else if (p.shape === 1) {
                    ctx.beginPath(); ctx.arc(0, 0, s / 2.4, 0, 6.283); ctx.fill();
                } else if (p.shape === 2) {
                    starPath(ctx, s * 0.75); ctx.fill();
                } else {
                    ctx.font = `700 ${Math.round(s * 2)}px Fredoka, sans-serif`;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(p.glyph, 0, 0);
                }
                ctx.restore();
            }
            if (particles.length) requestAnimationFrame(tick);
            else { running = false; ctx.clearRect(0, 0, W, H); }
        }

        function restartAnim(el, cls) {
            el.classList.remove(cls);
            void el.offsetWidth;
            el.classList.add(cls);
        }

        function say(text, oops) {
            bubble.textContent = text;
            bubble.classList.toggle('oops', !!oops);
            bubble.classList.add('show');
            clearTimeout(bubbleTimer);
            bubbleTimer = setTimeout(() => bubble.classList.remove('show'), 1500);
        }

        function owlMood(mood) {
            owl.classList.remove('happy', 'oops');
            if (mood) owl.classList.add(mood);
            restartAnim(owl, mood === 'oops' ? 'wobble' : 'hop');
            clearTimeout(owlTimer);
            owlTimer = setTimeout(() => owl.classList.remove('happy', 'oops'), 1600);
        }

        // Kid-friendly symbols on screen (display only; the expression itself is untouched)
        const pretty = (t) => t.replace(/\*/g, '×').replace(/\//g, '÷').replace(/-/g, '−');
        const historyEl = document.getElementById('history-display');

        // Shrink the main number to fit instead of scrolling (when possible)
        const measure = document.createElement('canvas').getContext('2d');
        function fit() {
            displayEl.style.fontSize = '';
            const cs = getComputedStyle(displayEl);
            const base = parseFloat(cs.fontSize);
            const text = displayEl.value || displayEl.placeholder;
            measure.font = `${cs.fontWeight} ${base}px ${cs.fontFamily}`;
            const w = measure.measureText(text).width;
            const avail = displayEl.clientWidth - 4;
            if (w > avail && avail > 0) {
                const size = Math.max(base * 0.42, base * avail / w);
                displayEl.style.fontSize = size.toFixed(1) + 'px';
            }
            displayEl.scrollLeft = displayEl.scrollWidth;
        }
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

        // Pointer press visuals + tiny sparkle on every tap
        document.querySelectorAll('.key').forEach(btn => {
            const release = () => btn.classList.remove('btn-active');
            btn.addEventListener('pointerdown', (e) => {
                btn.classList.add('btn-active');
                if (!reduceMotion) {
                    const col = getComputedStyle(btn).getPropertyValue('--face-2').trim() || '#b47bff';
                    spawn(e.clientX, e.clientY, 7, { spreadAll: true, speed: 4, gravity: 0.12, size: 6, life: 26, shape: 1, color: btn.classList.contains('k-num') ? '#b47bff' : col });
                }
            });
            btn.addEventListener('pointerup', release);
            btn.addEventListener('pointercancel', release);
            btn.addEventListener('pointerleave', release);
        });

        return {
            // Called whenever the display updates
            refresh(state) {
                const isError = state.displayValue === 'Error';
                displayEl.value = pretty(displayEl.value);
                historyEl.textContent = pretty(historyEl.textContent);
                displayEl.classList.toggle('error', isError);
                displayEl.classList.toggle('result', !isError && state.isResultState);
                fit();
                if (isError) {
                    restartAnim(screenEl, 'shake');
                    owlMood('oops');
                    say(OOPS[(Math.random() * OOPS.length) | 0], true);
                } else {
                    restartAnim(rowEl, 'pop');
                }
            },
            // Called on every successful answer
            celebrate() {
                magic++;
                countEl.textContent = magic;
                restartAnim(counter, 'bump');
                restartAnim(screenEl, 'flash-ok');
                owlMood('happy');
                say(CHEERS[(Math.random() * CHEERS.length) | 0]);
                if (reduceMotion) return;
                const r = screenEl.getBoundingClientRect();
                const n = W < 600 ? 70 : 110;
                spawn(r.left + r.width * 0.3, r.top + r.height * 0.6, n / 2, { speed: 13 });
                spawn(r.left + r.width * 0.7, r.top + r.height * 0.6, n / 2, { speed: 13 });
                const c = counter.getBoundingClientRect();
                spawn(c.left + c.width / 2, c.top + c.height / 2, 14, { spreadAll: true, speed: 5, gravity: 0.08, shape: 2, color: '#ffd84d', size: 10, life: 40 });
            }
        };
    })();
</script>

<!-- Logic -->
<script>
    let displayValue = '';
    let historyValue = '';
    let lastResult = null;
    let lastModifier = '';
    let isResultState = false; // Tracks if the screen shows a fresh calculation result

    const display = document.getElementById('display');
    const historyDisplay = document.getElementById('history-display');

    // --- Visual Logic ---
    function triggerConfetti() {
        FX.celebrate();
    }

    function triggerBounce() {
        FX.refresh({ displayValue, isResultState });
    }

    function formatString(str) {
        if (!str) return '';
        // Finds all numbers in the string (integers or decimals) and adds commas
        return str.replace(/\d+(\.\d*)?/g, (match) => {
            const parts = match.split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            return parts.join('.');
        });
    }

    function updateDisplay() {
        const formattedDisplay = formatString(displayValue);
        const formattedHistory = formatString(historyValue);

        display.value = formattedDisplay || '0';
        historyDisplay.textContent = formattedHistory;

        // Scroll logic
        display.scrollLeft = display.scrollWidth;
        historyDisplay.scrollLeft = historyDisplay.scrollWidth;
        triggerBounce();
    }

    function appendNumber(num) {
        // If we are currently showing a result, start a new calculation
        if (isResultState) {
            displayValue = '';
            lastResult = null;
            historyValue = '';
            isResultState = false;
        }

        // Prevent multiple decimals
        if (num === '.' && displayValue.includes('.') && !isOperator(displayValue.slice(-1))) {
            const parts = displayValue.split(/[\+\-\*\/\^\(\)]/);
            const currentNum = parts[parts.length - 1];
            if (currentNum.includes('.')) return;
        }

        displayValue += num;
        updateDisplay();
    }

    function appendOperator(op) {
        // If showing a result, continue using it (e.g., "2" -> "2 +")
        if (isResultState) {
            isResultState = false;
        }

        if (displayValue === '' && op !== '(') return;

        const lastChar = displayValue.slice(-1);
        if (isOperator(lastChar) && op !== '(' && lastChar !== ')') {
            displayValue = displayValue.slice(0, -1) + op;
        } else {
            displayValue += op;
        }
        updateDisplay();
    }

    function insertConstant(constSym) {
        if (isResultState) {
            displayValue = '';
            historyValue = '';
            isResultState = false;
        }
        displayValue += constSym;
        updateDisplay();
    }

    function isOperator(char) {
        return ['+', '-', '*', '/', '^'].includes(char);
    }

    function clearDisplay() {
        displayValue = '';
        historyValue = '';
        lastResult = null;
        lastModifier = '';
        isResultState = false;
        updateDisplay();
    }

    function deleteLast() {
        if (isResultState) {
            clearDisplay();
            return;
        }
        if (displayValue === 'Error') {
            clearDisplay();
            return;
        }
        displayValue = displayValue.toString().slice(0, -1);
        updateDisplay();
    }

    function handleScientific(func) {
        // Scientific functions work on the current display value immediately
        // If showing a result, we just operate on it directly.

        if (displayValue === '') return;

        let valueToProcess = parseFloat(displayValue);

        if (isNaN(valueToProcess) || /[\+\-\*\/\^]/.test(displayValue)) {
            try {
               valueToProcess = evaluateExpression(displayValue);
            } catch {
                return;
            }
        }

        let result = 0;
        let symbol = '';

        switch(func) {
            case 'sin':
                result = Math.sin(valueToProcess * Math.PI / 180);
                symbol = `sin(${parseFloat(valueToProcess.toFixed(4))})`;
                break;
            case 'cos':
                result = Math.cos(valueToProcess * Math.PI / 180);
                symbol = `cos(${parseFloat(valueToProcess.toFixed(4))})`;
                break;
            case 'tan':
                result = Math.tan(valueToProcess * Math.PI / 180);
                symbol = `tan(${parseFloat(valueToProcess.toFixed(4))})`;
                break;
            case 'log':
                if (valueToProcess <= 0) { displayValue = "Error"; updateDisplay(); return; }
                result = Math.log10(valueToProcess);
                symbol = `log(${parseFloat(valueToProcess.toFixed(4))})`;
                break;
            case 'ln':
                if (valueToProcess <= 0) { displayValue = "Error"; updateDisplay(); return; }
                result = Math.log(valueToProcess);
                symbol = `ln(${parseFloat(valueToProcess.toFixed(4))})`;
                break;
            case 'sqrt':
                if (valueToProcess < 0) { displayValue = "Error"; updateDisplay(); return; }
                result = Math.sqrt(valueToProcess);
                symbol = `√(${parseFloat(valueToProcess.toFixed(4))})`;
                break;
            case 'pow':
                result = Math.pow(valueToProcess, 2);
                symbol = `${parseFloat(valueToProcess.toFixed(4))}²`;
                break;
            case 'fact':
                if (valueToProcess < 0) { displayValue = "Error"; updateDisplay(); return; }
                result = factorial(Math.floor(valueToProcess));
                symbol = `${Math.floor(valueToProcess)}!`;
                break;
        }

        result = parseFloat(result.toFixed(8));
        historyValue = symbol + ' = ' + result;
        displayValue = result.toString();
        lastResult = result;

        // Scientific functions are one-off, they don't chain with "=" like arithmetic
        isResultState = true;
        lastModifier = '';

        updateDisplay();
        triggerConfetti();
    }

    function factorial(n) {
        if (n === 0 || n === 1) return 1;
        if (n > 170) return Infinity;
        let r = 1;
        for (let i = 2; i <= n; i++) r *= i;
        return r;
    }

    function evaluateExpression(expr) {
        let cleanExpr = expr
            .replace(/×/g, '*')
            .replace(/÷/g, '/')
            .replace(/\^/g, '**')
            .replace(/π/g, Math.PI)
            .replace(/e/g, Math.E);

        if (!/^[\d\.\+\-\*\/\(\)\s\^e]+$/.test(cleanExpr) && !cleanExpr.includes(Math.PI) && !cleanExpr.includes(Math.E)) {
            // simple guard
        }

        return new Function('return ' + cleanExpr)();
    }

    function calculate() {
        if (displayValue === '') return;

        let expressionToEvaluate = displayValue;

        try {
            // Check if we are repeating the last operation (Result State + stored modifier)
            if (isResultState && lastModifier) {
                expressionToEvaluate = displayValue + lastModifier;
            } else {
                // Extract the last operation for potential future repeat
                // Regex: Finds the last operator and everything following it
                const match = displayValue.match(/([+\-*/^])([^+\-*/^]*)$/);
                if (match) {
                    lastModifier = match[0];
                } else {
                    lastModifier = '';
                }
            }

            const result = evaluateExpression(expressionToEvaluate);

            if (!isFinite(result) || isNaN(result)) {
                displayValue = 'Error';
                isResultState = false;
            } else {
                let finalRes = parseFloat(result.toFixed(8));

                // Update history to show what just happened
                if (isResultState && lastModifier) {
                     // e.g. "2 + 1 ="
                     historyValue = `${displayValue} ${lastModifier} =`;
                } else {
                     // e.g. "1 + 1 ="
                     historyValue = `${displayValue} =`;
                }

                displayValue = finalRes.toString();
                lastResult = finalRes;
                isResultState = true;

                triggerConfetti();
            }
        } catch (e) {
            displayValue = 'Error';
            isResultState = false;
        }
        updateDisplay();
    }

    // Keyboard support with visual feedback
    document.addEventListener('keydown', (e) => {
        const key = e.key;
        let btnSelector = null;

        // Map keys to buttons for visual feedback
        if (/[0-9]/.test(key)) btnSelector = `button[data-key="${key}"]`;
        else if (['+', '-', '*', '/'].includes(key)) btnSelector = `button[data-key="${key}"]`;
        else if (key === 'Enter' || key === '=') btnSelector = `button[data-key="Enter"]`;
        else if (key === 'Backspace') btnSelector = `button[data-key="Backspace"]`;
        else if (key === 'Escape') btnSelector = `button[data-key="Escape"]`;
        else if (key === '.') btnSelector = `button[data-key="."]`;
        else if (key === '(' || key === ')') btnSelector = `button[data-key="${key}"]`;
        else if (key === '^') btnSelector = `button[data-key="^"]`;

        // Highlight button
        if (btnSelector) {
            const btn = document.querySelector(btnSelector);
            if (btn) {
                btn.classList.add('btn-active');
                setTimeout(() => btn.classList.remove('btn-active'), 150);
                // Also trigger the click logic
                btn.click();
                e.preventDefault(); // Prevent double input if focus is weird
            }
        }
    });
</script>
</body>
</html>
