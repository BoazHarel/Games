scene.add(buildRoom());
scene.add(buildFurniture());
scene.add(buildToys());
initSparkles();
loadCustom();
buildBronco();
buildGarageUI();
setupStick();
setupGoPad();
setupHelpBtn();
setupTilt();

let mode = 'start'; // 'start' | 'customize' | 'play'
let last = performance.now();
let hintHidden = false;
let garageSpin = 0;

function showStart() {
  mode = 'start';
  helpHold = 0;
  stuckTimer = 0;
  softBounceFails = 0;
  autoUnstuckDone = false;
  driveSuccess = false;
  camNudgeT = 0;
  goArrowTimer = 0;
  restoreGaragePos();
  setDriveCues(false);
  setGoArrowOverlay(false);
  setHelpVisible(false);
  stuckTimer = 0;
  input.go = false;
  input.goBurst = 0;
  document.getElementById('start').classList.remove('hide');
  document.getElementById('garage').classList.remove('show');
  document.getElementById('garage').setAttribute('aria-hidden', 'true');
  document.getElementById('hud').classList.remove('show');
  bronco.group.rotation.y = bronco.yaw;
  // Soft-stop driving velocity when returning home
  bronco.vx = 0;
  bronco.vz = 0;
  bronco.speed = 0;
}

const garageSavedPos = { x: 0, z: 0, yaw: 0, saved: false };

function showGarage() {
  mode = 'customize';
  garageSpin = 0;
  saveCustom();
  document.getElementById('start').classList.add('hide');
  document.getElementById('garage').classList.add('show');
  document.getElementById('garage').setAttribute('aria-hidden', 'false');
  document.getElementById('hud').classList.remove('show');
  bronco.vx = 0;
  bronco.vz = 0;
  bronco.speed = 0;
  // Park on the rug for a clear live showcase (restore on leave)
  if (!garageSavedPos.saved) {
    garageSavedPos.x = bronco.x;
    garageSavedPos.z = bronco.z;
    garageSavedPos.yaw = bronco.yaw;
    garageSavedPos.saved = true;
  }
  bronco.x = 0;
  bronco.z = 0.4;
  bronco.yaw = 0;
  bronco.group.position.set(bronco.x, 0, bronco.z);
  syncGarageUI();
}

function restoreGaragePos() {
  if (!garageSavedPos.saved) return;
  bronco.x = garageSavedPos.x;
  bronco.z = garageSavedPos.z;
  bronco.yaw = garageSavedPos.yaw;
  bronco.group.position.set(bronco.x, 0, bronco.z);
  bronco.group.rotation.y = bronco.yaw;
  garageSavedPos.saved = false;
}

async function startPlay() {
  saveCustom();
  applyCustomization(true);
  await requestMotionPermission();
  restoreGaragePos();
  mode = 'play';
  playElapsed = 0;
  goFirstBurstUsed = false;
  driveSuccess = false;
  playStartX = bronco.x;
  playStartZ = bronco.z;
  input.goBurst = 0;
  stuckTimer = 0;
  softBounceCd = 0;
  softBounceFails = 0;
  autoUnstuckDone = false;
  helpHold = 0;
  camNudgeT = 0;
  goArrowTimer = 3.0;
  setHelpVisible(false);
  setDriveCues(true);
  setGoArrowOverlay(true);
  document.getElementById('start').classList.add('hide');
  document.getElementById('garage').classList.remove('show');
  document.getElementById('garage').setAttribute('aria-hidden', 'true');
  document.getElementById('hud').classList.add('show');
  const hint = document.getElementById('hint');
  if (hint) {
    hint.style.display = '';
    hint.style.opacity = '0.75';
  }
  hintHidden = false;
  bronco.group.rotation.y = bronco.yaw;
  const c = Math.cos(bronco.yaw);
  const s = Math.sin(bronco.yaw);
  camPos.set(bronco.x - s * 5.0, 4.35, bronco.z - c * 5.0);
  camTarget.set(bronco.x, 1.05, bronco.z);
  camera.position.copy(camPos);
  // Short wordless-friendly hint; fade quick — GO pulse is the real cue
  setTimeout(() => {
    const h = document.getElementById('hint');
    if (h) h.style.opacity = '0';
    setTimeout(() => { if (h) h.style.display = 'none'; }, 500);
    hintHidden = true;
  }, 3500);
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (mode === 'play') {
    playElapsed += dt;
    // Giant ▲ overlay for first 3s
    if (goArrowTimer > 0) {
      goArrowTimer -= dt;
      if (goArrowTimer <= 0 || driveSuccess) setGoArrowOverlay(false);
    }
    // Track first successful move (>1.5 units from play start) or meaningful speed
    if (!driveSuccess) {
      const disp = Math.hypot(bronco.x - playStartX, bronco.z - playStartZ);
      if (disp > 1.5 || Math.abs(bronco.speed) > MAX_SPEED * 0.4) {
        driveSuccess = true;
      }
    }
    // Keep .cue ≥12s OR until proven successful move — never on pointerdown alone
    if (cueActive && (driveSuccess || playElapsed > 12)) {
      setDriveCues(false);
    }
    updateBronco(dt);
    updateSparkles(dt);
    updateCamera(dt);
  } else if (mode === 'customize') {
    // Close showcase orbit — truck fills the open area above the paint panel
    garageSpin += dt * 0.7;
    bronco.group.rotation.y = bronco.yaw + garageSpin;
    bronco.group.position.set(bronco.x, 0, bronco.z);
    const t = now * 0.00045;
    const bx = bronco.x;
    const bz = bronco.z;
    const radius = 3.35;
    const height = 2.15;
    camera.position.set(bx + Math.sin(t) * radius, height, bz + Math.cos(t) * radius);
    camera.lookAt(bx, 0.85, bz);
  } else {
    // Idle orbit — frame Bronco so start overlay shows him clearly
    bronco.group.rotation.y = bronco.yaw + now * 0.00015;
    const t = now * 0.0003;
    const bx = bronco.x, bz = bronco.z;
    camera.position.set(bx + Math.sin(t) * 7.2, 4.8, bz + Math.cos(t) * 7.2);
    camera.lookAt(bx, 1.0, bz);
  }
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

// ---------- Protected actions (avoid accidental home/reset) ----------
function bindHoldAction(el, opts) {
  if (!el) return;
  const holdMs = opts.holdMs || 700;
  const doubleTapMs = opts.doubleTapMs || 0;
  const onFire = opts.onFire;
  const ring = el.querySelector('.holdRing');
  let holding = false;
  let startT = 0;
  let raf = 0;
  let lastTapT = 0;
  let fired = false;
  let pid = null;

  function setHold(p) {
    if (ring) ring.style.setProperty('--hold', String(Math.max(0, Math.min(100, p * 100))));
  }
  function clearHold() {
    holding = false;
    fired = false;
    pid = null;
    el.classList.remove('holding');
    setHold(0);
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
  }
  function tick() {
    if (!holding) return;
    const p = (performance.now() - startT) / holdMs;
    setHold(p);
    if (p >= 1) {
      fired = true;
      clearHold();
      onFire();
      return;
    }
    raf = requestAnimationFrame(tick);
  }
  function onDown(e) {
    if (e.button != null && e.button !== 0) return;
    e.preventDefault();
    e.stopPropagation();
    // Double-tap shortcut (Home from play)
    if (doubleTapMs > 0) {
      const now = performance.now();
      if (now - lastTapT <= doubleTapMs) {
        lastTapT = 0;
        clearHold();
        onFire();
        return;
      }
      lastTapT = now;
    }
    holding = true;
    fired = false;
    startT = performance.now();
    pid = e.pointerId;
    el.classList.add('holding');
    setHold(0);
    try { el.setPointerCapture(pid); } catch (_) {}
    raf = requestAnimationFrame(tick);
  }
  function onUp(e) {
    if (pid != null && e.pointerId != null && e.pointerId !== pid) return;
    // Release before threshold = cancel (single tap does nothing)
    if (!fired) clearHold();
  }
  el.addEventListener('pointerdown', onDown);
  el.addEventListener('pointerup', onUp);
  el.addEventListener('pointercancel', onUp);
  el.addEventListener('lostpointercapture', () => { if (holding && !fired) clearHold(); });
  // Block native click so accidental taps never fire
  el.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); });
}

document.getElementById('driveBtn').addEventListener('click', () => startPlay());
document.getElementById('customizeBtn').addEventListener('click', () => showGarage());
bindHoldAction(document.getElementById('homeBtn'), {
  holdMs: 700,
  doubleTapMs: 400,
  onFire: () => showStart(),
});
bindHoldAction(document.getElementById('garageResetBtn'), {
  holdMs: 600,
  onFire: () => {
    custom = { ...DEFAULT_CUSTOM };
    applyCustomization(true);
  },
});
