<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#3FA9F5">
    <title>Bronco Off-Road Adventure</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --bronco-body: #FF9900; /* Default Cyber Orange */
            --bronco-roof: #F8F9FA; /* Default White */

            --ink: #2B1D14;
            --cream: #FFF8EC;
            --sun: #FFD23F;
            --orange: #FF8A1F;
            --go: #3FC35A;
            --go-dark: #23913C;
            --sky-top: #3FA9F5;
            --title-font: 'Lilita One', 'Arial Black', 'Trebuchet MS', sans-serif;
            --ui-font: 'Fredoka', 'Trebuchet MS', 'Segoe UI', sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevent scrolling */
            background-color: var(--sky-top);
            font-family: var(--ui-font);
            touch-action: none; /* Prevent default touch actions like pinch-zoom */
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* Golden-hour sky. Terrain + hills are drawn on canvases above this. */
            background:
                radial-gradient(ellipse 60% 45% at 72% 30%, rgba(255, 244, 196, 0.55), rgba(255, 244, 196, 0) 70%),
                linear-gradient(180deg, #3FA9F5 0%, #6EC3F7 30%, #A9E0FA 52%, #FFE9BE 72%, #FFD49A 100%);
        }

        #game-container.shake { animation: shake 0.42s cubic-bezier(.36, .07, .19, .97) both; }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 1px, 0); }
            20%, 80% { transform: translate3d(5px, -3px, 0); }
            30%, 50%, 70% { transform: translate3d(-9px, 4px, 0); }
            40%, 60% { transform: translate3d(9px, -4px, 0); }
        }

        /* ---------- Sky decoration (behind the hills) ---------- */
        .sun {
            position: absolute;
            z-index: 0;
            left: 70%;
            top: 12%;
            width: clamp(90px, 16vmin, 170px);
            height: clamp(90px, 16vmin, 170px);
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        .sun-rays {
            position: absolute;
            inset: -70%;
            border-radius: 50%;
            background: repeating-conic-gradient(from 0deg, rgba(255, 246, 200, 0.42) 0deg 9deg, rgba(255, 246, 200, 0) 9deg 22.5deg);
            -webkit-mask: radial-gradient(circle, #000 25%, transparent 68%);
            mask: radial-gradient(circle, #000 25%, transparent 68%);
            animation: sunspin 70s linear infinite;
        }
        .sun-glow {
            position: absolute;
            inset: -45%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 240, 170, 0.8) 0%, rgba(255, 230, 150, 0.25) 45%, rgba(255, 230, 150, 0) 70%);
        }
        .sun-disc {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle at 38% 35%, #FFFBE0 0%, #FFE680 45%, #FFC93C 100%);
            box-shadow: 0 0 0 6px rgba(255, 236, 150, 0.45);
        }
        @keyframes sunspin { to { transform: rotate(360deg); } }

        .far-cloud {
            position: absolute;
            z-index: 0;
            left: 0;
            width: 160px;
            height: 96px;
            opacity: 0.75;
            pointer-events: none;
            animation: drift linear infinite;
            will-change: transform;
        }
        @keyframes drift {
            from { transform: translate3d(110vw, 0, 0) scale(var(--s, 1)); }
            to { transform: translate3d(-260px, 0, 0) scale(var(--s, 1)); }
        }

        /* Parallax hill layers (pre-rendered canvases, moved with transforms only) */
        .parallax {
            position: absolute;
            left: 0;
            z-index: 0;
            pointer-events: none;
            will-change: transform;
        }

        /* The Bronco container */
        #bronco {
            position: absolute;
            top: 0;
            left: 0;
            width: 200px;
            height: 120px;
            z-index: 10;
            transform-origin: 50% 100%; /* Rotate from the center-bottom (between wheels) */
            will-change: transform;
        }
        .bronco-inner {
            position: absolute;
            inset: 0;
            transform-origin: 50% 100%;
        }
        .bronco-inner svg { overflow: visible; display: block; }

        /* Wheels spinning animation */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .wheel-spin {
            animation: spin 0.46s linear infinite;
            transform-origin: 0px 0px; /* Fixed axis to the exact center of the SVG wheel group */
        }

        /* Little suspension bounce while driving */
        .driving .chassis { animation: bob 0.24s ease-in-out infinite alternate; }
        .crashed .chassis { animation: none; }
        @keyframes bob {
            from { transform: translateY(0); }
            to { transform: translateY(-1.6px); }
        }

        /* Dizzy stars after a bump */
        .dizzy {
            position: absolute;
            left: 50%;
            top: -8px;
            width: 0;
            height: 0;
            display: none;
        }
        .crashed .dizzy { display: block; }
        .dizzy span {
            position: absolute;
            left: -11px;
            top: -11px;
            width: 22px;
            height: 22px;
            animation: orbit 1.1s linear infinite;
        }
        .dizzy span:nth-child(2) { animation-delay: -0.37s; }
        .dizzy span:nth-child(3) { animation-delay: -0.73s; }
        @keyframes orbit {
            0% { transform: translate(-44px, 0) scale(0.8); }
            25% { transform: translate(0, 8px) scale(1.1); }
            50% { transform: translate(44px, 0) scale(0.8); }
            75% { transform: translate(0, -8px) scale(0.6); }
            100% { transform: translate(-44px, 0) scale(0.8); }
        }

        /* Interactive Elements (Obstacles/Collectibles) */
        .obstacle {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 5;
            will-change: transform;
            transform-origin: 50% 100%;
        }
        .obstacle svg, .collectible svg, .cloud svg { overflow: visible; display: block; }

        .cloud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100px;
            height: 60px;
            z-index: 1;
            opacity: 0.95;
            will-change: transform;
            pointer-events: none;
        }

        /* Bug wing flapping */
        .flap-y { animation: flapY 0.11s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
        .flap-x { animation: flapX 0.22s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 50%; }
        @keyframes flapY { from { transform: scaleY(1); } to { transform: scaleY(0.4); } }
        @keyframes flapX { from { transform: scaleX(1); } to { transform: scaleX(0.3); } }

        #fx-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 12;
            pointer-events: none;
        }

        /* ---------- HUD ---------- */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none; /* Let clicks pass through to game container */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 14px max(14px, env(safe-area-inset-left));
            box-sizing: border-box;
        }

        .hud-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .score-board {
            display: flex;
            align-items: center;
            gap: clamp(6px, 1.2vmin, 12px);
            padding: clamp(4px, 0.9vmin, 8px) clamp(14px, 2.4vmin, 22px) clamp(4px, 0.9vmin, 8px) clamp(5px, 0.9vmin, 8px);
            background: linear-gradient(180deg, rgba(43, 29, 20, 0.78), rgba(43, 29, 20, 0.62));
            border: 3px solid rgba(255, 255, 255, 0.85);
            border-radius: 999px;
            box-shadow: 0 5px 0 rgba(43, 29, 20, 0.35), 0 10px 22px rgba(0, 0, 0, 0.18);
            color: #FFF;
            pointer-events: auto;
        }
        .hud-icon {
            width: clamp(34px, 6.4vmin, 54px);
            height: clamp(34px, 6.4vmin, 54px);
            flex: none;
            display: grid;
            place-items: center;
            border-radius: 50%;
        }
        .hud-icon svg { width: 100%; height: 100%; overflow: visible; }
        .hud-text { display: flex; flex-direction: column; line-height: 1; }
        .hud-label {
            font-family: var(--ui-font);
            font-weight: 600;
            font-size: clamp(11px, 1.8vmin, 15px);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0.85;
        }
        .hud-num {
            font-family: var(--title-font);
            font-size: clamp(26px, 5vmin, 42px);
            letter-spacing: 0.02em;
            transition: color 0.2s;
            text-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
        }
        #score-display {
            display: inline-block;
            transition: transform 0.12s ease-out;
            transform-origin: 50% 60%;
        }

        .toast {
            position: absolute;
            left: 50%;
            top: 22%;
            transform: translate(-50%, -50%) scale(0);
            font-family: var(--title-font);
            font-size: clamp(34px, 8vmin, 72px);
            color: var(--sun);
            letter-spacing: 0.03em;
            -webkit-text-stroke: 3px var(--ink);
            paint-order: stroke fill;
            text-shadow: 0 6px 0 var(--ink), 0 12px 24px rgba(0, 0, 0, 0.25);
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
        }
        .toast.show { animation: toast 1.3s cubic-bezier(.2, .9, .3, 1.2) forwards; }
        @keyframes toast {
            0% { transform: translate(-50%, -50%) scale(0) rotate(-8deg); opacity: 0; }
            18% { transform: translate(-50%, -50%) scale(1.15) rotate(3deg); opacity: 1; }
            30% { transform: translate(-50%, -50%) scale(1) rotate(-2deg); opacity: 1; }
            78% { transform: translate(-50%, -60%) scale(1) rotate(0); opacity: 1; }
            100% { transform: translate(-50%, -90%) scale(0.9); opacity: 0; }
        }

        /* ---------- Menus ---------- */
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--ink);
            text-align: center;
            pointer-events: auto; /* Catch clicks */
            box-sizing: border-box;
            padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
            background:
                radial-gradient(ellipse 80% 70% at 50% 45%, rgba(255, 236, 190, 0.18), rgba(255, 236, 190, 0) 70%),
                linear-gradient(180deg, rgba(20, 40, 90, 0.40), rgba(40, 20, 10, 0.55));
        }

        .menu-card {
            position: relative;
            box-sizing: border-box;
            background:
                radial-gradient(circle at 20% 0%, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0) 45%),
                linear-gradient(180deg, #FFFDF6, #FFEFD2);
            border: 5px solid var(--ink);
            border-radius: clamp(22px, 4vmin, 40px);
            box-shadow: 0 10px 0 var(--ink), 0 24px 50px rgba(0, 0, 0, 0.35);
            animation: cardIn 0.5s cubic-bezier(.2, 1.3, .4, 1) both;
        }
        @keyframes cardIn {
            from { transform: translateY(40px) scale(0.85); opacity: 0; }
            to { transform: none; opacity: 1; }
        }

        .title {
            margin: 0;
            font-family: var(--title-font);
            font-weight: 400;
            line-height: 0.95;
            color: var(--orange);
            letter-spacing: 0.02em;
            -webkit-text-stroke: 0.09em var(--ink);
            paint-order: stroke fill;
            text-shadow: 0 0.09em 0 var(--ink);
        }
        .title .alt { color: #3FA9F5; display: inline-block; animation: wobble 2.6s ease-in-out infinite; }
        @keyframes wobble {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg) translateY(-2px); }
        }

        /* Start screen layout: stacked in portrait, side-by-side in landscape */
        .start-card {
            width: min(94vw, 600px);
            padding: clamp(14px, 3vmin, 30px);
            display: grid;
            grid-template-columns: 1fr;
            gap: clamp(8px, 2vmin, 20px);
            align-items: center;
        }
        .start-hero { display: flex; flex-direction: column; align-items: center; }
        .start-card .title { font-size: clamp(30px, 9vw, 64px); }

        .preview-stage {
            position: relative;
            width: min(78vw, 440px, 52vh);
            aspect-ratio: 200 / 132;
            margin-top: clamp(4px, 1.5vmin, 14px);
        }
        .preview-ground {
            position: absolute;
            left: -6%;
            right: -6%;
            bottom: 0;
            height: 16%;
            border-radius: 50%;
            background: radial-gradient(ellipse at 50% 35%, #7EDB5A 0%, #4FB446 55%, #2E8B3E 100%);
            box-shadow: inset 0 -6px 0 rgba(0, 0, 0, 0.12);
        }
        .preview-shadow {
            position: absolute;
            left: 10%;
            right: 10%;
            bottom: 4%;
            height: 8%;
            border-radius: 50%;
            background: radial-gradient(ellipse, rgba(20, 40, 10, 0.45), rgba(20, 40, 10, 0) 70%);
        }
        .preview-bronco {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            aspect-ratio: 200 / 120;
            transform-origin: 50% 100%;
            animation: idle 1.6s ease-in-out infinite;
        }
        .preview-bronco svg { width: 100%; height: 100%; overflow: visible; display: block; }
        .preview-bronco .chassis { animation: bob 0.9s ease-in-out infinite alternate; }
        @keyframes idle {
            0%, 100% { transform: translateY(1.5%); }
            50% { transform: translateY(0); }
        }
        .splat {
            position: absolute;
            width: 18px;
            height: 18px;
            margin: -9px 0 0 -9px;
            border-radius: 50%;
            border: 3px solid var(--ink);
            pointer-events: none;
            animation: splat 0.7s cubic-bezier(.2, .8, .3, 1) forwards;
        }
        @keyframes splat {
            0% { transform: translate(0, 0) scale(0.3); opacity: 1; }
            70% { opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(1); opacity: 0; }
        }

        .start-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(8px, 1.8vmin, 16px);
        }

        .color-section {
            width: 100%;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.65);
            padding: clamp(8px, 1.6vmin, 14px) clamp(8px, 1.6vmin, 16px) clamp(10px, 2vmin, 16px);
            border-radius: clamp(16px, 3vmin, 26px);
            border: 3px solid rgba(43, 29, 20, 0.15);
        }
        .section-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--ui-font);
            font-weight: 700;
            font-size: clamp(16px, 3.2vmin, 26px);
            color: var(--ink);
        }
        .section-label svg { width: 1.3em; height: 1.3em; }

        .color-row {
            display: flex;
            justify-content: center;
            gap: clamp(8px, 2vmin, 16px);
            margin-top: clamp(6px, 1.2vmin, 10px);
        }

        .color-swatch {
            position: relative;
            width: clamp(40px, 10.5vw, 70px);
            height: clamp(40px, 10.5vw, 70px);
            border-radius: 50%;
            border: 4px solid var(--ink);
            box-shadow: 0 5px 0 var(--ink), inset 0 -7px 0 rgba(0, 0, 0, 0.18);
            cursor: pointer;
            transition: transform 0.18s cubic-bezier(.3, 1.6, .5, 1), box-shadow 0.18s;
            flex: none;
        }
        .color-swatch::after {
            content: '';
            position: absolute;
            left: 18%;
            top: 12%;
            width: 34%;
            height: 26%;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.75);
            transform: rotate(-25deg);
        }
        .color-swatch:active { transform: scale(0.9); }

        .swatch-selected {
            transform: translateY(-4px) scale(1.14);
            box-shadow: 0 0 0 5px #FFF, 0 0 0 9px var(--sun), 0 9px 0 4px rgba(43, 29, 20, 0.6), inset 0 -7px 0 rgba(0, 0, 0, 0.18);
        }

        .big-button {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4em;
            background: linear-gradient(180deg, #6EE07F 0%, var(--go) 55%, #31AE4C 100%);
            border: 5px solid var(--ink);
            border-radius: 999px;
            padding: 0.38em 1.25em 0.42em;
            font-size: clamp(26px, 5.4vmin, 46px);
            font-family: var(--title-font);
            letter-spacing: 0.04em;
            color: #FFF;
            -webkit-text-stroke: 0.08em var(--ink);
            paint-order: stroke fill;
            cursor: pointer;
            box-shadow: 0 8px 0 var(--ink), 0 16px 26px rgba(0, 0, 0, 0.3), inset 0 4px 0 rgba(255, 255, 255, 0.45);
            transition: transform 0.08s, box-shadow 0.08s;
            animation: pulse 1.4s ease-in-out infinite;
            touch-action: manipulation;
        }
        .big-button svg { width: 1em; height: 1em; flex: none; }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .big-button:active {
            animation: none;
            transform: translateY(8px);
            box-shadow: 0 0 0 var(--ink), 0 5px 10px rgba(0, 0, 0, 0.3), inset 0 4px 0 rgba(255, 255, 255, 0.45);
        }

        @media (orientation: landscape) {
            .start-card {
                width: min(96vw, 1060px);
                grid-template-columns: 1.08fr 1fr;
                gap: clamp(10px, 3vmin, 34px);
            }
            .start-card .title { font-size: clamp(28px, min(9vh, 6vw), 70px); }
            .preview-stage { width: min(42vw, 470px, 62vh); }
            .color-swatch { width: clamp(38px, min(10vh, 6.5vw), 70px); height: clamp(38px, min(10vh, 6.5vw), 70px); }
        }
        @media (orientation: landscape) and (max-height: 480px) {
            .menu-card { border-width: 4px; box-shadow: 0 6px 0 var(--ink), 0 14px 30px rgba(0, 0, 0, 0.35); }
            .big-button { border-width: 4px; box-shadow: 0 6px 0 var(--ink), 0 10px 18px rgba(0, 0, 0, 0.3), inset 0 3px 0 rgba(255, 255, 255, 0.45); }
            .color-swatch { border-width: 3px; box-shadow: 0 4px 0 var(--ink), inset 0 -5px 0 rgba(0, 0, 0, 0.18); }
            .swatch-selected { box-shadow: 0 0 0 4px #FFF, 0 0 0 7px var(--sun), inset 0 -5px 0 rgba(0, 0, 0, 0.18); }
        }

        /* Game over */
        .over-card {
            width: min(92vw, 560px);
            padding: clamp(18px, 4vmin, 40px) clamp(16px, 4vmin, 40px) clamp(20px, 4vmin, 36px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(8px, 2vmin, 18px);
        }
        #game-over-screen { animation: fadeIn 0.35s ease-out 0.45s both; }
        #game-over-screen .menu-card { animation-delay: 0.45s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .over-card .title { font-size: clamp(40px, 10vmin, 80px); color: #FF5A4E; }
        .final-row {
            display: flex;
            align-items: center;
            gap: clamp(10px, 2vmin, 18px);
            background: rgba(255, 255, 255, 0.7);
            border: 3px solid rgba(43, 29, 20, 0.15);
            border-radius: 999px;
            padding: 6px clamp(16px, 3vmin, 28px) 6px 8px;
        }
        .final-star { width: clamp(56px, 11vmin, 92px); height: clamp(56px, 11vmin, 92px); animation: starBob 1.4s ease-in-out infinite; }
        .final-star svg { width: 100%; height: 100%; overflow: visible; }
        @keyframes starBob {
            0%, 100% { transform: rotate(-8deg) scale(1); }
            50% { transform: rotate(8deg) scale(1.08); }
        }
        .final-text {
            margin: 0;
            font-family: var(--ui-font);
            font-weight: 700;
            font-size: clamp(22px, 4.6vmin, 38px);
            color: var(--ink);
        }
        #final-score {
            display: inline-block;
            font-family: var(--title-font);
            font-weight: 400;
            font-size: 1.5em;
            color: var(--orange);
            -webkit-text-stroke: 0.06em var(--ink);
            paint-order: stroke fill;
            min-width: 1ch;
        }
        .over-card .big-button { font-size: clamp(22px, 4.6vmin, 38px); margin-top: 6px; }
        .tap-hint {
            font-weight: 600;
            font-size: clamp(14px, 2.6vmin, 20px);
            color: rgba(43, 29, 20, 0.6);
            animation: fadeIn 0.4s ease-out 1.45s both;
        }

        .hidden {
            display: none !important;
        }

        @media (prefers-reduced-motion: reduce) {
            .sun-rays, .far-cloud, .big-button, .title .alt, .preview-bronco { animation: none !important; }
        }
    </style>
</head>
<body>

<!-- Shared SVG paint definitions (gradients / clips) used by every sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
        <linearGradient id="bx-bodyshade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity="0.5"/>
            <stop offset="0.22" stop-color="#fff" stop-opacity="0.1"/>
            <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
            <stop offset="1" stop-color="#000" stop-opacity="0.3"/>
        </linearGradient>
        <linearGradient id="bx-roofshade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity="0.45"/>
            <stop offset="0.3" stop-color="#fff" stop-opacity="0"/>
            <stop offset="1" stop-color="#000" stop-opacity="0.18"/>
        </linearGradient>
        <linearGradient id="bx-glass" x1="0" y1="0" x2="0.35" y2="1">

<script>

        START: 0,
        PLAYING: 1,
        GAME_OVER: 2
    };

    let currentState = GAME_STATE.START;
    let score = 0;
    let gameSpeed = 5; // Base horizontal scroll speed
    let speedMultiplier = 1; // Increases over time
    let animationFrameId;
    let lastTime = 0;

    const bronco = {
        element: document.getElementById('bronco'),
        frontWheel: document.getElementById('wheel-front'),
        backWheel: document.getElementById('wheel-back'),

        velocityY: 0,
        gravity: 0.6,

        angle: 0, // Current rotation angle

        height: 120
    };

    // Arrays for dynamic elements

    let collectibles = [];
    let clouds = [];

    // Canvas dimensions
    let cw, ch;

    // --- STREAMING_CHUNK:Terrain Engine... ---
    // Function to calculate exact ground height at any given world X coordinate
    function getTerrainY(worldX) {
        if (!ch) return 0;
        let baseHeight = ch * 0.7; // Base ground level

        // Sum of sine waves creates a natural, unpredictable rolling hill effect
        let y = baseHeight;
        y += Math.sin(worldX * 0.0015) * (ch * 0.18); // Massive rolling hills
        y += Math.sin(worldX * 0.004) * (ch * 0.08);  // Medium bumps
        y += Math.sin(worldX * 0.01) * (ch * 0.03);   // Small rocky details

        return y;
    }

    // Asset SVGs (Inline to avoid external requests)
