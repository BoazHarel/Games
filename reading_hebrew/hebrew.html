<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#8fd3ff">
    <title>Hebrew Words Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&family=Rubik:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        /* =========================================================
           PALETTE & TOKENS — warm storybook classroom
           ========================================================= */
        :root {
            --ink: #2f2a4a;
            --ink-soft: #6d6690;
            --ink-faint: #a49fbd;
            --paper: #fffdf6;
            --paper-2: #fff6e2;
            --paper-edge: #efe2c4;

            --sun: #ffc83d;   --sun-d: #e09a12;
            --leaf: #43bf62;  --leaf-d: #2a9446;  --leaf-bg: #e5f8e9;
            --berry: #f0525f; --berry-d: #c43546; --berry-bg: #ffe9eb;
            --word: #3440b0;

            /* answer tile tones */
            --t0: #3aa6f2; --t0d: #1d79c0; --t0bg: #ecf7ff;
            --t1: #ffad1f; --t1d: #d7840a; --t1bg: #fff6e0;
            --t2: #8a6cf5; --t2d: #6448d4; --t2bg: #f3efff;
            --t3: #ff6ea6; --t3d: #d64a85; --t3bg: #ffeff6;

            --radius-xl: 34px;
            --radius-lg: 26px;
            --depth: 8px;
            --font-ui: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
            --font-display: 'Fredoka', 'Nunito', system-ui, sans-serif;
            --font-he: 'Rubik', 'Arial Hebrew', 'Noto Sans Hebrew', 'Segoe UI', sans-serif;
            --emoji: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }

        body {
            font-family: var(--font-ui);
            color: var(--ink);
            background: #bfe6ff;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        button {
            font: inherit;
            color: inherit;
            border: 0;
            background: none;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        button:focus { outline: none; }
        button:focus-visible { outline: 4px solid #fff; outline-offset: 4px; }

        .hidden { display: none !important; }

        /* Essential for beautiful Hebrew rendering with Nikud:
           generous line-height + vertical padding so dots above/below never clip,
           and never letter-space Hebrew. */
        .hebrew, .hebrew-text {
            font-family: var(--font-he);
            line-height: 1.5;
            letter-spacing: 0;
            unicode-bidi: isolate;
        }

        .emoji { font-family: var(--emoji); line-height: 1; }

        /* =========================================================
           BACKGROUND SCENE
           ========================================================= */
        .scene {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
            background:
                radial-gradient(120% 70% at 50% 110%, rgba(255, 236, 196, .9) 0%, rgba(255, 236, 196, 0) 60%),
                linear-gradient(180deg, #86cfff 0%, #b9e5ff 38%, #e3f5ff 70%, #fff3dc 100%);
        }
        .sun {
            position: absolute;
            top: -70px;
            right: -50px;
            width: 260px;
            height: 260px;
        }
        .sun::before {
            content: "";
            position: absolute;
            inset: 70px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 38%, #fff6c9 0%, #ffd95a 45%, #ffc23a 100%);
            box-shadow: 0 0 60px 20px rgba(255, 214, 90, .55);
        }
        .sun-rays {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: repeating-conic-gradient(from 0deg, rgba(255, 226, 120, .55) 0deg 9deg, rgba(255, 226, 120, 0) 9deg 22.5deg);
            -webkit-mask: radial-gradient(circle, transparent 34%, #000 36%, #000 60%, transparent 71%);
                    mask: radial-gradient(circle, transparent 34%, #000 36%, #000 60%, transparent 71%);
            animation: spin 60s linear infinite;
        }

        .cloud {
            position: absolute;
            width: 180px;
            height: 56px;
            background: #fff;
            border-radius: 60px;
            opacity: .92;
            filter: drop-shadow(0 8px 0 rgba(120, 180, 230, .25));
            animation: drift linear infinite;
        }
        .cloud::before, .cloud::after {
            content: "";
            position: absolute;
            background: #fff;
            border-radius: 50%;
        }
        .cloud::before { width: 84px; height: 84px; left: 26px; top: -42px; }
        .cloud::after  { width: 64px; height: 64px; left: 92px; top: -28px; }
        .cloud.c1 { top: 12%; left: -220px; transform: scale(.9); animation-duration: 95s; animation-delay: -30s; }
        .cloud.c2 { top: 30%; left: -220px; transform: scale(.6); opacity: .75; animation-duration: 130s; animation-delay: -85s; }
        .cloud.c3 { top: 6%;  left: -220px; transform: scale(.7); opacity: .85; animation-duration: 110s; animation-delay: -5s; }

        .hills {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 26vh;
            min-height: 140px;
        }

        /* =========================================================
           SHARED SCREEN SHELL
           ========================================================= */
        .screen {
            position: fixed;
            inset: 0;
            z-index: 10;
        }

        /* =========================================================
           MENU
           ========================================================= */
        #menu-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        }
        .menu-inner {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(16px, 3.4vh, 40px);
            margin: auto;
        }
        .brand {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: popIn .6s cubic-bezier(.2, 1.4, .4, 1) both;
        }
        .mascot-wrap {
            position: relative;
            margin-bottom: 6px;
        }
        .mascot {
            width: clamp(76px, min(16vmin, 14vh), 132px);
            height: clamp(76px, min(16vmin, 14vh), 132px);
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: clamp(46px, min(10vmin, 8.6vh), 84px);
            background: radial-gradient(circle at 35% 30%, #ffffff 0%, #fff4d6 60%, #ffe2a3 100%);
            box-shadow: 0 8px 0 #f0c66b, 0 18px 30px rgba(120, 90, 30, .18), inset 0 -6px 0 rgba(240, 190, 90, .35);
            animation: float 3.2s ease-in-out infinite;
        }
        .bubble {
            position: absolute;
            top: 2px;
            left: calc(100% + 4px);
            font-family: var(--font-he);
            font-weight: 600;
            font-size: clamp(20px, 3.2vmin, 28px);
            line-height: 1.5;
            padding: 4px 18px 6px;
            background: #fff;
            color: var(--word);
            border-radius: 22px;
            box-shadow: 0 5px 0 rgba(47, 42, 74, .12);
            white-space: nowrap;
            transform-origin: 0 100%;
            animation: bubble 3.2s ease-in-out infinite;
        }
        .bubble::after {
            content: "";
            position: absolute;
            left: -8px;
            bottom: 10px;
            border: 9px solid transparent;
            border-right-color: #fff;
            border-left: 0;
        }
        .title {
            margin: 0;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: clamp(42px, min(9vmin, 9vh), 92px);
            line-height: .95;
            color: #fff;
            letter-spacing: .5px;
            paint-order: stroke fill;
            -webkit-text-stroke: clamp(8px, 1.4vmin, 14px) var(--word);
            text-shadow: 0 clamp(6px, 1vmin, 9px) 0 #1f2878, 0 16px 30px rgba(31, 40, 120, .25);
        }
        .title .line2 {
            display: block;
            color: var(--sun);
        }
        .tagline {
            margin: 14px 0 0;
            font-weight: 800;
            font-size: clamp(17px, 2.6vmin, 23px);
            color: var(--ink);
            background: rgba(255, 255, 255, .78);
            padding: 6px 20px;
            border-radius: 999px;
            box-shadow: 0 4px 0 rgba(47, 42, 74, .08);
        }
        .letter-tiles {
            display: flex;
            gap: 10px;
            margin: 6px 0 14px;
        }
        .letter-tiles span {
            width: clamp(40px, 6.4vmin, 54px);
            height: clamp(40px, 6.4vmin, 54px);
            display: grid;
            place-items: center;
            font-family: var(--font-he);
            font-weight: 700;
            font-size: clamp(24px, 4vmin, 34px);
            line-height: 1;
            color: #fff;
            border-radius: 14px;
            box-shadow: 0 5px 0 var(--d), inset 0 -3px 0 rgba(0, 0, 0, .08);
            background: var(--c);
            animation: tileBob 2.6s ease-in-out infinite;
        }
        .letter-tiles span:nth-child(1) { --c: var(--t0); --d: var(--t0d); transform: rotate(-6deg); }
        .letter-tiles span:nth-child(2) { --c: var(--t1); --d: var(--t1d); animation-delay: .25s; }
        .letter-tiles span:nth-child(3) { --c: var(--t3); --d: var(--t3d); transform: rotate(6deg); animation-delay: .5s; }

        .modes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: clamp(16px, 3vmin, 28px);
            width: 100%;
        }
        .mode-card {
            --c: var(--t0); --d: var(--t0d); --bg: var(--t0bg);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 10px;
            padding: 18px 22px 22px;
            background: var(--paper);
            border-radius: var(--radius-xl);
            border: 4px solid #fff;
            box-shadow: 0 var(--depth) 0 var(--d), 0 18px 32px rgba(47, 42, 74, .16);
            transition: transform .18s cubic-bezier(.3, 1.6, .5, 1), box-shadow .18s;
            animation: rise .6s cubic-bezier(.2, 1.2, .4, 1) both;
        }
        .mode-card.mode-find { --c: var(--t3); --d: var(--t3d); --bg: var(--t3bg); animation-delay: .08s; }
        .mode-card:active {
            transform: translateY(var(--depth));
            box-shadow: 0 0 0 var(--d), 0 6px 14px rgba(47, 42, 74, .14);
            transition-duration: .06s;
        }
        @media (hover: hover) {
            .mode-card:hover { transform: translateY(-5px) rotate(-.6deg); box-shadow: 0 calc(var(--depth) + 5px) 0 var(--d), 0 26px 40px rgba(47, 42, 74, .2); }
            .mode-card:hover .mode-art > * { transform: scale(1.12) rotate(-4deg); }
            .mode-card:active { transform: translateY(var(--depth)); box-shadow: 0 0 0 var(--d), 0 6px 14px rgba(47, 42, 74, .14); }
        }
        .mode-art {
            width: 100%;
            height: clamp(90px, min(20vmin, 15vh), 170px);
            border-radius: 24px;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at 20% 25%, rgba(255, 255, 255, .7) 0 8px, transparent 9px),
                radial-gradient(circle at 82% 70%, rgba(255, 255, 255, .55) 0 12px, transparent 13px),
                radial-gradient(circle at 70% 18%, rgba(255, 255, 255, .5) 0 5px, transparent 6px),
                var(--bg);
            border: 3px dashed color-mix(in srgb, var(--c) 45%, transparent);
            overflow: hidden;
        }
        .mode-art > * {
            transition: transform .3s cubic-bezier(.3, 1.6, .5, 1);
        }
        .mode-art .hebrew {
            font-size: clamp(76px, 14vmin, 118px);
            font-weight: 700;
            line-height: 1.2;
            color: var(--c);
            text-shadow: 0 6px 0 var(--d);
        }
        .mode-art .emoji {
            font-size: clamp(70px, 12vmin, 104px);
            filter: drop-shadow(0 6px 0 rgba(0, 0, 0, .1));
        }
        .mode-title {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: clamp(26px, 3.8vmin, 36px);
            line-height: 1.1;
            color: var(--ink);
        }
        .mode-desc {
            font-weight: 700;
            font-size: clamp(15px, 2.2vmin, 19px);
            color: var(--ink-soft);
            line-height: 1.3;
            max-width: 30ch;
        }
        .mode-go {
            margin-top: 4px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 26px;
            border-radius: 999px;
            background: var(--c);
            color: #fff;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: clamp(18px, 2.6vmin, 22px);
            box-shadow: 0 5px 0 var(--d);
        }
        .mode-go svg { width: 1em; height: 1em; }

        /* compact menu for narrow portrait phones */
        @media (max-width: 600px) {
            .modes { grid-template-columns: 1fr; }
            .mode-card { flex-direction: row; text-align: left; padding: 14px; gap: 14px; }
            .mode-art { width: 108px; height: 108px; flex: none; }
            .mode-art .hebrew { font-size: 72px; }
            .mode-art .emoji { font-size: 64px; }
            .mode-text { flex: 1; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
            .mode-go { padding: 8px 18px; }
            .bubble { left: auto; right: calc(100% + 4px); transform-origin: 100% 100%; }
            .bubble::after { left: auto; right: -8px; border-right-color: transparent; border-left: 9px solid #fff; border-right: 0; }
        }
        .mode-text { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        @media (max-width: 600px) { .mode-text { align-items: flex-start; } }

        /* short landscape phones: brand beside the cards */
        @media (orientation: landscape) and (max-height: 520px) {
            .menu-inner { flex-direction: row; max-width: 980px; gap: 24px; }
            .brand { flex: 0 0 38%; }
            .letter-tiles { display: none; }
            .modes { flex: 1; }
            .mode-art { height: 96px; }
            .mode-art .hebrew { font-size: 70px; }
            .mode-art .emoji { font-size: 62px; }
            .mode-desc { display: none; }
            .mascot { width: 80px; height: 80px; font-size: 50px; }
        }

        /* =========================================================
           GAME SCREEN
           ========================================================= */
        #game-screen {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            max-width: 1180px;
            margin: 0 auto;
            padding:
                max(12px, env(safe-area-inset-top))
                max(14px, env(safe-area-inset-right))
                max(14px, env(safe-area-inset-bottom))
                max(14px, env(safe-area-inset-left));
            gap: clamp(10px, 2vmin, 18px);
        }

        /* ---------- HUD ---------- */
        .hud {
            display: flex;
            align-items: center;
            gap: clamp(8px, 2vmin, 16px);
            flex: none;
        }
        .hud-chip {
            height: clamp(50px, 7.4vmin, 62px);
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, .92);
            border-radius: 999px;
            box-shadow: 0 5px 0 rgba(47, 42, 74, .14), 0 10px 20px rgba(47, 42, 74, .08);
        }
        .quit-btn {
            gap: 8px;
            padding: 0 18px 0 8px;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: clamp(15px, 2.2vmin, 18px);
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--ink-soft);
            transition: transform .1s, box-shadow .1s;
        }
        .quit-btn .x {
            width: clamp(36px, 5.4vmin, 44px);
            height: clamp(36px, 5.4vmin, 44px);
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #f1eefb;
            color: var(--ink-soft);
        }
        .quit-btn .x svg { width: 46%; height: 46%; }
        .quit-btn:active { transform: translateY(5px); box-shadow: 0 0 0 rgba(47, 42, 74, .14); }

        .meter {
            flex: 1;
            min-width: 60px;
            padding: 0 10px 0 16px;
            gap: 10px;
        }
        .meter-track {
            position: relative;
            flex: 1;
            height: 18px;
            border-radius: 999px;
            background: #efeaf8;
            box-shadow: inset 0 3px 0 rgba(47, 42, 74, .08);
            overflow: hidden;
        }
        .meter-fill {
            position: absolute;
            inset: 0 auto 0 0;
            width: 0%;
            border-radius: 999px;
            background:
                repeating-linear-gradient(-45deg, rgba(255, 255, 255, .28) 0 8px, rgba(255, 255, 255, 0) 8px 16px),
                linear-gradient(180deg, #ffd85c, #ffb21c);
            box-shadow: inset 0 -3px 0 rgba(200, 120, 0, .25), inset 0 3px 0 rgba(255, 255, 255, .45);
            transition: width .6s cubic-bezier(.3, 1.4, .5, 1);
            background-size: 32px 32px, 100% 100%;
            animation: stripes 1.2s linear infinite;
        }
        .meter-ticks {
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), rgba(255, 255, 255, .8) calc(10% - 2px) 10%);
        }
        .meter-cap {
            flex: none;
            font-size: clamp(24px, 3.6vmin, 30px);
            transition: transform .3s;
        }
        .meter.full .meter-cap { animation: wiggle .7s ease-in-out 2; }

        .score-pill {
            gap: 8px;
            padding: 0 20px 0 10px;
        }
        .score-pill .star-ic {
            width: clamp(34px, 5vmin, 42px);
            height: clamp(34px, 5vmin, 42px);
            filter: drop-shadow(0 3px 0 rgba(200, 130, 0, .35));
        }
        #score {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: clamp(26px, 4vmin, 34px);
            min-width: 1.2ch;
            text-align: center;
            color: var(--ink);
            font-variant-numeric: tabular-nums;
        }
        .score-pill.bump { animation: bump .5s cubic-bezier(.3, 1.8, .5, 1); }

        .hearts {
            gap: clamp(2px, .8vmin, 6px);
            padding: 0 14px;
        }
        .heart {
            width: clamp(28px, 4.4vmin, 36px);
            height: clamp(28px, 4.4vmin, 36px);
            display: block;
        }
        .heart.alive { animation: heartbeat 2.4s ease-in-out infinite; }
        .heart.alive:nth-child(2) { animation-delay: .2s; }
        .heart.alive:nth-child(3) { animation-delay: .4s; }
        .heart.lost .fill { fill: #ddd8ea; }
        .heart.lost .shine { opacity: 0; }
        .heart.breaking { animation: heartBreak .7s cubic-bezier(.3, 1.4, .5, 1); }

        @media (max-width: 560px) {
            .hud { gap: 6px; }
            .quit-btn { padding: 0 6px; }
            .quit-txt { display: none; }
            .meter { min-width: 0; padding: 0 8px 0 10px; gap: 6px; }
            .meter-cap { display: none; }
            .score-pill { padding: 0 12px 0 6px; gap: 4px; }
            .hearts { padding: 0 8px; gap: 1px; }
            .heart { width: 24px; height: 24px; }
            .answer-btn::before { width: 10px; height: 10px; top: 9px; left: 9px; }
        }
        @media (max-width: 340px) {
            .meter { display: none; }
        }

        /* ---------- STAGE ---------- */
        .stage {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-rows: minmax(0, .92fr) minmax(0, 1.3fr);
            gap: clamp(12px, 2.4vmin, 22px);
        }
        @media (orientation: landscape) and (min-width: 640px) {
            .stage {
                grid-template-rows: minmax(0, 1fr);
                grid-template-columns: minmax(0, 1fr) minmax(0, 1.18fr);
            }
        }

        /* ---------- QUESTION CARD ---------- */
        .q-card {
            position: relative;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: clamp(18px, 3vmin, 26px) clamp(14px, 3vmin, 28px) clamp(14px, 2.6vmin, 24px);
            background:
                radial-gradient(circle at 1px 1px, rgba(160, 140, 100, .16) 1.2px, transparent 1.6px) 0 0 / 22px 22px,
                linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
            border-radius: var(--radius-xl);
            box-shadow:
                0 var(--depth) 0 var(--paper-edge),
                0 22px 40px rgba(47, 42, 74, .16);
        }
        .q-card::before {
            content: "";
            position: absolute;
            inset: 10px;
            border: 3px dashed rgba(200, 175, 125, .45);
            border-radius: calc(var(--radius-xl) - 10px);
            pointer-events: none;
        }
        .q-card .tape {
            position: absolute;
            top: -12px;
            width: 92px;
            height: 28px;
            background: rgba(255, 200, 61, .72);
            border-radius: 4px;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .06);
        }
        .q-card .tape.l { left: 26px; transform: rotate(-8deg); }
        .q-card .tape.r { right: 26px; transform: rotate(7deg); background: rgba(255, 110, 166, .55); }

        .ribbon {
            position: relative;
            z-index: 1;
            margin: 0 0 4px;
            padding: 8px 26px 9px;
            border-radius: 999px;
            background: var(--word);
            box-shadow: 0 5px 0 #222b84;
            max-width: 100%;
        }
        #instruction-label {
            margin: 0;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: clamp(15px, 2.4vmin, 21px);
            letter-spacing: .04em;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #question-display {
            position: relative;
            z-index: 1;
            flex: 1;
            min-height: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            container-type: size;
            padding: 0 6px;
        }
        .q-word {
            position: relative;
            display: inline-block;
            white-space: nowrap;
            font-weight: 600;
            font-size: min(40cqh, 34cqw);
            line-height: 1.55;
            padding: .02em .25em .2em;
            color: var(--word);
            text-shadow: 0 .03em 0 rgba(52, 64, 176, .12);
        }
        .q-word::after {
            content: "";
            position: absolute;
            left: .2em;
            right: .2em;
            bottom: .1em;
            height: .13em;
            border-radius: 999px;
            background: rgba(255, 200, 61, .55);
            z-index: -1;
        }
        .q-emoji-wrap {
            position: relative;
            display: grid;
            place-items: center;
            width: min(62cqh, 70cqw);
            height: min(62cqh, 70cqw);
        }
        .q-emoji-wrap::before {
            content: "";
            position: absolute;
            inset: 4%;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 45%, #fff 0%, #fff7df 55%, #ffe7ad 100%);
            box-shadow: 0 6px 0 rgba(224, 154, 18, .25), inset 0 -6px 0 rgba(255, 200, 61, .25);
        }
        .q-emoji {
            position: relative;
            font-size: min(40cqh, 46cqw);
            filter: drop-shadow(0 6px 4px rgba(47, 42, 74, .18));
        }
        .q-english {
            margin-top: min(3cqh, 10px);
            font-family: var(--font-display);
            font-weight: 600;
            font-size: clamp(18px, min(11cqh, 9cqw), 30px);
            color: var(--ink-soft);
            background: #fff;
            padding: 4px 22px 5px;
            border-radius: 999px;
            box-shadow: 0 4px 0 rgba(47, 42, 74, .09);
        }
        .pop-in { animation: popIn .55s cubic-bezier(.2, 1.5, .4, 1) both; }
        .q-card.cheer { animation: cheer .6s cubic-bezier(.3, 1.6, .5, 1); }

        /* ---------- ANSWER TILES ---------- */
        .answers {
            min-height: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: clamp(12px, 2.4vmin, 22px);
            padding-bottom: var(--depth);
        }
        .answer-btn {
            --c: var(--t0); --d: var(--t0d); --bg: var(--t0bg);
            position: relative;
            min-height: 0;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 10px 12px;
            overflow: hidden;
            container-type: size;
            border-radius: var(--radius-lg);
            background:
                radial-gradient(120% 70% at 50% 0%, rgba(255, 255, 255, .95) 0%, rgba(255, 255, 255, 0) 70%),
                var(--bg);
            border: 4px solid color-mix(in srgb, var(--c) 55%, #fff);
            box-shadow: 0 var(--depth) 0 var(--d), 0 16px 26px rgba(47, 42, 74, .14);
            transition: transform .16s cubic-bezier(.3, 1.6, .5, 1), box-shadow .16s, background-color .2s, border-color .2s, opacity .3s, filter .3s;
        }
        .answer-btn.tone-1 { --c: var(--t1); --d: var(--t1d); --bg: var(--t1bg); }
        .answer-btn.tone-2 { --c: var(--t2); --d: var(--t2d); --bg: var(--t2bg); }
        .answer-btn.tone-3 { --c: var(--t3); --d: var(--t3d); --bg: var(--t3bg); }
        .answer-btn::before {
            /* little colored corner dot */
            content: "";
            position: absolute;
            top: 12px;
            left: 12px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--c);
            box-shadow: 0 3px 0 var(--d);
            opacity: .9;
        }
        .answer-btn:active:not(:disabled) {
            transform: translateY(var(--depth));
            box-shadow: 0 0 0 var(--d), 0 4px 10px rgba(47, 42, 74, .12);
            transition-duration: .05s;
        }
        @media (hover: hover) {
            .answer-btn:hover:not(:disabled) { transform: translateY(-4px); box-shadow: 0 calc(var(--depth) + 4px) 0 var(--d), 0 22px 30px rgba(47, 42, 74, .18); }
            .answer-btn:hover:not(:disabled) .a-emoji { transform: scale(1.1) rotate(-5deg); }
            .answer-btn:active:not(:disabled) { transform: translateY(var(--depth)); box-shadow: 0 0 0 var(--d), 0 4px 10px rgba(47, 42, 74, .12); }
        }
        .answer-btn:disabled { cursor: default; }
        .answer-btn.enter { animation: tileIn .5s cubic-bezier(.2, 1.4, .4, 1) both; }

        .a-emoji {
            font-size: min(42cqh, 42cqw);
            margin-bottom: min(4cqh, 8px);
            filter: drop-shadow(0 5px 3px rgba(47, 42, 74, .16));
            transition: transform .3s cubic-bezier(.3, 1.6, .5, 1);
        }
        .a-label {
            font-family: var(--font-display);
            font-weight: 600;
            font-size: clamp(15px, min(14cqh, 10cqw), 26px);
            line-height: 1.15;
            color: var(--ink-soft);
            text-align: center;
            max-width: 100%;
        }
        .a-hebrew {
            display: inline-block;
            white-space: nowrap;
            font-weight: 600;
            font-size: min(36cqh, 24cqw);
            line-height: 1.55;
            padding: 0 .1em;
            color: var(--ink);
        }

        /* result states */
        .answer-btn.correct-state {
            --c: var(--leaf); --d: var(--leaf-d);
            background: radial-gradient(120% 70% at 50% 0%, #fff 0%, rgba(255, 255, 255, 0) 70%), var(--leaf-bg);
            border-color: var(--leaf);
            box-shadow: 0 var(--depth) 0 var(--leaf-d), 0 0 0 6px rgba(67, 191, 98, .28), 0 18px 30px rgba(42, 148, 70, .25);
            animation: correctPop .55s cubic-bezier(.3, 1.8, .5, 1);
            z-index: 2;
        }
        .answer-btn.correct-state .a-label,
        .answer-btn.correct-state .a-hebrew { color: #1d6b33; }
        .answer-btn.wrong-state {
            --c: var(--berry); --d: var(--berry-d);
            background: var(--berry-bg);
            border-color: var(--berry);
            box-shadow: 0 var(--depth) 0 var(--berry-d), 0 0 0 6px rgba(240, 82, 95, .22);
        }
        .answer-btn.wrong-state .a-label,
        .answer-btn.wrong-state .a-hebrew { color: #9b2433; }
        .answer-btn.shake { animation: shake .5s cubic-bezier(.36, .07, .19, .97) both; }
        .answers.resolved .answer-btn:not(.correct-state):not(.wrong-state) {
            opacity: .62;
            filter: saturate(.35);
            transform: scale(.97);
        }

        .badge {
            position: absolute;
            top: 8px;
            right: 8px;
            width: clamp(40px, 26cqmin, 74px);
            height: clamp(40px, 26cqmin, 74px);
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: #fff;
            border: 4px solid #fff;
            z-index: 3;
            animation: badgePop .45s cubic-bezier(.2, 1.8, .4, 1) both;
        }
        .badge svg { width: 58%; height: 58%; }
        .badge.ok { background: var(--leaf); box-shadow: 0 4px 0 var(--leaf-d), 0 8px 16px rgba(42, 148, 70, .35); }
        .badge.no { background: var(--berry); box-shadow: 0 4px 0 var(--berry-d), 0 8px 16px rgba(196, 53, 70, .3); }

        /* =========================================================
           GAME OVER
           ========================================================= */
        #game-over-screen {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: radial-gradient(circle at 50% 40%, rgba(52, 64, 176, .45), rgba(31, 28, 60, .72));
            -webkit-backdrop-filter: blur(6px);
                    backdrop-filter: blur(6px);
            animation: fadeIn .3s ease both;
            overflow-y: auto;
        }
        .over-card {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: auto;
            padding: 22px clamp(20px, 5vmin, 40px) 24px;
            text-align: center;
            background:
                radial-gradient(circle at 1px 1px, rgba(160, 140, 100, .14) 1.2px, transparent 1.6px) 0 0 / 22px 22px,
                linear-gradient(180deg, var(--paper), var(--paper-2));
            border-radius: 40px;
            border: 6px solid #fff;
            box-shadow: 0 10px 0 var(--paper-edge), 0 30px 60px rgba(20, 16, 50, .4);
            animation: popIn .6s cubic-bezier(.2, 1.4, .4, 1) both;
        }
        .over-burst {
            position: relative;
            width: 150px;
            height: 150px;
            margin: -6px auto 0;
            display: grid;
            place-items: center;
        }
        .over-burst .rays {
            position: absolute;
            inset: -20px;
            border-radius: 50%;
            background: repeating-conic-gradient(rgba(255, 200, 61, .45) 0 12deg, rgba(255, 200, 61, 0) 12deg 30deg);
            -webkit-mask: radial-gradient(circle, #000 30%, transparent 70%);
                    mask: radial-gradient(circle, #000 30%, transparent 70%);
            animation: spin 14s linear infinite;
        }
        .over-burst .trophy {
            position: relative;
            font-size: 96px;
            filter: drop-shadow(0 8px 0 rgba(224, 154, 18, .35));
            animation: trophy 1.8s ease-in-out infinite;
        }
        .over-title {
            margin: 0;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: clamp(40px, 7vmin, 54px);
            line-height: 1.05;
            color: #fff;
            paint-order: stroke fill;
            -webkit-text-stroke: 10px var(--word);
            text-shadow: 0 6px 0 #1f2878;
        }
        .over-score {
            margin: 12px 0 18px;
            font-weight: 800;
            font-size: 22px;
            color: var(--ink-soft);
        }
        .score-burst {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            vertical-align: middle;
            margin: 0 4px;
            padding: 2px 16px 2px 8px;
            background: #fff;
            border-radius: 999px;
            box-shadow: 0 4px 0 rgba(224, 154, 18, .35);
        }
        .score-burst svg { width: 34px; height: 34px; }
        #final-score {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 40px;
            line-height: 1.2;
            color: var(--sun-d);
            font-variant-numeric: tabular-nums;
        }
        .missed {
            margin: 0 0 20px;
            padding: 12px 16px 14px;
            background: #fff;
            border-radius: 26px;
            border: 3px dashed #eadfc6;
        }
        .missed-label {
            margin: 0 0 4px;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 14px;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--ink-faint);
        }
        .missed-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }
        .missed-emoji { font-size: 56px; filter: drop-shadow(0 4px 3px rgba(47, 42, 74, .15)); }
        .missed-words { display: flex; flex-direction: column; align-items: center; min-width: 0; }
        .missed-he { font-size: clamp(22px, 7.5vw, 36px); white-space: nowrap; font-weight: 600; color: var(--word); line-height: 1.5; }
        .missed-en { font-family: var(--font-display); font-weight: 600; font-size: 18px; color: var(--ink-soft); margin-top: -4px; }

        .big-btn {
            width: 100%;
            padding: 18px 20px 20px;
            border-radius: 28px;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: clamp(28px, 4.6vmin, 34px);
            color: #fff;
            background: linear-gradient(180deg, #5fd57c, var(--leaf));
            box-shadow: 0 var(--depth) 0 var(--leaf-d), 0 16px 26px rgba(42, 148, 70, .3);
            text-shadow: 0 3px 0 rgba(0, 0, 0, .15);
            transition: transform .1s, box-shadow .1s;
            animation: breathe 2.2s ease-in-out infinite;
        }
        .big-btn:active {
            transform: translateY(var(--depth));
            box-shadow: 0 0 0 var(--leaf-d), 0 4px 10px rgba(42, 148, 70, .25);
            animation: none;
        }
        .link-btn {
            margin-top: 16px;
            padding: 8px 16px;
            font-weight: 800;
            font-size: 18px;
            color: var(--ink-soft);
            border-radius: 999px;
        }
        .link-btn:active { background: rgba(47, 42, 74, .06); }

        @media (max-height: 560px) {
            .over-burst { width: 96px; height: 96px; }
            .over-burst .trophy { font-size: 64px; }
            .over-score { margin: 6px 0 10px; }
            .missed { margin-bottom: 12px; padding: 6px 12px 8px; }
            .missed-emoji { font-size: 40px; }
            .missed-he { font-size: 28px; }
            .big-btn { padding: 12px; }
            .link-btn { margin-top: 6px; }
        }

        /* =========================================================
           FX LAYER (confetti, flying stars)
           ========================================================= */
        #fx-layer {
            position: fixed;
            inset: 0;
            z-index: 60;
            pointer-events: none;
            overflow: hidden;
        }
        .confetti {
            position: absolute;
            left: 0;
            top: 0;
            will-change: transform, opacity;
        }
        .fly-star {
            position: absolute;
            left: 0;
            top: 0;
            width: 40px;
            height: 40px;
            margin: -20px 0 0 -20px;
            will-change: transform, opacity;
        }

        /* =========================================================
           KEYFRAMES
           ========================================================= */
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes drift { from { translate: 0 0; } to { translate: calc(100vw + 460px) 0; } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes bubble { 0%, 100% { transform: rotate(-3deg) scale(1); } 50% { transform: rotate(2deg) scale(1.05); } }
        @keyframes tileBob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -6px; } }
        @keyframes rise { from { opacity: 0; transform: translateY(40px) scale(.95); } to { opacity: 1; transform: none; } }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(.5); }
            70% { opacity: 1; transform: scale(1.06); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes tileIn {
            0% { opacity: 0; transform: translateY(26px) scale(.85); }
            100% { opacity: 1; transform: none; }
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-3px, 0, 0) rotate(-1deg); }
            20%, 80% { transform: translate3d(6px, 0, 0) rotate(1deg); }
            30%, 50%, 70% { transform: translate3d(-9px, 0, 0) rotate(-1.5deg); }
            40%, 60% { transform: translate3d(9px, 0, 0) rotate(1.5deg); }
        }
        @keyframes correctPop {
            0% { transform: scale(1); }
            40% { transform: scale(1.07) rotate(-1deg); }
            100% { transform: scale(1); }
        }
        @keyframes badgePop {
            0% { opacity: 0; transform: scale(0) rotate(-40deg); }
            100% { opacity: 1; transform: scale(1) rotate(0); }
        }
        @keyframes cheer {
            0% { transform: none; }
            35% { transform: translateY(-8px) scale(1.02); }
            100% { transform: none; }
        }
        @keyframes bump {
            0% { transform: scale(1); }
            40% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }
        @keyframes heartbeat { 0%, 70%, 100% { transform: scale(1); } 80% { transform: scale(1.14); } 90% { transform: scale(.98); } }
        @keyframes heartBreak {
            0% { transform: scale(1.4); }
            30% { transform: scale(.7) rotate(-12deg); }
            60% { transform: scale(1.1) rotate(8deg); }
            100% { transform: scale(1) rotate(0); }
        }
        @keyframes stripes { to { background-position: 32px 0, 0 0; } }
        @keyframes wiggle { 0%, 100% { transform: rotate(0) scale(1); } 25% { transform: rotate(-14deg) scale(1.25); } 75% { transform: rotate(14deg) scale(1.25); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes trophy { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-8px) rotate(4deg); } }
        @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.025); } }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>
<body>

<!-- ============ BACKGROUND SCENE ============ -->
<div class="scene" aria-hidden="true">
    <div class="sun"><div class="sun-rays"></div></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <svg class="hills" viewBox="0 0 1440 300" preserveAspectRatio="none">
        <path d="M0 150 C 180 70 360 80 520 130 C 700 185 860 60 1060 80 C 1230 98 1340 150 1440 120 L1440 300 L0 300 Z" fill="#b6e48a"/>
        <path d="M0 210 C 220 140 420 150 620 200 C 820 248 1020 150 1220 165 C 1320 172 1390 190 1440 200 L1440 300 L0 300 Z" fill="#86cf62"/>
        <path d="M0 262 C 260 230 520 240 760 262 C 1000 284 1240 238 1440 250 L1440 300 L0 300 Z" fill="#6bbd4d"/>
        <g fill="#fff" opacity=".9">
            <circle cx="140" cy="232" r="5"/><circle cx="330" cy="212" r="4"/><circle cx="905" cy="226" r="5"/>
            <circle cx="1130" cy="196" r="4"/><circle cx="1310" cy="226" r="5"/><circle cx="560" cy="250" r="4"/>
        </g>
        <g fill="#ffcf3f">
            <circle cx="140" cy="232" r="2"/><circle cx="905" cy="226" r="2"/><circle cx="1310" cy="226" r="2"/>
        </g>
    </svg>
</div>

<!-- ============ MENU ============ -->
<div id="menu-screen" class="screen flex">
    <div class="menu-inner">
        <header class="brand">
            <div class="mascot-wrap">
                <div class="mascot emoji">🦉</div>
                <div class="bubble" dir="rtl" lang="he">שָׁלוֹם!</div>
            </div>
            <div class="letter-tiles" dir="rtl" lang="he" aria-hidden="true"><span>א</span><span>ב</span><span>ג</span></div>
            <h1 class="title">Hebrew<span class="line2">Playtime</span></h1>
            <p class="tagline">Learn words and read with Nikud!</p>
        </header>

        <div class="modes">
            <button onclick="startGame('read_hebrew')" class="mode-card mode-read">
                <span class="mode-art"><span class="hebrew" dir="rtl" lang="he">א</span></span>
                <span class="mode-text">
                    <span class="mode-title">Read Hebrew</span>
                    <span class="mode-desc">See the Hebrew word, pick the right picture!</span>
                    <span class="mode-go">Play <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg></span>
                </span>
            </button>

            <button onclick="startGame('find_hebrew')" class="mode-card mode-find">
                <span class="mode-art"><span class="emoji">🍎</span></span>
                <span class="mode-text">
                    <span class="mode-title">Find Hebrew</span>
                    <span class="mode-desc">See the picture, pick the right Hebrew word!</span>
                    <span class="mode-go">Play <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg></span>
                </span>
            </button>
        </div>
    </div>
</div>

<!-- ============ GAME ============ -->
<div id="game-screen" class="hidden screen">
    <!-- HUD -->
    <div class="hud">
        <button onclick="showMenu()" class="hud-chip quit-btn" aria-label="Quit">
            <span class="x"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
            <span class="quit-txt">Quit</span>
        </button>
        <div class="hud-chip meter" id="meter" aria-hidden="true">
            <div class="meter-track"><div class="meter-fill" id="meter-fill"></div><div class="meter-ticks"></div></div>
            <span class="meter-cap emoji">🏆</span>
        </div>
        <div class="hud-chip score-pill" id="score-pill">
            <svg class="star-ic" viewBox="0 0 48 48" aria-hidden="true"><use href="#star-shape"/></svg>
            <span id="score">0</span>
        </div>
        <div id="hearts-container" class="hud-chip hearts"></div>
    </div>

    <div class="stage">
        <!-- Question Card -->
        <section class="q-card" id="q-card">
            <span class="tape l"></span><span class="tape r"></span>
            <div class="ribbon"><h2 id="instruction-label">Choose the matching picture</h2></div>
            <div id="question-display">
                <!-- Content injected by JS -->
            </div>
        </section>

        <!-- Answers -->
        <section class="answers" id="answers">
            <button id="btn-0" onclick="handleGuess(0)" class="answer-btn tone-0"></button>
            <button id="btn-1" onclick="handleGuess(1)" class="answer-btn tone-1"></button>
            <button id="btn-2" onclick="handleGuess(2)" class="answer-btn tone-2"></button>
            <button id="btn-3" onclick="handleGuess(3)" class="answer-btn tone-3"></button>
        </section>
    </div>
</div>

<!-- ============ GAME OVER ============ -->
<div id="game-over-screen" class="hidden">
    <div class="over-card">
        <div class="over-burst"><div class="rays"></div><div class="trophy emoji">🏆</div></div>
        <h2 class="over-title">Great Job!</h2>

        <p class="over-score">You scored
            <span class="score-burst"><svg viewBox="0 0 48 48" aria-hidden="true"><use href="#star-shape"/></svg><span id="final-score">0</span></span>
            stars!</p>

        <div id="last-answer-display" class="missed hidden"></div>

        <button onclick="restartGame()" class="big-btn">Play Again!</button>
        <button onclick="showMenu()" class="link-btn">Back to Menu</button>
    </div>
</div>

<div id="fx-layer" aria-hidden="true"></div>

<!-- shared SVG symbols -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
        <linearGradient id="starGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffe36b"/>
            <stop offset="1" stop-color="#ffb415"/>
        </linearGradient>
        <linearGradient id="heartGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ff7f8c"/>
            <stop offset="1" stop-color="#e93a51"/>
        </linearGradient>

        { emoji: "🪐", hebrew: "כּוֹכַב לֶכֶת", english: "Planet" },
        { emoji: "☄️", hebrew: "שָׁבִיט", english: "Comet" },
        { emoji: "🏜️", hebrew: "מִדְבָּר", english: "Desert" },

        { emoji: "🌲", hebrew: "יַעַר", english: "Forest" },
        { emoji: "🌵", hebrew: "קַקְטוּס", english: "Cactus" },
        { emoji: "🌻", hebrew: "חַמָּנִיָּה", english: "Sunflower" }
    ];

    /* --- STREAMING_CHUNK:Game State and Elements --- */
    let score = 0;
    let strikes = 0;
    const maxStrikes = 3;
    let currentMode = 'read_hebrew';
    let currentOptions = [];
    let correctIndex = 0;
    let gameActive = false;
    let wordQueue = [];

    const screens = {
        menu: document.getElementById('menu-screen'),
        game: document.getElementById('game-screen'),
        over: document.getElementById('game-over-screen')
    };

    const ui = {
        score: document.getElementById('score'),
        hearts: document.getElementById('hearts-container'),
        instruction: document.getElementById('instruction-label'),
        questionDisplay: document.getElementById('question-display'),
        finalScore: document.getElementById('final-score'),
        buttons: [
            document.getElementById('btn-0'),
            document.getElementById('btn-1'),
            document.getElementById('btn-2'),
            document.getElementById('btn-3')
        ]
    };

    /* --- Presentation-only helpers (visual feedback; no game rules here) --- */
    const fx = {
        layer: document.getElementById('fx-layer'),
        scorePill: document.getElementById('score-pill'),
        meter: document.getElementById('meter'),
        meterFill: document.getElementById('meter-fill'),
        card: document.getElementById('q-card'),
        answers: document.getElementById('answers'),
        shownScore: 0,
        shownStrikes: 0,
        reduced: window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
    };

    const CONFETTI_COLORS = ['#3aa6f2', '#ffad1f', '#8a6cf5', '#ff6ea6', '#43bf62', '#ffd84a'];

    const HEART_SVG = (cls) => `
        <svg class="heart ${cls}" viewBox="0 0 48 48" aria-hidden="true">
            <path class="fill" fill="url(#heartGrad)" d="M24 42s-17-10.2-17-22.4C7 13 11.6 8.5 17.2 8.5c3.2 0 5.4 1.6 6.8 3.6 1.4-2 3.6-3.6 6.8-3.6C36.4 8.5 41 13 41 19.6 41 31.8 24 42 24 42z"/>
            <path class="shine" d="M13.5 17.5c.4-2.4 2-4 4.3-4.4" stroke="#fff" stroke-width="3.2" stroke-linecap="round" fill="none" opacity=".75"/>
        </svg>`;

    const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
    const CROSS_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>';

    function restartAnim(el, cls) {
        if (!el) return;
        el.classList.remove(cls);
        void el.offsetWidth; // reflow so the animation replays
        el.classList.add(cls);
    }

    function centerOf(el) {
        const r = el.getBoundingClientRect();
        return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    }

    function confettiBurst(x, y, count, power) {
        if (fx.reduced || !fx.layer.animate) return;
        for (let i = 0; i < count; i++) {
            const p = document.createElement('div');
            p.className = 'confetti';
            const size = 7 + Math.random() * 8;
            const isCircle = Math.random() < 0.35;
            p.style.width = size + 'px';
            p.style.height = (isCircle ? size : size * 0.55) + 'px';
            p.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
            p.style.borderRadius = isCircle ? '50%' : '2px';
            fx.layer.appendChild(p);

            const angle = Math.random() * Math.PI * 2;
            const speed = (0.45 + Math.random() * 0.75) * power;
            const dx = Math.cos(angle) * speed;
            const dy = Math.sin(angle) * speed - power * 0.55;
            const rot = (Math.random() - 0.5) * 900;
            const dur = 900 + Math.random() * 700;

            p.animate([
                { transform: `translate(${x}px, ${y}px) rotate(0deg)`, opacity: 1 },
                { transform: `translate(${x + dx}px, ${y + dy}px) rotate(${rot * 0.6}deg)`, opacity: 1, offset: 0.45 },
                { transform: `translate(${x + dx * 1.25}px, ${y + dy + power * 0.9}px) rotate(${rot}deg)`, opacity: 0 }
            ], { duration: dur, easing: 'cubic-bezier(.2,.7,.4,1)', fill: 'forwards' })
                .onfinish = () => p.remove();
        }
    }

    function flyStars(fromEl, toEl) {
        if (fx.reduced || !fx.layer.animate || !fromEl || !toEl) return;
        const a = centerOf(fromEl);
        const b = centerOf(toEl);
        for (let i = 0; i < 3; i++) {
            const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            s.setAttribute('viewBox', '0 0 48 48');
            s.setAttribute('class', 'fly-star');
            s.innerHTML = '<use href="#star-shape"/>';
            fx.layer.appendChild(s);
            const sx = a.x + (i - 1) * 34;
            const midX = (sx + b.x) / 2 + (i - 1) * 60;
            const midY = Math.min(a.y, b.y) - 60 - i * 20;
            s.animate([
                { transform: `translate(${sx}px, ${a.y}px) scale(.2) rotate(0deg)`, opacity: 0 },
                { transform: `translate(${sx}px, ${a.y - 30}px) scale(1.3) rotate(40deg)`, opacity: 1, offset: 0.2 },
                { transform: `translate(${midX}px, ${midY}px) scale(1.1) rotate(180deg)`, opacity: 1, offset: 0.6 },
                { transform: `translate(${b.x}px, ${b.y}px) scale(.5) rotate(320deg)`, opacity: 0.2 }
            ], { duration: 850, delay: i * 90, easing: 'cubic-bezier(.5,0,.6,1)', fill: 'both' })
                .onfinish = () => s.remove();
        }
    }

    /* Shrink a Hebrew word only if it would overflow its box (long words/phrases). */
    function fitText(el) {
        if (!el || !el.parentElement) return;
        el.style.fontSize = '';
        const box = el.parentElement;
        const cs = getComputedStyle(box);
        const availW = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
        const w = el.scrollWidth;
        if (availW > 0 && w > availW) {
            const base = parseFloat(getComputedStyle(el).fontSize);
            el.style.fontSize = Math.max(14, Math.floor(base * (availW / w) * 0.96)) + 'px';
        }
    }

    function fitAll() {
        document.querySelectorAll('[data-fit]').forEach(fitText);
    }

    let fitTimer = null;
    window.addEventListener('resize', () => {
        clearTimeout(fitTimer);
        fitTimer = setTimeout(fitAll, 80);
    });
    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(fitAll);
    }

    function updateMeter() {
        const inLevel = score % 10;
        const full = score > 0 && inLevel === 0;
        fx.meterFill.style.width = (full ? 100 : inLevel * 10) + '%';
        fx.meter.classList.toggle('full', full);
    }

    function countUp(el, target) {
        if (fx.reduced || target <= 0) { el.textContent = target; return; }
        const start = performance.now();
        const dur = Math.min(1400, 300 + target * 60);
        el.textContent = 0;
        function step(now) {
            const t = Math.min(1, (now - start) / dur);
            const eased = 1 - Math.pow(1 - t, 3);
            el.textContent = Math.round(target * eased);
            if (t < 1) requestAnimationFrame(step);
            else el.textContent = target;
        }
        requestAnimationFrame(step);
        // safety net: always land on the real score even if frames are throttled
        setTimeout(() => { el.textContent = target; }, dur + 120);
    }

    /* --- STREAMING_CHUNK:Core Game Logic --- */
    function shuffleArray(array) {
        let newArr = [...array];
        for (let i = newArr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
        }
        return newArr;
    }

    function showMenu() {
        gameActive = false;
        screens.game.classList.add('hidden');
        screens.over.classList.add('hidden');
        screens.menu.classList.remove('hidden');
        screens.menu.classList.add('flex');
    }

    function startGame(mode) {
        currentMode = mode;
        score = 0;
        strikes = 0;
        wordQueue = shuffleArray(hebrewVocabulary);

        updateUI();

        screens.menu.classList.add('hidden');
        screens.menu.classList.remove('flex');
        screens.over.classList.add('hidden');
        screens.game.classList.remove('hidden');
        screens.game.classList.add('flex');

        gameActive = true;
        generateRound();
    }

    function restartGame() {
        startGame(currentMode);
    }

    function updateUI() {
        ui.score.textContent = score;
        if (score > fx.shownScore) restartAnim(fx.scorePill, 'bump');
        fx.shownScore = score;

        let heartsHTML = '';
        for(let i=0; i<maxStrikes; i++) {
            if (i < (maxStrikes - strikes)) {
                heartsHTML += HEART_SVG('alive');
            } else {
                // the heart that was just lost gets a little "break" wobble
                const justLost = strikes > fx.shownStrikes && i === (maxStrikes - strikes);
                heartsHTML += HEART_SVG('lost' + (justLost ? ' breaking' : ''));
            }
        }
        ui.hearts.innerHTML = heartsHTML;
        fx.shownStrikes = strikes;

        updateMeter();
    }

    /* --- STREAMING_CHUNK:Question Generation --- */
    function generateRound() {
        if (!gameActive) return;

        // Reset Buttons
        fx.answers.classList.remove('resolved');
        ui.buttons.forEach((btn, index) => {
            btn.className = `answer-btn tone-${index} enter`;
            btn.style.animationDelay = (index * 70) + 'ms';
            btn.disabled = false;
            btn.innerHTML = '';
        });

        if (wordQueue.length === 0) {
            wordQueue = shuffleArray(hebrewVocabulary);
        }

        const correctWord = wordQueue.pop();

        // Get 3 distractors
        let distractors = [];
        let pool = hebrewVocabulary.filter(w => w.english !== correctWord.english);
        pool = shuffleArray(pool);
        distractors = pool.slice(0, 3);

        currentOptions = shuffleArray([correctWord, ...distractors]);
        correctIndex = currentOptions.indexOf(correctWord);

        // Render based on mode
        if (currentMode === 'read_hebrew') {
            ui.instruction.textContent = "What does this mean?";

            ui.questionDisplay.innerHTML = `
                <div class="hebrew q-word pop-in" dir="rtl" lang="he" data-fit>${correctWord.hebrew}</div>
            `;

            ui.buttons.forEach((btn, index) => {
                const item = currentOptions[index];
                btn.innerHTML = `
                    <span class="a-emoji emoji">${item.emoji}</span>
                    <span class="a-label">${item.english}</span>
                `;
            });

        } else {
            ui.instruction.textContent = "Find the matching word";

            ui.questionDisplay.innerHTML = `
                <div class="q-emoji-wrap pop-in"><span class="q-emoji emoji">${correctWord.emoji}</span></div>
                <div class="q-english pop-in" style="animation-delay:.12s">${correctWord.english}</div>
            `;

            ui.buttons.forEach((btn, index) => {
                const item = currentOptions[index];
                btn.innerHTML = `<span class="hebrew a-hebrew" dir="rtl" lang="he" data-fit>${item.hebrew}</span>`;
            });
        }

        fitAll();
    }

    /* --- STREAMING_CHUNK:Interaction Handling --- */
    function addBadge(btn, ok) {
        const b = document.createElement('div');
        b.className = 'badge ' + (ok ? 'ok' : 'no');
        b.innerHTML = ok ? CHECK_SVG : CROSS_SVG;
        btn.appendChild(b);
    }

    function handleGuess(btnIndex) {
        if (!gameActive) return;

        const selectedBtn = ui.buttons[btnIndex];
        const isCorrect = btnIndex === correctIndex;

        // Lock buttons
        ui.buttons.forEach(btn => btn.disabled = true);
        ui.buttons.forEach(btn => { btn.classList.remove('enter'); btn.style.animationDelay = '0ms'; });
        fx.answers.classList.add('resolved');

        if (isCorrect) {
            score++;
            selectedBtn.classList.add('correct-state');
            addBadge(selectedBtn, true);

            const c = centerOf(selectedBtn);
            confettiBurst(c.x, c.y, 34, Math.min(260, Math.max(150, selectedBtn.offsetWidth * 0.9)));
            flyStars(selectedBtn, fx.scorePill);
            restartAnim(fx.card, 'cheer');

            setTimeout(() => {
                updateUI();
                generateRound();
            }, 1000);

        } else {
            strikes++;
            updateUI();

            selectedBtn.classList.add('shake', 'wrong-state');
            addBadge(selectedBtn, false);

            // Highlight Correct Answer
            const correctBtn = ui.buttons[correctIndex];
            correctBtn.classList.add('correct-state');
            addBadge(correctBtn, true);

            if (strikes >= maxStrikes) {
                setTimeout(() => {
                    endGame(currentOptions[correctIndex]);
                }, 1500);
            } else {
                setTimeout(() => {
                    generateRound();
                }, 2000);
            }
        }
    }

    /* --- STREAMING_CHUNK:Game Over Logic --- */
    function endGame(lastCorrectWord) {
        gameActive = false;
        ui.finalScore.textContent = score;

        const lastAnswerEl = document.getElementById('last-answer-display');
        if (lastCorrectWord) {
             lastAnswerEl.innerHTML = `
                <p class="missed-label">You missed</p>
                <div class="missed-row">
                    <span class="missed-emoji emoji">${lastCorrectWord.emoji}</span>
                    <div class="missed-words">
                        <span class="hebrew missed-he" dir="rtl" lang="he">${lastCorrectWord.hebrew}</span>
                        <span class="missed-en">${lastCorrectWord.english}</span>
                    </div>
                </div>
             `;
             lastAnswerEl.classList.remove('hidden');
        } else {
             lastAnswerEl.classList.add('hidden');
        }

        screens.over.classList.remove('hidden');

        // celebration (visual only)
        countUp(ui.finalScore, score);
        if (score > 0) {
            setTimeout(() => {
                confettiBurst(window.innerWidth / 2, window.innerHeight * 0.3, 70, Math.min(420, window.innerWidth * 0.45));
            }, 250);
        }
    }
