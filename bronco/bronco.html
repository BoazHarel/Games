    // Background scrolling variables
    let bgScrollX = 0;
    let fgScrollX = 0;

    // --- Setup & Resizing ---
    function resize() {
        cw = gameContainer.clientWidth;
        ch = gameContainer.clientHeight;
        bgCanvas.width = Math.round(cw * DPR);
        bgCanvas.height = Math.round(ch * DPR);
        fxCanvas.width = Math.round(cw * DPR);
        fxCanvas.height = Math.round(ch * DPR);
        buildScenery();
        drawBackgroundStatic(); // Initial draw
    }

    window.addEventListener('resize', resize);

    /* ---------- Rendering state (presentation only) ---------- */
    const DPR = Math.min(window.devicePixelRatio || 1, 1.5);
    const LAYER_DPR = Math.min(window.devicePixelRatio || 1, 1.25);
    const fxCanvas = document.getElementById('fx-canvas');
    const fxCtx = fxCanvas.getContext('2d');
    const layerEls = {
        far: document.getElementById('layer-far'),
        mid: document.getElementById('layer-mid'),
        near: document.getElementById('layer-near')
    };
    const PARALLAX = { far: 0.45, mid: 1.0, near: 2.1 }; // multiples of bgScrollX
    let TILE_W = 1200;
    let dirtGradient = null;
    const vis = { px: 0, py: 0, angle: 0, prevJumping: false, offset: 0 };
    let terrainXs = new Float32Array(0), terrainYs = new Float32Array(0);
    const GEM_COLORS = [['#5FD3FF', '#2A8FD0'], ['#FF6FB5', '#C93A82'], ['#8BF07A', '#3FA548'], ['#C99BFF', '#7D4FD1']];
    const FLOWER_COLORS = ['#FFFFFF', '#FFD23F', '#FF7FB0', '#B98CFF'];

    resize();

    // --- STREAMING_CHUNK:Canvas Drawing Setup... ---
    function drawBackgroundStatic() {
        if (currentState !== GAME_STATE.PLAYING) {
            drawBackgroundLayers();
            // Snap Bronco to initial terrain on load
            const broncoScreenX = cw * 0.2;
            const startY = getTerrainY(broncoScreenX);
            bronco.y = startY;
            renderBronco(broncoScreenX, true);
        }
    }

    /* ---------- Scenery: pre-rendered parallax hill tiles ---------- */
    function hash(n) {
        const s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return s - Math.floor(s);
    }

    function buildScenery() {
        TILE_W = Math.ceil(Math.max(cw, 900) / 100) * 100;
        const T = TILE_W;
        const TAU = Math.PI * 2;
        const peak = (x, k, ph) => 1 - Math.abs(Math.sin(Math.PI * k * x / T + ph));

        // Each layer: [top y, painter]
        const layers = {
            far: {
                top: ch * 0.24,
                paint(ctx) {
                    const base = ch * 0.56;
                    const h = (x) => ch * (0.16 * Math.pow(peak(x, 3, 0.4), 1.6) + 0.085 * Math.pow(peak(x, 7, 1.3), 1.3) + 0.012 * Math.sin(TAU * 13 * x / T));
                    const shape = (dx) => {
                        ctx.beginPath();
                        ctx.moveTo(0, ch);
                        for (let x = 0; x <= 2 * T; x += 6) ctx.lineTo(x, base - h(x + dx));
                        ctx.lineTo(2 * T, ch);
                        ctx.closePath();
                    };
                    // shadowed faces
                    const g = ctx.createLinearGradient(0, ch * 0.3, 0, base);
                    g.addColorStop(0, '#7D8FC9');
                    g.addColorStop(1, '#9EB3E2');
                    shape(0);
                    ctx.fillStyle = g;
                    ctx.fill();
                    // lit faces + snow
                    ctx.save();
                    shape(0);
                    ctx.clip();
                    const g2 = ctx.createLinearGradient(0, ch * 0.3, 0, base);
                    g2.addColorStop(0, '#A3B5EA');
                    g2.addColorStop(1, '#BCD0F2');
                    shape(22);
                    ctx.fillStyle = g2;
                    ctx.fill();
                    // snow caps
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    for (let x = 0; x <= 2 * T; x += 6) {
                        const zig = Math.sin(TAU * 31 * x / T) * ch * 0.006 + Math.sin(TAU * 9 * x / T) * ch * 0.006;
                        ctx.lineTo(x, base - ch * 0.155 + zig);
                    }
                    ctx.lineTo(2 * T, 0);
                    ctx.closePath();
                    ctx.fillStyle = '#CBD8F3';
                    ctx.fill();
                    ctx.restore();
                    ctx.save();
                    shape(22);
                    ctx.clip();
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    for (let x = 0; x <= 2 * T; x += 6) {
                        const zig = Math.sin(TAU * 31 * x / T) * ch * 0.006 + Math.sin(TAU * 9 * x / T) * ch * 0.006;
                        ctx.lineTo(x, base - ch * 0.155 + zig);
                    }
                    ctx.lineTo(2 * T, 0);
                    ctx.closePath();
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fill();
                    ctx.restore();
                    // valley mist
                    const m = ctx.createLinearGradient(0, base - ch * 0.08, 0, base + ch * 0.04);
                    m.addColorStop(0, 'rgba(255,246,228,0)');
                    m.addColorStop(1, 'rgba(255,246,228,0.75)');
                    ctx.fillStyle = m;
                    ctx.fillRect(0, base - ch * 0.08, 2 * T, ch);
                }
            },
            mid: {
                top: ch * 0.4,
                paint(ctx) {
                    const base = ch * 0.6;
                    const y = (x) => base - ch * (0.045 * Math.sin(TAU * 2 * x / T + 1) + 0.03 * Math.sin(TAU * 5 * x / T + 2) + 0.012 * Math.sin(TAU * 11 * x / T) + 0.03);
                    const g = ctx.createLinearGradient(0, ch * 0.5, 0, ch * 0.75);
                    g.addColorStop(0, '#8ACB7A');
                    g.addColorStop(1, '#A9D79A');
                    ctx.beginPath();
                    ctx.moveTo(0, ch);
                    for (let x = 0; x <= 2 * T; x += 8) ctx.lineTo(x, y(x));
                    ctx.lineTo(2 * T, ch);
                    ctx.closePath();
                    ctx.fillStyle = g;
                    ctx.fill();
                    // hazy pine forest
                    const count = Math.round(T / 34);
                    for (let i = 0; i < count; i++) {
                        const r = hash(i + 7);
                        if (r < 0.35) continue;
                        const tx = (i + hash(i + 50) * 0.8) * (T / count);
                        const s = ch * (0.035 + hash(i + 90) * 0.035);
                        for (const ox of [0, T]) {
                            if (tx + ox > 2 * T + 40) continue;
                            drawPine(ctx, tx + ox, y(tx) + s * 0.15, s, hash(i + 3) > 0.5 ? '#5FA36A' : '#6BAE6E', '#4F8F5E');
                        }
                    }
                    const m = ctx.createLinearGradient(0, base - ch * 0.02, 0, ch * 0.75);
                    m.addColorStop(0, 'rgba(255,246,228,0)');
                    m.addColorStop(1, 'rgba(255,246,228,0.45)');
                    ctx.fillStyle = m;
                    ctx.fillRect(0, base - ch * 0.02, 2 * T, ch);
                }
            },
            near: {
                top: ch * 0.5,
                paint(ctx) {
                    const base = ch * 0.68;
                    const y = (x) => base - ch * (0.05 * Math.sin(TAU * 3 * x / T + 0.5) + 0.025 * Math.sin(TAU * 7 * x / T + 2.2) + 0.03);
                    const g = ctx.createLinearGradient(0, ch * 0.58, 0, ch);
                    g.addColorStop(0, '#5DB955');
                    g.addColorStop(1, '#3E9A48');
                    ctx.beginPath();
                    ctx.moveTo(0, ch);
                    for (let x = 0; x <= 2 * T; x += 8) ctx.lineTo(x, y(x));
                    ctx.lineTo(2 * T, ch);
                    ctx.closePath();
                    ctx.fillStyle = g;
                    ctx.fill();
                    // soft top highlight
                    ctx.beginPath();
                    for (let x = 0; x <= 2 * T; x += 8) x === 0 ? ctx.moveTo(x, y(x) + 3) : ctx.lineTo(x, y(x) + 3);
                    ctx.strokeStyle = 'rgba(190,240,140,0.55)';
                    ctx.lineWidth = 4;
                    ctx.stroke();
                    // barn, trees, bushes, fences
                    for (const ox of [0, T]) {
                        const bx = T * 0.37 + ox;
                        drawBarn(ctx, bx, y(T * 0.37) + 4, ch * 0.07);
                    }
                    const count = Math.round(T / 70);
                    for (let i = 0; i < count; i++) {
                        const tx = (i + hash(i + 200)) * (T / count);
                        if (Math.abs(tx - T * 0.37) < ch * 0.12) continue;
                        const r = hash(i + 300);
                        const s = ch * (0.04 + hash(i + 400) * 0.03);
                        for (const ox of [0, T]) {
                            const X = tx + ox;
                            if (r < 0.3) drawRoundTree(ctx, X, y(tx) + 4, s);
                            else if (r < 0.62) drawPine(ctx, X, y(tx) + s * 0.1, s * 1.15, '#3C8E4A', '#2F7A40');
                            else if (r < 0.85) drawBush(ctx, X, y(tx) + 3, s * 0.45);
                            else drawFence(ctx, X, y, s * 0.4);
                        }
                    }
                }
            }
        };

        for (const key of ['far', 'mid', 'near']) {
            const L = layers[key];
            const el = layerEls[key];
            const hgt = Math.max(1, ch - L.top);
            el.width = Math.round(2 * T * LAYER_DPR);
            el.height = Math.round(hgt * LAYER_DPR);
            el.style.width = (2 * T) + 'px';
            el.style.height = hgt + 'px';
            el.style.top = L.top + 'px';
            const ctx = el.getContext('2d');
            ctx.setTransform(LAYER_DPR, 0, 0, LAYER_DPR, 0, -L.top * LAYER_DPR);
            ctx.clearRect(0, 0, 2 * T, ch);
            L.paint(ctx);
        }

        // Dirt gradient for the playable ground (screen space)
        dirtGradient = bgCtx.createLinearGradient(0, ch * 0.4, 0, ch);
        dirtGradient.addColorStop(0, '#D49455');
        dirtGradient.addColorStop(0.35, '#B5713A');
        dirtGradient.addColorStop(1, '#7A4220');

        // Ambient far clouds (pure decoration, behind hills)
        const fc = document.getElementById('far-clouds');
        if (!fc.childElementCount) {
            const specs = [[8, 0.9, 95, -20], [17, 0.6, 130, -75], [4, 0.5, 160, -120], [24, 0.75, 110, -45]];
            for (const [top, s, dur, delay] of specs) {
                const d = document.createElement('div');
                d.className = 'far-cloud';
                d.innerHTML = SVG_CLOUD;
                d.style.top = top + '%';
                d.style.setProperty('--s', s);
                d.style.animationDuration = dur + 's';
                d.style.animationDelay = delay + 's';
                fc.appendChild(d);
            }
        }
    }

    function drawPine(ctx, x, y, s, light, dark) {
        ctx.fillStyle = '#6B4A35';
        ctx.fillRect(x - s * 0.07, y - s * 0.3, s * 0.14, s * 0.32);
        for (let k = 0; k < 3; k++) {
            const w = s * (0.42 - k * 0.09), top = y - s * (0.75 + k * 0.38), bot = y - s * (0.2 + k * 0.36);
            ctx.fillStyle = dark;
            ctx.beginPath();
            ctx.moveTo(x, top);
            ctx.lineTo(x + w, bot);
            ctx.lineTo(x - w, bot);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = light;
            ctx.beginPath();
            ctx.moveTo(x, top);
            ctx.lineTo(x, bot);
            ctx.lineTo(x - w, bot);
            ctx.closePath();
            ctx.fill();
        }
    }

    function drawRoundTree(ctx, x, y, s) {
        ctx.fillStyle = '#6B4A35';
        ctx.fillRect(x - s * 0.08, y - s * 0.6, s * 0.16, s * 0.62);
        ctx.fillStyle = '#2F8A3E';
        ctx.beginPath();
        ctx.arc(x - s * 0.22, y - s * 0.7, s * 0.34, 0, Math.PI * 2);
        ctx.arc(x + s * 0.22, y - s * 0.68, s * 0.32, 0, Math.PI * 2);
        ctx.arc(x, y - s * 0.98, s * 0.38, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#4FAE4B';
        ctx.beginPath();
        ctx.arc(x - s * 0.1, y - s * 1.05, s * 0.24, 0, Math.PI * 2);
        ctx.arc(x - s * 0.28, y - s * 0.78, s * 0.18, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#FF6B5A';
        for (let k = 0; k < 3; k++) {
            ctx.beginPath();
            ctx.arc(x + Math.cos(k * 2.1 + 0.4) * s * 0.25, y - s * 0.85 + Math.sin(k * 2.1 + 0.4) * s * 0.18, s * 0.05, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function drawBush(ctx, x, y, s) {
        ctx.fillStyle = '#2F8A3E';
        ctx.beginPath();
        ctx.arc(x - s * 0.6, y - s * 0.4, s * 0.55, 0, Math.PI * 2);
        ctx.arc(x + s * 0.6, y - s * 0.4, s * 0.55, 0, Math.PI * 2);
        ctx.arc(x, y - s * 0.7, s * 0.7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#56B34E';
        ctx.beginPath();
        ctx.arc(x - s * 0.2, y - s * 0.85, s * 0.35, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawFence(ctx, x, yFn, s) {
        ctx.strokeStyle = '#8B5E3C';
        ctx.lineCap = 'round';
        ctx.lineWidth = Math.max(2, s * 0.18);
        const n = 4, gap = s * 1.4;
        ctx.beginPath();
        for (let k = 0; k < n; k++) {
            const px = x + k * gap, py = yFn(px) + 4;
            ctx.moveTo(px, py);
            ctx.lineTo(px, py - s * 1.3);
        }
        for (const hh of [0.5, 1.0]) {
            for (let k = 0; k < n; k++) {
                const px = x + k * gap, py = yFn(px) + 4 - s * hh;
                k === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
            }
        }
        ctx.stroke();
    }

    function drawBarn(ctx, x, y, s) {
        const w = s * 1.5, h = s * 0.95;
        ctx.fillStyle = '#C8473A';
        ctx.fillRect(x - w / 2, y - h, w, h);
        ctx.fillStyle = '#A93A30';
        ctx.fillRect(x + w * 0.1, y - h, w * 0.4, h);
        ctx.fillStyle = '#6A4C3A';
        ctx.beginPath();
        ctx.moveTo(x - w * 0.6, y - h + 2);
        ctx.lineTo(x - w * 0.25, y - h - s * 0.55);
        ctx.lineTo(x + w * 0.25, y - h - s * 0.55);
        ctx.lineTo(x + w * 0.6, y - h + 2);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#F4E7D2';
        ctx.fillRect(x - w * 0.18, y - h * 0.62, w * 0.36, h * 0.62);
        ctx.strokeStyle = '#C8473A';
        ctx.lineWidth = Math.max(1.5, s * 0.05);
        ctx.beginPath();
        ctx.moveTo(x - w * 0.18, y - h * 0.62);
        ctx.lineTo(x + w * 0.18, y);
        ctx.moveTo(x + w * 0.18, y - h * 0.62);
        ctx.lineTo(x - w * 0.18, y);
        ctx.stroke();
        ctx.fillStyle = '#F4E7D2';
        ctx.fillRect(x - w * 0.08, y - h - s * 0.32, w * 0.16, s * 0.2);
        // silo
        ctx.fillStyle = '#D9D2C5';
        ctx.fillRect(x + w * 0.62, y - h * 1.45, s * 0.42, h * 1.45);
        ctx.fillStyle = '#B8B0A2';
        ctx.fillRect(x + w * 0.62 + s * 0.26, y - h * 1.45, s * 0.16, h * 1.45);
        ctx.fillStyle = '#8E9AAB';
        ctx.beginPath();
        ctx.arc(x + w * 0.62 + s * 0.21, y - h * 1.45, s * 0.21, Math.PI, 0);
        ctx.fill();
    }

    function positionLayers() {
        for (const key of ['far', 'mid', 'near']) {
            const off = ((bgScrollX * PARALLAX[key]) % TILE_W + TILE_W) % TILE_W;
            layerEls[key].style.transform = `translate3d(${-off}px,0,0)`;
        }
    }

    function drawBackgroundLayers() {
        positionLayers();

        const ctx = bgCtx;
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        ctx.clearRect(0, 0, cw, ch);

        // Sample the exact gameplay terrain once per frame
        const step = 8;
        const n = Math.ceil((cw + 40) / step) + 1;
        if (terrainXs.length !== n) {
            terrainXs = new Float32Array(n);
            terrainYs = new Float32Array(n);
        }
        for (let i = 0; i < n; i++) {
            const x = -20 + i * step;
            terrainXs[i] = x;
            terrainYs[i] = getTerrainY(x + fgScrollX);
        }
        const xs = terrainXs, ys = terrainYs;
        const strokeAlong = (dy, wobble, width, color) => {
            ctx.beginPath();
            for (let i = 0; i < n; i++) {
                const y = ys[i] + dy + (wobble ? Math.sin((xs[i] + fgScrollX) * 0.012 + dy) * wobble : 0);
                i === 0 ? ctx.moveTo(xs[i], y) : ctx.lineTo(xs[i], y);
            }
            ctx.lineWidth = width;
            ctx.strokeStyle = color;
            ctx.stroke();
        };

        // 1. Dirt body
        ctx.beginPath();
        ctx.moveTo(xs[0], ch + 10);
        for (let i = 0; i < n; i++) ctx.lineTo(xs[i], ys[i]);
        ctx.lineTo(xs[n - 1], ch + 10);
        ctx.closePath();
        ctx.fillStyle = dirtGradient;
        ctx.fill();

        // 2. Soil strata following the hills
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        strokeAlong(58, 6, 26, 'rgba(255,214,160,0.18)');
        strokeAlong(104, 5, 10, 'rgba(96,46,16,0.28)');
        strokeAlong(160, 8, 34, 'rgba(255,214,160,0.10)');
        strokeAlong(230, 6, 12, 'rgba(80,36,12,0.25)');

        // 3. Buried treasures: pebbles, fossils & gems (world-anchored so they never blink)
        const spacing = 70;
        const first = Math.floor((fgScrollX - 60) / spacing) * spacing;
        for (let worldX = first; worldX <= fgScrollX + cw + 60; worldX += spacing) {
            const x = worldX - fgScrollX;
            const r = hash(worldX * 0.013);
            const gy = getTerrainY(worldX);
            if (r < 0.1 && gy + 110 < ch) {
                drawFossil(ctx, x, gy + 78, hash(worldX * 0.7));
            } else if (r < 0.16 && gy + 70 < ch) {
                drawGem(ctx, x, gy + 52 + hash(worldX) * 30, Math.floor(hash(worldX * 3.1) * 4));
            } else if (r < 0.7) {
                const cnt = 1 + Math.floor(hash(worldX * 1.7) * 3);
                for (let k = 0; k < cnt; k++) {
                    const px = x + (hash(worldX + k * 9.1) - 0.5) * 50;
                    const py = gy + 30 + hash(worldX + k * 4.3) * 140;
                    if (py > ch) continue;
                    const pr = 3 + hash(worldX + k) * 6;
                    ctx.fillStyle = 'rgba(92,46,18,0.45)';
                    ctx.beginPath();
                    ctx.ellipse(px, py, pr * 1.4, pr, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255,224,180,0.35)';
                    ctx.beginPath();
                    ctx.ellipse(px - pr * 0.3, py - pr * 0.35, pr * 0.6, pr * 0.35, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        // 4. Grass cap
        strokeAlong(12, 0, 18, 'rgba(70,32,10,0.35)');   // shadow on dirt under the grass
        strokeAlong(3, 0, 22, '#2E8B3E');                // dark grass
        // scalloped grass edge
        ctx.fillStyle = '#2E8B3E';
        ctx.beginPath();
        const sc = 18;
        const firstSc = Math.floor(fgScrollX / sc) * sc;
        for (let wx = firstSc; wx <= fgScrollX + cw + sc; wx += sc) {
            const x = wx - fgScrollX;
            const y = getTerrainY(wx) + 12;
            ctx.moveTo(x + 7, y);
            ctx.arc(x, y, 7, 0, Math.PI);
        }
        ctx.fill();
        strokeAlong(-1, 0, 13, '#5CC64A');               // bright grass
        strokeAlong(-5, 0, 3.5, '#B4F27C');              // sunny rim light

        // 5. Tufts & flowers on the grass
        const tsp = 46;
        const firstT = Math.floor(fgScrollX / tsp) * tsp;
        ctx.lineWidth = 3;
        for (let wx = firstT; wx <= fgScrollX + cw + tsp; wx += tsp) {
            const r = hash(wx * 0.031);
            const x = wx - fgScrollX + (r - 0.5) * 20;
            const y = getTerrainY(wx) - 4;
            if (r > 0.5) {
                ctx.strokeStyle = r > 0.75 ? '#3E9E3A' : '#4DB043';
                ctx.beginPath();
                ctx.moveTo(x - 4, y); ctx.quadraticCurveTo(x - 7, y - 8, x - 10, y - 14);
                ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 1, y - 10, x - 1, y - 19);
                ctx.moveTo(x + 4, y); ctx.quadraticCurveTo(x + 7, y - 8, x + 11, y - 13);
                ctx.stroke();
            } else if (r < 0.28) {
                drawFlower(ctx, x, y, Math.floor(hash(wx * 0.77) * 4));
            }
        }

        // 6. Soft shadow under the Bronco (shrinks as it flies)
        const sx = cw * 0.2 + 100;
        const gC = getTerrainY(sx + fgScrollX);
        const air = Math.max(0, gC - vis.py);
        const k = Math.max(0.3, 1 - air / 260);
        ctx.fillStyle = `rgba(30,20,10,${0.3 * k})`;
        ctx.beginPath();
        ctx.ellipse(sx, gC + 1, 92 * k, 9 * k, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawFossil(ctx, x, y, r) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate((r - 0.5) * 0.8);
        ctx.fillStyle = '#F1DDB8';
        ctx.strokeStyle = 'rgba(80,40,15,0.55)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-14, -3); ctx.lineTo(14, -3); ctx.lineTo(14, 3); ctx.lineTo(-14, 3); ctx.closePath();
        for (const [cx, cy] of [[-15, -4], [-15, 4], [15, -4], [15, 4]]) {
            ctx.moveTo(cx + 5, cy);
            ctx.arc(cx, cy, 5, 0, Math.PI * 2);
        }
        ctx.stroke();
        ctx.fill();
        ctx.restore();
    }

    function drawGem(ctx, x, y, c) {
        const [light, dark] = GEM_COLORS[c];
        ctx.fillStyle = dark;
        ctx.strokeStyle = 'rgba(60,30,10,0.6)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x - 9, y - 3); ctx.lineTo(x - 5, y - 9); ctx.lineTo(x + 5, y - 9); ctx.lineTo(x + 9, y - 3); ctx.lineTo(x, y + 9); ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = light;
        ctx.beginPath();
        ctx.moveTo(x - 9, y - 3); ctx.lineTo(x - 5, y - 9); ctx.lineTo(x, y - 3); ctx.lineTo(x, y + 9); ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.beginPath();
        ctx.arc(x - 4, y - 5, 1.6, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawFlower(ctx, x, y, c) {
        ctx.strokeStyle = '#3E9E3A';
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x, y - 12);
        ctx.stroke();
        ctx.fillStyle = FLOWER_COLORS[c];
        ctx.beginPath();
        for (let p = 0; p < 5; p++) {
            const a = p * 1.2566;
            ctx.moveTo(x + Math.cos(a) * 4 + 3, y - 14 + Math.sin(a) * 4);
            ctx.arc(x + Math.cos(a) * 4, y - 14 + Math.sin(a) * 4, 3, 0, Math.PI * 2);
        }
        ctx.fill();
        ctx.fillStyle = c === 1 ? '#FF8A1F' : '#FFD23F';
        ctx.beginPath();
        ctx.arc(x, y - 14, 2.4, 0, Math.PI * 2);
        ctx.fill();
    }

    // --- STREAMING_CHUNK:Input Handlers... ---
    function handleJump(e) {
        // Prevent default on touch to stop double-firing, BUT only if
        // we are playing so we don't break UI interactions on start screens.
        if (e && e.type === 'touchstart' && currentState === GAME_STATE.PLAYING) {
            e.preventDefault();
        }

        // Don't jump if we are on the start screen picking colors
        if (currentState === GAME_STATE.START) {
            return;
        } else if (currentState === GAME_STATE.GAME_OVER) {
            // Give a small delay before allowing restart via tap to prevent accidental restarts
            if (Date.now() - lastGameOverTime > 1000) {
                resetGame();
                gameOverScreen.classList.add('hidden');
                startScreen.classList.remove('hidden');
                currentState = GAME_STATE.START;
            }
        } else if (currentState === GAME_STATE.PLAYING) {
            if (!bronco.isJumping) {
                bronco.velocityY = bronco.jumpPower;
                bronco.isJumping = true;
                createDirtParticles();

                // Add a little visual squash/stretch effect
                const currentTransform = bronco.element.style.transform;
                bronco.element.style.transform = currentTransform + ' scale(0.9, 1.1)';
            }
        }
    }

    // Listen on the whole container for gross motor skills (kids)
    gameContainer.addEventListener('mousedown', handleJump);
    gameContainer.addEventListener('touchstart', handleJump, {passive: false});

    // UI Buttons (Support both Click and Touch for instant tablet responsiveness)
    const startBtn = document.getElementById('start-btn');
    const startAction = (e) => {
        if (e) {
            e.stopPropagation();
            e.preventDefault();
        }
        startGame();
    };
    startBtn.addEventListener('click', startAction);
    startBtn.addEventListener('touchstart', startAction, {passive: false});

    const restartBtn = document.getElementById('restart-btn');
    const restartAction = (e) => {
        if (e) {
            e.stopPropagation();
            e.preventDefault();
        }
        resetGame();
        gameOverScreen.classList.add('hidden');
        startScreen.classList.remove('hidden');
        currentState = GAME_STATE.START;
    };
    restartBtn.addEventListener('click', restartAction);
    restartBtn.addEventListener('touchstart', restartAction, {passive: false});

    // Customization Swatch Logic (Touch enabled)
    document.querySelectorAll('.color-swatch').forEach(swatch => {
        const selectColor = (e) => {
            if (e) {
                e.stopPropagation();
                e.preventDefault();
            } // Don't trigger a jump
            const color = swatch.getAttribute('data-color');
            const part = swatch.getAttribute('data-part');

            // Update CSS Variable instantly for all SVGs
            document.documentElement.style.setProperty(`--bronco-${part}`, color);

            // Highlight the selected swatch in this row
            swatch.parentElement.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('swatch-selected'));
            swatch.classList.add('swatch-selected');

            fxPaintSplash(color, part);
        };
        swatch.addEventListener('click', selectColor);
        swatch.addEventListener('touchstart', selectColor, {passive: false});
    });

    // Keyboard support
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            if (currentState === GAME_STATE.PLAYING) e.preventDefault(); // Stop page scroll
            handleJump(e);
        }
    });

    // --- STREAMING_CHUNK:Game Controls & Spawners... ---
    let lastGameOverTime = 0;

    function startGame() {
        currentState = GAME_STATE.PLAYING;
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');

        // Start wheel animations
        bronco.frontWheel.classList.add('wheel-spin');
        bronco.backWheel.classList.add('wheel-spin');
        bronco.element.classList.add('driving');

        score = 0;
        speedMultiplier = 1;
        speedDisplay.innerText = '1'; // keep the HUD in sync with the reset speed
        updateScoreDisplay();

        fxStart();

        lastTime = performance.now();
        gameLoop(performance.now());
    }

    function resetGame() {
        // Clear objects
        obstacles.forEach(obs => obs.el.remove());
        collectibles.forEach(col => col.el.remove());
        clouds.forEach(c => c.el.remove());
        obstacles = [];
        collectibles = [];
        clouds = [];

        // Reset variables
        bronco.velocityY = 0;
        bronco.isJumping = false;
        bronco.angle = 0;

        bgScrollX = 0;
        fgScrollX = 0;
        drawBackgroundLayers();

        fxReset();
    }

    function gameOver() {
        currentState = GAME_STATE.GAME_OVER;
        lastGameOverTime = Date.now();
        gameOverScreen.classList.remove('hidden');
        finalScoreDisplay.innerText = score;

        // Stop animations
        bronco.frontWheel.classList.remove('wheel-spin');
        bronco.backWheel.classList.remove('wheel-spin');

        cancelAnimationFrame(animationFrameId);

        fxScoreCountUp(score);
    }

    function spawnSkyObjects() {
        // Normal Clouds
        if (Math.random() < 0.01) {
            const el = document.createElement('div');
            el.className = 'cloud';
            el.innerHTML = SVG_CLOUD;

            const scale = 0.5 + Math.random() * 1;
            const startY = Math.random() * (ch * 0.3); // Top 30% of screen
            const startX = cw + 100;

            el.style.transform = `translate(${startX}px, ${startY}px) scale(${scale})`;

            objectsContainer.appendChild(el);
            clouds.push({el, x: startX, y: startY, speed: (Math.random() * 0.5 + 0.2), scale: scale, type: 'cloud'});
        }

        // Bugs (Bees and Butterflies)
        if (Math.random() < 0.002) { // Rare spawn (approx once every 8 seconds)
            const el = document.createElement('div');
            el.className = 'cloud';
            el.style.zIndex = '2'; // Just above clouds, below bronco
            const isBee = Math.random() > 0.5;
            el.innerHTML = isBee ? SVG_BEE : SVG_BUTTERFLY;

            // Larger scale bug requested:
            const scale = 0.2 + Math.random() * 0.2;

            // Keep them only in the top 40% of the screen (the sky area)
            const startY = Math.random() * (ch * 0.4);
            const startX = cw + 100;

            el.style.transform = `translate(${startX}px, ${startY}px) scale(${scale})`;

            objectsContainer.appendChild(el);
            const speed = isBee ? (1.5 + Math.random()) : (1 + Math.random());
            clouds.push({
                el,
                x: startX,
                y: startY,
                speed: speed,
                scale: scale,
                type: 'bug',
                floatOffset: Math.random() * 10
            });
        }
    }

    let framesSinceLastObstacle = 0;
    function spawnGroundObject() {
        framesSinceLastObstacle++;

        // Make spawning dependent on speed, ensuring minimum distance
        let spawnThreshold = Math.max(60, 150 - (speedMultiplier * 20));

        if (framesSinceLastObstacle > spawnThreshold && Math.random() < 0.05) {
            framesSinceLastObstacle = 0;

            const isObstacle = Math.random() > 0.4;

            const el = document.createElement('div');
            el.style.position = 'absolute';
            el.style.top = '0';
            el.style.left = '0';

            const worldX = cw + 50 + fgScrollX; // Anchor to the scrolling world coordinate

            if (isObstacle) {
                el.className = 'obstacle';
                const isRock = Math.random() > 0.5;
                if (isRock) {
                    el.innerHTML = SVG_ROCK;
                    el.style.width = '60px';
                    el.style.height = '40px';
                    el.style.zIndex = '5'; // Rocks draw standard
                } else {
                    el.innerHTML = SVG_PUDDLE;
                    el.style.width = '100px';
                    el.style.height = '40px';
                    el.style.zIndex = '4'; // Puddles draw slightly behind rocks
                }
                objectsContainer.appendChild(el);
                obstacles.push({
                    el,
                    worldX: worldX,
                    width: isRock ? 60 : 100,
                    height: 40,
                    type: isRock ? 'rock' : 'puddle'
                });
            } else {
                el.className = 'collectible';
                el.innerHTML = SVG_STAR;
                el.style.width = '50px';
                el.style.height = '50px';
                el.style.zIndex = '15'; // **STARS ARE ALWAYS IN FRONT**
                objectsContainer.appendChild(el);

                // Stars float slightly above the terrain
                const hoverOffset = 30 + Math.random() * 150;
                collectibles.push({el, worldX: worldX, width: 50, height: 50, hoverOffset: hoverOffset});
            }
        }
    }

    // --- STREAMING_CHUNK:Visuals & Collisions... ---
    function createDirtParticles() {
        // Only spawn dirt if we are mostly touching the ground
        if (bronco.isJumping && bronco.y < getTerrainY(cw * 0.2 + fgScrollX) - 20) return;

        const speed = gameSpeed * speedMultiplier * 60;
        for (let i = 0; i < 5; i++) {
            const wheelX = Math.random() < 0.7 ? 52 : 152;
            const [x, y] = carPoint(wheelX - 14 + Math.random() * 8, 116);
            const big = Math.random() < 0.6;
            spawnParticle({
                kind: big ? 'dust' : 'pebble',
                x, y,
                vx: -speed * (0.45 + Math.random() * 0.5),
                vy: -(40 + Math.random() * (big ? 90 : 220)),
                g: big ? 60 : 900,
                size: big ? 5 + Math.random() * 8 : 2 + Math.random() * 3,
                grow: big ? 18 : 0,
                life: big ? 0.55 + Math.random() * 0.35 : 0.5,
                color: big ? (Math.random() < 0.5 ? '#D9B07A' : '#C79A66') : '#7A4A26'
            });
        }
    }

    function updatePhysics() {
        const broncoScreenX = cw * 0.2; // Fixed horizontal position on screen
        const broncoWorldX = broncoScreenX + fgScrollX; // Exact position in the scrolling world

        // 1. Get the terrain height at the Bronco's exact location
        const groundY = getTerrainY(broncoWorldX);

        // 2. Calculate the slope to tilt the car (sampled under the car's middle so the body hugs the hill)
        const nextY = getTerrainY(broncoWorldX + 100 + 40); // Look slightly ahead
        const prevY = getTerrainY(broncoWorldX + 100 - 40); // Look slightly behind
        const targetAngleRad = Math.atan2(nextY - prevY, 80);
        let targetAngleDeg = targetAngleRad * (180 / Math.PI);

        // Limit the maximum tilt so it doesn't flip entirely
        targetAngleDeg = Math.max(-45, Math.min(45, targetAngleDeg));

        // 3. Handle Vertical Movement (Jumping/Falling)
        if (bronco.isJumping) {
            bronco.y += bronco.velocityY;
            bronco.velocityY += bronco.gravity;

            // Slowly pitch forward while in the air for a natural trajectory
            targetAngleDeg += (bronco.velocityY * 1.5);

            // Hit ground check
            if (bronco.y >= groundY) {
                bronco.y = groundY;
                bronco.isJumping = false;
                bronco.velocityY = 0;
                createDirtParticles(); // Dust on landing
            }
        } else {
            // Stick firmly to the ground
            bronco.y = groundY;
            bronco.velocityY = 0;

            // Generate dirt while driving up/down hills
            if (Math.random() < 0.2) createDirtParticles();
        }

        // 4. Smooth Rotation Interpolation
        bronco.angle += (targetAngleDeg - bronco.angle) * 0.15;

        // 5. Apply Position and Rotation to DOM Element
        renderBronco(broncoScreenX);
    }

    function checkCollisions() {
        const broncoScreenX = cw * 0.2;
        const broncoCenterX = broncoScreenX + 100;
        const broncoCenterY = bronco.y - 40; // Center mass

        // Check Obstacles
        for (let i = 0; i < obstacles.length; i++) {
            const obs = obstacles[i];
            const obsCenterX = obs.screenX + obs.width / 2;
            const obsCenterY = obs.screenY + obs.height / 2;

            const dist = Math.hypot(broncoCenterX - obsCenterX, broncoCenterY - obsCenterY);

            if (dist < 50) { // Generous collision radius for kids
                fxCrash(obs);
                gameOver();
                return; // Stop checking
            }
        }

        // Check Collectibles (Stars)
        for (let i = collectibles.length - 1; i >= 0; i--) {
            const star = collectibles[i];
            const starCenterX = star.screenX + star.width / 2;
            const starCenterY = star.screenY + star.height / 2;

            const dist = Math.hypot(broncoCenterX - starCenterX, broncoCenterY - starCenterY);

            if (dist < 80) { // Large magnet radius for stars
                score++;
                updateScoreDisplay();

                // Visual pop effect
                star.el.style.transition = 'transform 0.2s, opacity 0.2s';
                star.el.style.transform = `translate(${star.screenX}px, ${star.screenY}px) scale(2)`;
                star.el.style.opacity = '0';
                fxStarCollect(starCenterX, starCenterY);

                const elementToRemove = star.el;
                setTimeout(() => {
                    elementToRemove.remove();
                }, 200);

                collectibles.splice(i, 1);

                // Increase speed slightly every 5 stars
                if (score % 5 === 0) {
                    speedMultiplier += 0.1;
                    speedDisplay.innerText = speedMultiplier.toFixed(1);
                    speedDisplay.parentElement.style.color = '#FFD700';
                    setTimeout(() => {
                        speedDisplay.parentElement.style.color = '#FFF';
                    }, 500);
                }
            }
        }
    }

    function updateScoreDisplay() {
        scoreDisplay.innerText = score;
        scoreDisplay.style.transform = 'scale(1.5)';
        setTimeout(() => {
            scoreDisplay.style.transform = 'scale(1)';
        }, 100);
    }

    // --- STREAMING_CHUNK:Game Loop... ---
    function gameLoop(timestamp) {
        if (currentState !== GAME_STATE.PLAYING) return;

        const deltaTime = timestamp - lastTime;
        lastTime = timestamp;

        const currentSpeed = gameSpeed * speedMultiplier;

        // Update Scroll
        bgScrollX += currentSpeed * 0.2;
        fgScrollX += currentSpeed;

        drawBackgroundLayers();
        updatePhysics();

        spawnSkyObjects();
        spawnGroundObject();

        // Update Clouds & Bugs
        for (let i = clouds.length - 1; i >= 0; i--) {
            clouds[i].x -= clouds[i].speed;

            // Add bobbing animation for bugs
            let currentY = clouds[i].y;
            if (clouds[i].type === 'bug') {
                currentY += Math.sin(timestamp * 0.005 + clouds[i].floatOffset) * 10;
            }

            clouds[i].el.style.transform = `translate(${clouds[i].x}px, ${currentY}px) scale(${clouds[i].scale})`;

            if (clouds[i].x < -150) {
                clouds[i].el.remove();
                clouds.splice(i, 1);
            }
        }

        // Update Obstacles
        for (let i = obstacles.length - 1; i >= 0; i--) {
            obstacles[i].screenX = obstacles[i].worldX - fgScrollX;
            obstacles[i].screenY = getTerrainY(obstacles[i].worldX) - obstacles[i].height;

            // SINK THE MUD: Offset puddle placement so it looks embedded in the dirt rather than resting on the grass
            if (obstacles[i].type === 'puddle') {
                obstacles[i].screenY += 15;
            }

            // Visual only: lean the sprite with the hill it sits on
            const tilt = Math.atan2(getTerrainY(obstacles[i].worldX + obstacles[i].width) - getTerrainY(obstacles[i].worldX), obstacles[i].width) * 57.3 * 0.8;
            obstacles[i].el.style.transform = `translate(${obstacles[i].screenX}px, ${obstacles[i].screenY}px) rotate(${tilt}deg)`;

            if (obstacles[i].screenX < -100) {
                obstacles[i].el.remove();
                obstacles.splice(i, 1);
            }
        }

        // Update Collectibles
        for (let i = collectibles.length - 1; i >= 0; i--) {
            collectibles[i].screenX = collectibles[i].worldX - fgScrollX;
            collectibles[i].screenY = getTerrainY(collectibles[i].worldX) - collectibles[i].height - collectibles[i].hoverOffset;

            // Visual only: a happy wobble + bob so the star's face stays upright
            const ph = collectibles[i].hoverOffset;
            const wob = Math.sin(timestamp * 0.006 + ph) * 14;
            const bob = Math.sin(timestamp * 0.004 + ph) * 4;
            const pulse = 1 + Math.sin(timestamp * 0.008 + ph) * 0.06;
            collectibles[i].el.style.transform = `translate(${collectibles[i].screenX}px, ${collectibles[i].screenY + bob}px) rotate(${wob}deg) scale(${pulse})`;

            if (collectibles[i].screenX < -100) {
                collectibles[i].el.remove();
                collectibles.splice(i, 1);
            }
        }

        checkCollisions();

        if (currentState === GAME_STATE.PLAYING) {
            animationFrameId = requestAnimationFrame(gameLoop);
        }
    }

    /* =====================================================================
       PRESENTATION: Bronco rendering & juice (no gameplay effect)
       ===================================================================== */
    const broncoInner = document.getElementById('bronco-inner');
    let wheelDur = '';

    // Place the car so its middle sits on the hill under it (the physics point is the car's back edge).
    function renderBronco(broncoScreenX, quiet) {
        const wx = broncoScreenX + fgScrollX;
        vis.offset = getTerrainY(wx + 100) - getTerrainY(wx);
        const y = bronco.y + vis.offset;
        vis.px = broncoScreenX + 100;
        vis.py = y;
        vis.angle = bronco.angle * Math.PI / 180;
        bronco.element.style.transform = `translate3d(${broncoScreenX}px, ${y - bronco.height}px, 0) rotate(${bronco.angle}deg)`;

        if (!quiet) {
            if (bronco.isJumping && !vis.prevJumping) squash('jump');
            if (!bronco.isJumping && vis.prevJumping) squash('land');
            const d = (0.46 / speedMultiplier).toFixed(3) + 's';
            if (d !== wheelDur) {
                wheelDur = d;
                bronco.frontWheel.style.animationDuration = d;
                bronco.backWheel.style.animationDuration = d;
            }
        }
        vis.prevJumping = bronco.isJumping;
    }

    function squash(kind) {
        if (!broncoInner.animate) return;
        if (kind === 'jump') {
            broncoInner.animate([
                {transform: 'scale(1.08, 0.88)'},
                {transform: 'scale(0.92, 1.12)', offset: 0.35},
                {transform: 'scale(1, 1)'}
            ], {duration: 380, easing: 'ease-out'});
        } else {
            broncoInner.animate([
                {transform: 'scale(1.14, 0.84)'},
                {transform: 'scale(0.96, 1.05)', offset: 0.5},
                {transform: 'scale(1, 1)'}
            ], {duration: 320, easing: 'ease-out'});
        }
    }

    // Convert a point in the car's 200x120 box into screen space (accounts for rotation about the bottom-center)
    function carPoint(lx, ly) {
        const dx = lx - 100, dy = ly - 120;
        const c = Math.cos(vis.angle), s = Math.sin(vis.angle);
        return [vis.px + dx * c - dy * s, vis.py + dx * s + dy * c];
    }

    /* ---------- Particles ---------- */
    const particles = [];
    const MAX_PARTICLES = 320;
    function spawnParticle(p) {
        if (particles.length >= MAX_PARTICLES) particles.shift();
        p.age = 0;
        p.rot = p.rot || 0;
        p.vr = p.vr || 0;
        particles.push(p);
    }

    function drawSparkle(ctx, r) {
        ctx.beginPath();
        ctx.moveTo(0, -r);
        ctx.quadraticCurveTo(0, 0, r, 0);
        ctx.quadraticCurveTo(0, 0, 0, r);
        ctx.quadraticCurveTo(0, 0, -r, 0);
        ctx.quadraticCurveTo(0, 0, 0, -r);
        ctx.fill();
    }

    function drawStarShape(ctx, r) {
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
            const rr = i % 2 ? r * 0.45 : r;
            const a = -Math.PI / 2 + i * Math.PI / 5;
            i ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
        }
        ctx.closePath();
    }

    function drawBurst(ctx, r, text, fill) {
        ctx.beginPath();
        const spikes = 12;
        for (let i = 0; i < spikes * 2; i++) {
            const rr = i % 2 ? r * 0.62 : r * (0.95 + (i % 4 === 0 ? 0.12 : 0));
            const a = i * Math.PI / spikes;
            i ? ctx.lineTo(Math.cos(a) * rr * 1.3, Math.sin(a) * rr) : ctx.moveTo(Math.cos(a) * rr * 1.3, Math.sin(a) * rr);
        }
        ctx.closePath();
        ctx.fillStyle = fill;
        ctx.strokeStyle = INK;
        ctx.lineWidth = 5;
        ctx.lineJoin = 'round';
        ctx.fill();
        ctx.stroke();
        ctx.font = `${Math.round(r * 0.62)}px 'Lilita One', 'Arial Black', sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineWidth = 6;
        ctx.strokeText(text, 0, 2);
        ctx.fillStyle = '#FFF';
        ctx.fillText(text, 0, 2);
    }

    let fxDirty = false;
    let fxLast = performance.now();
    let exhaustTimer = 0;
    let shownSpeed = 1;

    function fxLoop(now) {
        const dt = Math.min(0.05, (now - fxLast) / 1000);
        fxLast = now;

        if (currentState === GAME_STATE.PLAYING) {
            // Exhaust puffs from the tailpipe
            exhaustTimer -= dt;
            if (exhaustTimer <= 0) {
                exhaustTimer = 0.09 + Math.random() * 0.06;
                const [x, y] = carPoint(4, 97);
                spawnParticle({
                    kind: 'puff', x, y,
                    vx: -90 - Math.random() * 60, vy: -20 - Math.random() * 25, g: -30,
                    size: 3 + Math.random() * 3, grow: 22, life: 0.6, color: '#F2F2F2'
                });
            }
            // "Faster!" banner whenever the speed steps up
            if (speedMultiplier > shownSpeed + 0.05) {
                shownSpeed = speedMultiplier;
                showToast('Faster!');
            }
        }
        if (speedMultiplier < shownSpeed) shownSpeed = speedMultiplier;

        const ctx = fxCtx;
        if (particles.length || fxDirty) {
            ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
            ctx.clearRect(0, 0, cw, ch);
            fxDirty = particles.length > 0;
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.age += dt;
            if (p.age >= p.life) { particles.splice(i, 1); continue; }
            p.vy += (p.g || 0) * dt;
            if (p.drag) { p.vx *= (1 - p.drag * dt); p.vy *= (1 - p.drag * dt); }
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.rot += p.vr * dt;
            const t = p.age / p.life;
            const size = p.size + (p.grow || 0) * p.age;

            ctx.save();
            ctx.translate(p.x, p.y);
            switch (p.kind) {
                case 'dust':
                case 'puff':
                    ctx.globalAlpha = (p.kind === 'puff' ? 0.55 : 0.75) * (1 - t);
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(0, 0, size, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'pebble':
                case 'drop':
                    ctx.globalAlpha = 1 - t * t;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(0, 0, size, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'sparkle':
                    ctx.globalAlpha = 1 - t;
                    ctx.rotate(p.rot);
                    ctx.fillStyle = p.color;
                    drawSparkle(ctx, size * (1 - t * 0.5));
                    break;
                case 'star':
                    ctx.globalAlpha = 1 - t * t;
                    ctx.rotate(p.rot);
                    drawStarShape(ctx, size);
                    ctx.fillStyle = '#FFD43B';
                    ctx.strokeStyle = INK;
                    ctx.lineWidth = 2;
                    ctx.lineJoin = 'round';
                    ctx.fill();
                    ctx.stroke();
                    break;
                case 'ring':
                    ctx.globalAlpha = 1 - t;
                    ctx.strokeStyle = p.color;
                    ctx.lineWidth = 6 * (1 - t) + 1;
                    ctx.beginPath();
                    ctx.arc(0, 0, p.size + 70 * Math.sqrt(t), 0, Math.PI * 2);
                    ctx.stroke();
                    break;
                case 'text': {
                    ctx.globalAlpha = t < 0.7 ? 1 : 1 - (t - 0.7) / 0.3;
                    const sc = t < 0.15 ? 0.5 + t / 0.15 * 0.7 : 1.2 - Math.min(0.2, (t - 0.15));
                    ctx.scale(sc, sc);
                    ctx.font = `${p.size}px 'Lilita One', 'Arial Black', sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.lineJoin = 'round';
                    ctx.lineWidth = 6;
                    ctx.strokeStyle = INK;
                    ctx.strokeText(p.text, 0, 0);
                    ctx.fillStyle = p.color;
                    ctx.fillText(p.text, 0, 0);
                    break;
                }
                case 'burst': {
                    const pop = t < 0.18 ? 0.3 + (t / 0.18) * 0.9 : (t < 0.3 ? 1.2 - (t - 0.18) / 0.12 * 0.2 : 1);
                    ctx.globalAlpha = t < 0.75 ? 1 : 1 - (t - 0.75) / 0.25;
                    ctx.rotate(-0.12);
                    ctx.scale(pop, pop);
                    drawBurst(ctx, p.size, p.text, p.color);
                    break;
                }
            }
            ctx.restore();
        }

        requestAnimationFrame(fxLoop);
    }

    function fxStarCollect(x, y) {
        spawnParticle({kind: 'ring', x, y, vx: 0, vy: 0, size: 12, life: 0.45, color: '#FFE066'});
        for (let i = 0; i < 12; i++) {
            const a = (i / 12) * Math.PI * 2 + Math.random() * 0.3;
            const sp = 180 + Math.random() * 200;
            spawnParticle({
                kind: i % 3 === 0 ? 'star' : 'sparkle',
                x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 300, drag: 2.5,
                size: i % 3 === 0 ? 7 : 6 + Math.random() * 5, life: 0.6 + Math.random() * 0.3,
                rot: Math.random() * 6, vr: (Math.random() - 0.5) * 10,
                color: ['#FFF7B0', '#FFD43B', '#FFFFFF'][i % 3]
            });
        }
        spawnParticle({kind: 'text', text: '+1', x, y: y - 20, vx: 0, vy: -90, drag: 1.5, size: 34, life: 0.8, color: '#FFD43B'});
        const pill = document.getElementById('star-pill');
        if (pill.animate) pill.animate([
            {transform: 'scale(1)'}, {transform: 'scale(1.15) rotate(-3deg)'}, {transform: 'scale(1)'}
        ], {duration: 260, easing: 'ease-out'});
    }

    function fxCrash(obs) {
        const isRock = obs.type === 'rock';
        const x = obs.screenX + obs.width / 2;
        const y = obs.screenY + obs.height / 2;
        bronco.element.classList.add('crashed');
        gameContainer.classList.remove('shake');
        void gameContainer.offsetWidth;
        gameContainer.classList.add('shake');
        if (broncoInner.animate) broncoInner.animate([
            {transform: 'rotate(0) scale(1)'},
            {transform: 'rotate(-9deg) scale(1.06, 0.92)', offset: 0.25},
            {transform: 'rotate(4deg)', offset: 0.6},
            {transform: 'rotate(0) scale(1)'}
        ], {duration: 500, easing: 'ease-out'});

        spawnParticle({kind: 'burst', x: x + 10, y: y - 60, vx: 0, vy: -10, size: 46, life: 1.1,
            text: isRock ? 'BONK!' : 'SPLAT!', color: isRock ? '#FF5A4E' : '#B5713A'});
        for (let i = 0; i < 22; i++) {
            const a = -Math.PI * (0.1 + Math.random() * 0.8);
            const sp = 150 + Math.random() * 320;
            spawnParticle({
                kind: isRock ? (i % 2 ? 'pebble' : 'dust') : 'drop',
                x: x + (Math.random() - 0.5) * 30, y,
                vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 900,
                size: isRock ? (i % 2 ? 3 + Math.random() * 4 : 8 + Math.random() * 8) : 3 + Math.random() * 6,
                grow: isRock && !(i % 2) ? 20 : 0,
                life: 0.7 + Math.random() * 0.4,
                color: isRock ? (i % 2 ? '#6E7889' : '#D9C9B0') : (i % 3 ? '#6A3C1E' : '#8A5530')
            });
        }
        for (let i = 0; i < 6; i++) {
            const a = Math.random() * Math.PI * 2;
            spawnParticle({kind: 'star', x: x, y: y - 40, vx: Math.cos(a) * 160, vy: Math.sin(a) * 160 - 80, g: 300, drag: 1.5,
                size: 8, life: 0.9, rot: a, vr: 6});
        }
    }

    let countTimer = null;
    function fxScoreCountUp(target) {
        clearInterval(countTimer);
        if (target <= 0) return;
        let shown = 0;
        finalScoreDisplay.innerText = '0';
        const stepMs = Math.max(30, Math.min(110, 900 / target));
        setTimeout(() => {
            countTimer = setInterval(() => {
                shown++;
                finalScoreDisplay.innerText = shown;
                if (finalScoreDisplay.animate) finalScoreDisplay.animate([{transform: 'scale(1.35)'}, {transform: 'scale(1)'}], {duration: 140});
                if (shown >= target) { clearInterval(countTimer); finalScoreDisplay.innerText = target; }
            }, stepMs);
        }, 650);
    }

    function fxStart() {
        bronco.element.classList.remove('crashed');
        shownSpeed = speedMultiplier;
        for (let i = 0; i < 8; i++) {
            const [x, y] = carPoint(6, 97);
            spawnParticle({kind: 'puff', x, y, vx: -60 - Math.random() * 140, vy: -30 - Math.random() * 60, g: -20,
                size: 5 + Math.random() * 5, grow: 30, life: 0.8, color: '#FFFFFF'});
        }
        const ui = document.getElementById('ui-layer');
        if (ui.animate) ui.animate([{transform: 'translateY(-30px)', opacity: 0}, {transform: 'none', opacity: 1}], {duration: 400, easing: 'cubic-bezier(.2,1.3,.4,1)'});
    }

    function fxReset() {
        clearInterval(countTimer);
        bronco.element.classList.remove('crashed');
        gameContainer.classList.remove('shake');
        particles.length = 0;
        fxDirty = true;
        renderBronco(cw * 0.2, true);
        const preview = document.getElementById('preview-bronco');
        if (preview.animate) preview.animate([{transform: 'translateY(-14%) scale(0.9)'}, {transform: 'none'}], {duration: 450, easing: 'cubic-bezier(.2,1.5,.4,1)'});
    }

    const toastEl = document.getElementById('toast');
    function showToast(text) {
        toastEl.textContent = text;
        toastEl.classList.remove('show');
        void toastEl.offsetWidth;
        toastEl.classList.add('show');
    }

    // Paint splash + hop on the preview car when a color is picked
    function fxPaintSplash(color, part) {
        const stage = document.getElementById('preview-stage');
        const preview = document.getElementById('preview-bronco');
        if (preview.animate) preview.animate([
            {transform: 'translateY(0) scale(1)'},
            {transform: 'translateY(-10%) scale(1.04, 0.96)', offset: 0.35},
            {transform: 'translateY(0) scale(1.06, 0.94)', offset: 0.7},
            {transform: 'translateY(0) scale(1)'}
        ], {duration: 420, easing: 'ease-out'});
        const cx = stage.clientWidth * 0.5;
        const cy = stage.clientHeight * (part === 'roof' ? 0.3 : 0.55);
        for (let i = 0; i < 10; i++) {
            const d = document.createElement('div');
            d.className = 'splat';
            d.style.background = color;
            d.style.left = cx + 'px';
            d.style.top = cy + 'px';
            const a = Math.random() * Math.PI * 2;
            const dist = 60 + Math.random() * stage.clientWidth * 0.35;
            d.style.setProperty('--dx', Math.cos(a) * dist + 'px');
            d.style.setProperty('--dy', Math.sin(a) * dist * 0.6 + 'px');
            const s = 0.6 + Math.random() * 0.9;
            d.style.width = d.style.height = (18 * s) + 'px';
            stage.appendChild(d);
            setTimeout(() => d.remove(), 720);
        }
    }

    // Decorate static UI icons with the star sprite
    document.getElementById('hud-star-icon').innerHTML = SVG_STAR.replace('<circle cx="25" cy="25" r="34" fill="url(#st-glow)"/>', '');
    document.getElementById('final-star').innerHTML = SVG_STAR;

    // Initial draw
    drawBackgroundStatic();
    requestAnimationFrame(fxLoop);

</script>
</body>
