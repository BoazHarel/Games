<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2a6fdb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Sky Wheel Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0b2a6b;
            --navy-deep: #071a47;
            --gold: #ffcf33;
            --gold-deep: #e39a00;
            --ink: #12306f;
            --wheel: min(86vw, 56vh, 620px);
            --font: 'Fredoka', 'Nunito', 'Varela Round', system-ui, -apple-system, 'Segoe UI', sans-serif;
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; margin: 0; }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            font-family: var(--font);
            color: #fff;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
            background:
                radial-gradient(circle at 84% 10%, rgba(255, 250, 215, 1) 0, rgba(255, 236, 160, .85) 3.5%, rgba(255, 214, 120, .35) 11%, rgba(255, 210, 120, 0) 26%),
                linear-gradient(180deg, #1b56c9 0%, #2f7de8 30%, #5aa7f7 55%, #9bd0ff 76%, #d6ecff 90%, #ffe9c9 100%);
            background-attachment: fixed;
        }

        canvas.layer {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #sky { z-index: 0; }
        #fx { z-index: 150; }

        /* ---------- Layout ---------- */
        .game-container {
            position: relative;
            z-index: 2;
            height: 100vh;
            height: 100dvh;
            width: 100%;
            display: grid;
            grid-template-areas: "head" "wheel" "btn";
            grid-template-rows: auto auto auto;
            align-content: center;
            justify-items: center;
            gap: clamp(14px, 3.2vh, 36px);
            padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
        }
        .brand-wrap { grid-area: head; }
        .wheel-wrap { grid-area: wheel; }
        .btn-wrap { grid-area: btn; }

        @media (min-aspect-ratio: 5/4) {
            :root { --wheel: min(84vh, 54vw, 760px); }
            .game-container {
                grid-template-areas: "wheel head" "wheel btn";
                grid-template-columns: auto auto;
                grid-template-rows: auto auto;
                justify-content: center;
                align-content: center;
                column-gap: clamp(24px, 6vw, 90px);
                row-gap: clamp(18px, 5vh, 48px);
            }
            .brand-wrap { align-self: end; }
            .btn-wrap { align-self: start; }
        }

        /* ---------- Brand header ---------- */
        .brand-wrap {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            animation: drop-in .8s cubic-bezier(.2, 1.4, .4, 1) both;
        }
        .brand {
            margin: 0;
            display: flex;
            align-items: center;
            gap: .28em;
            font-weight: 700;
            font-size: clamp(2.6rem, 7vmin, 4.4rem);
            line-height: 1;
            letter-spacing: .02em;
            color: #fff;
            text-shadow:
                0 2px 0 #1b4fb8,
                0 4px 0 #123f9c,
                0 6px 0 var(--navy),
                0 10px 18px rgba(7, 26, 71, .45);
        }
        .brand .al {
            color: var(--gold);
            text-shadow:
                0 2px 0 #f0a400,
                0 4px 0 #c97f00,
                0 6px 0 #8a5200,
                0 10px 18px rgba(7, 26, 71, .45);
        }
        .brand .wing {
            width: .9em;
            height: .5em;
            flex: none;
            filter: drop-shadow(0 3px 0 rgba(11, 42, 107, .55));
        }
        .brand .wing.r { transform: scaleX(-1); }
        .tagline {
            margin: 0;
            padding: .42em 1.2em .38em;
            border-radius: 999px;
            font-weight: 600;
            font-size: clamp(.82rem, 2.2vmin, 1.05rem);
            letter-spacing: .14em;
            text-transform: uppercase;
            color: #fff;
            background: linear-gradient(180deg, rgba(11, 42, 107, .55), rgba(7, 26, 71, .65));
            border: 2px solid rgba(255, 255, 255, .35);
            box-shadow: 0 6px 16px rgba(7, 26, 71, .25), inset 0 1px 0 rgba(255, 255, 255, .25);
            white-space: nowrap;
        }
        .tagline .he { letter-spacing: .04em; }
        .tagline .dot { color: var(--gold); margin: 0 .35em; }

        /* ---------- Wheel ---------- */
        .wheel-wrap {
            position: relative;
            width: var(--wheel);
            height: var(--wheel);
            animation: wheel-in .9s cubic-bezier(.2, 1.3, .4, 1) .1s both;
        }
        .wheel-wrap::before {
            /* rotating sunburst behind the wheel */
            content: "";
            position: absolute;
            inset: -14%;
            border-radius: 50%;
            background: repeating-conic-gradient(from 0deg, rgba(255, 255, 255, .34) 0deg 9deg, rgba(255, 255, 255, 0) 9deg 22.5deg);
            -webkit-mask: radial-gradient(circle, #000 30%, rgba(0, 0, 0, .5) 50%, transparent 70%);
            mask: radial-gradient(circle, #000 30%, rgba(0, 0, 0, .5) 50%, transparent 70%);
            animation: rays 40s linear infinite;
            z-index: -1;
        }
        .wheel-wrap::after {
            /* soft ground shadow */
            content: "";
            position: absolute;
            left: 14%;
            right: 14%;
            bottom: -6%;
            height: 9%;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(7, 26, 71, .35), rgba(7, 26, 71, 0) 70%);
            z-index: -1;
        }
        .wheel-body {
            width: 100%;
            height: 100%;
            will-change: transform;
        }
        .wheel-body.pop { animation: pop .6s cubic-bezier(.3, 1.6, .5, 1); }
        .wheel-body.shake { animation: shake .55s cubic-bezier(.36, .07, .19, .97); }

        #wheel-svg {
            display: block;
            width: 100%;
            height: 100%;
            overflow: visible;
        }
        .emoji {
            font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', 'Segoe UI Symbol', sans-serif;
        }
        .seg-label {
            font-family: var(--font);
            font-weight: 700;
            letter-spacing: .06em;
        }
        .seg-hl {
            fill: #fff;
            opacity: 0;
            transition: opacity .25s ease-out;
            pointer-events: none;
        }
        .seg-hl.lit { opacity: .32; transition: none; }
        .seg-hl.win { animation: win-flash .9s ease-in-out infinite; }

        /* Running lights */
        .led .lit, .led .halo {
            opacity: 0;
            transition: opacity .38s ease-out;
        }
        .led.active .lit, .led.active .halo {
            opacity: 1;
            transition: none;
        }
        .wheel-body.idle .led .lit { animation: twinkle 2.4s ease-in-out infinite; }
        .wheel-body.idle .led:nth-child(3n+1) .lit { animation-delay: -.8s; }
        .wheel-body.idle .led:nth-child(3n+2) .lit { animation-delay: -1.6s; }
        .wheel-body.idle .led.active .lit { animation: none; opacity: 1; }

        /* ---------- Spin button ---------- */
        .btn-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            animation: drop-in .8s cubic-bezier(.2, 1.4, .4, 1) .25s both;
        }
        .spin-btn {
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            gap: .4em;
            font-family: var(--font);
            font-weight: 700;
            font-size: clamp(1.7rem, 5vmin, 2.5rem);
            letter-spacing: .08em;
            text-transform: uppercase;
            color: #6b3a00;
            padding: .5em 1.9em .55em;
            min-height: 72px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(180deg, #fff3a3 0%, #ffd53d 38%, #ffb800 72%, #f39a00 100%);
            text-shadow: 0 2px 0 rgba(255, 255, 255, .6);
            box-shadow:
                inset 0 3px 0 rgba(255, 255, 255, .85),
                inset 0 -5px 0 rgba(186, 96, 0, .35),
                0 0 0 4px rgba(255, 255, 255, .9),
                0 9px 0 4px #b86a00,
                0 18px 30px rgba(7, 26, 71, .4);
            cursor: pointer;
            transform: translateY(0);
            transition: transform .08s, box-shadow .08s, filter .2s;
            animation: breathe 2.2s ease-in-out infinite;
            -webkit-tap-highlight-color: transparent;
        }
        .spin-btn::after {
            content: "";
            position: absolute;
            top: -20%;
            bottom: -20%;
            width: 30%;
            left: -40%;
            background: linear-gradient(100deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, .75), rgba(255, 255, 255, 0));
            transform: skewX(-20deg);
            animation: shine 3.2s ease-in-out infinite;
        }
        .spin-btn .plane-ico {
            width: 1em;
            height: 1em;
            flex: none;
            transform: rotate(45deg);
            filter: drop-shadow(0 2px 0 rgba(255, 255, 255, .55));
        }
        .spin-btn:active:not(:disabled) {
            animation: none;
            transform: translateY(8px);
            box-shadow:
                inset 0 3px 0 rgba(255, 255, 255, .85),
                inset 0 -5px 0 rgba(186, 96, 0, .35),
                0 0 0 4px rgba(255, 255, 255, .9),
                0 1px 0 4px #b86a00,
                0 6px 12px rgba(7, 26, 71, .35);
        }
        .spin-btn:focus-visible { outline: 4px solid #fff; outline-offset: 8px; }
        .spin-btn:disabled {
            cursor: not-allowed;
            animation: none;
            filter: saturate(.45) brightness(.92);
            transform: translateY(6px);
            box-shadow:
                inset 0 3px 0 rgba(255, 255, 255, .6),
                inset 0 -5px 0 rgba(186, 96, 0, .25),
                0 0 0 4px rgba(255, 255, 255, .6),
                0 3px 0 4px #b86a00,
                0 8px 14px rgba(7, 26, 71, .3);
        }
        .spin-btn:disabled::after { animation: none; opacity: 0; }

        /* ---------- Sound toggle ---------- */
        .sound-btn {
            position: fixed;
            z-index: 120;
            top: max(14px, env(safe-area-inset-top));
            right: max(14px, env(safe-area-inset-right));
            width: 54px;
            height: 54px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, .85);
            background: linear-gradient(180deg, #2f6fe0, #143f9e);
            box-shadow: 0 5px 0 #0b2a6b, 0 10px 18px rgba(7, 26, 71, .35);
            display: grid;
            place-items: center;
            cursor: pointer;
            padding: 0;
            transition: transform .08s, box-shadow .08s;
        }
        .sound-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #0b2a6b, 0 4px 8px rgba(7, 26, 71, .35); }
        .sound-btn svg { width: 28px; height: 28px; }
        .sound-btn .waves { transition: opacity .2s; }
        .sound-btn .cross { opacity: 0; transition: opacity .2s; }
        .sound-btn.muted .waves { opacity: 0; }
        .sound-btn.muted .cross { opacity: 1; }

        /* ---------- Win modal (boarding pass) ---------- */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 45%, rgba(11, 42, 107, .35), rgba(5, 16, 46, .78));
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s;
            padding: 16px;
        }
        .modal-backdrop.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            --prize: #FFD700;
            position: relative;
            width: min(92vw, 400px);
            max-height: calc(100vh - 32px);
            max-height: calc(100dvh - 32px);
            overflow: auto;
            border-radius: 28px;
            background: #fffdf6;
            color: var(--ink);
            text-align: center;
            box-shadow: 0 0 0 4px rgba(255, 255, 255, .5), 0 30px 60px rgba(0, 0, 0, .45);
        }
        .modal-backdrop.show .modal-content {
            animation: ticket-in .7s cubic-bezier(.2, 1.4, .4, 1) .28s both;
        }
        .ticket-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 14px 20px;
            background: linear-gradient(180deg, #2a64d6, #123b98);
            color: #fff;
            font-weight: 700;
            font-size: .95rem;
            letter-spacing: .16em;
            border-radius: 28px 28px 0 0;
        }
        .ticket-head .bp { display: flex; align-items: center; gap: 8px; }
        .ticket-head svg { width: 22px; height: 22px; transform: rotate(45deg); }
        .ticket-head .flight {
            font-size: .78rem;
            padding: 3px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, .18);
            color: var(--gold);
        }
        .ticket-body { padding: 22px 26px 14px; }
        .win-badge {
            width: 124px;
            height: 124px;
            margin: 0 auto 14px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at 35% 30%, rgba(255, 255, 255, .9), rgba(255, 255, 255, 0) 45%),
                var(--prize);
            box-shadow:
                0 0 0 6px #fff,
                0 0 0 10px var(--gold),
                0 12px 24px rgba(7, 26, 71, .3),
                inset 0 -8px 16px rgba(0, 0, 0, .18);
            position: relative;
        }
        .win-badge::before {
            content: "";
            position: absolute;
            inset: -26px;
            border-radius: 50%;
            background: repeating-conic-gradient(from 0deg, rgba(255, 200, 40, .45) 0deg 10deg, rgba(255, 200, 40, 0) 10deg 24deg);
            -webkit-mask: radial-gradient(circle, transparent 52%, #000 56%, transparent 72%);
            mask: radial-gradient(circle, transparent 52%, #000 56%, transparent 72%);
            animation: rays 12s linear infinite;
            z-index: -1;
        }
        #win-icon {
            font-size: 68px;
            line-height: 1;
            font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
            filter: drop-shadow(0 4px 2px rgba(0, 0, 0, .2));
        }
        .modal-backdrop.show #win-icon { animation: icon-bounce 1s cubic-bezier(.3, 1.6, .5, 1) .55s both; }
        #win-title {
            margin: 6px 0 8px;
            font-size: clamp(1.7rem, 6vw, 2.1rem);
            font-weight: 700;
            letter-spacing: .04em;
            text-transform: uppercase;
            color: var(--navy);
            line-height: 1.05;
        }
        #win-desc {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 500;
            line-height: 1.4;
            color: #3b4f7a;
        }
        .ticket-perf {
            position: relative;
            height: 26px;
            margin: 6px 0;
        }
        .ticket-perf::before {
            content: "";
            position: absolute;
            left: 22px;
            right: 22px;
            top: 50%;
            border-top: 3px dashed #cfd8ea;
        }
        .ticket-perf::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 0 50%, #1d3770 12px, transparent 13px),
                radial-gradient(circle at 100% 50%, #1d3770 12px, transparent 13px);
        }
        .ticket-foot {
            padding: 6px 22px 22px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .barcode {
            height: 30px;
            margin: 0 18px;
            opacity: .75;
            background: repeating-linear-gradient(90deg,
                var(--navy) 0 2px, transparent 2px 4px,
                var(--navy) 4px 7px, transparent 7px 9px,
                var(--navy) 9px 10px, transparent 10px 13px,
                var(--navy) 13px 16px, transparent 16px 18px);
            border-radius: 3px;
        }
        #modal-close-btn {
            width: 100%;
            min-height: 64px;
            border: none;
            border-radius: 20px;
            font-family: var(--font);
            font-weight: 700;
            font-size: 1.35rem;
            letter-spacing: .1em;
            color: #fff;
            text-shadow: 0 2px 0 rgba(7, 26, 71, .4);
            background: linear-gradient(180deg, #4c8bff, #1f56d6 60%, #1745b4);
            box-shadow: inset 0 3px 0 rgba(255, 255, 255, .45), 0 7px 0 #0f2f86, 0 12px 20px rgba(7, 26, 71, .3);
            cursor: pointer;
            transition: transform .08s, box-shadow .08s;
        }
        #modal-close-btn:active {
            transform: translateY(6px);
            box-shadow: inset 0 3px 0 rgba(255, 255, 255, .45), 0 1px 0 #0f2f86, 0 4px 8px rgba(7, 26, 71, .3);
        }

        /* ---------- Keyframes ---------- */
        @keyframes rays { to { transform: rotate(360deg); } }
        @keyframes twinkle { 0%, 100% { opacity: 0; } 50% { opacity: .38; } }
        @keyframes win-flash { 0%, 100% { opacity: .05; } 50% { opacity: .55; } }
        @keyframes breathe { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-3px) scale(1.04); } }
        @keyframes shine { 0%, 55% { left: -40%; } 85%, 100% { left: 130%; } }
        @keyframes pop {
            0% { transform: scale(1); }
            30% { transform: scale(1.07, 1.03); }
            55% { transform: scale(.97, 1.02); }
            100% { transform: scale(1); }
        }
        @keyframes shake {
            10%, 90% { transform: translateX(-2px) rotate(-.5deg); }
            20%, 80% { transform: translateX(5px) rotate(1deg); }
            30%, 50%, 70% { transform: translateX(-9px) rotate(-1.5deg); }
            40%, 60% { transform: translateX(9px) rotate(1.5deg); }
        }
        @keyframes ticket-in {
            0% { transform: translateY(80px) rotate(-8deg) scale(.6); opacity: 0; }
            60% { opacity: 1; }
            100% { transform: translateY(0) rotate(0) scale(1); opacity: 1; }
        }
        @keyframes icon-bounce {
            0% { transform: scale(.2) rotate(-30deg); }
            100% { transform: scale(1) rotate(0); }
        }
        @keyframes drop-in {
            0% { transform: translateY(-40px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes wheel-in {
            0% { transform: scale(.6) rotate(-25deg); opacity: 0; }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }

        @media (prefers-reduced-motion: reduce) {
            .wheel-wrap::before, .spin-btn, .spin-btn::after, .win-badge::before { animation: none; }
            .wheel-body.shake { animation: none; }
        }
    </style>
</head>
<body>

<canvas id="sky" class="layer"></canvas>

<button id="sound-btn" class="sound-btn" aria-label="Sound on/off">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#fff"/>
        <g class="waves"><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></g>
        <g class="cross"><path d="M16 9.5l5 5M21 9.5l-5 5"/></g>
    </svg>
</button>

<div class="game-container">
    <!-- Brand Header -->
    <div class="brand-wrap">
        <h1 class="brand">
            <svg class="wing" viewBox="0 0 36 20"><path d="M36 4 C24 4 10 6 0 16 L4 19 C14 12 26 10 36 10 Z" fill="#fff"/><path d="M36 12 C28 12 20 13 12 18 L15 20 C22 16 29 15 36 15 Z" fill="#ffcf33"/></svg>
            <span>EL<span class="al">AL</span></span>
            <svg class="wing r" viewBox="0 0 36 20"><path d="M36 4 C24 4 10 6 0 16 L4 19 C14 12 26 10 36 10 Z" fill="#fff"/><path d="M36 12 C28 12 20 13 12 18 L15 20 C22 16 29 15 36 15 Z" fill="#ffcf33"/></svg>
        </h1>
        <p class="tagline">Open Skies<span class="dot">•</span><span class="he" dir="rtl">שמים פתוחים</span></p>
    </div>

    <!-- Wheel -->
    <div class="wheel-wrap">
        <div id="wheel-body" class="wheel-body idle">
            <svg id="wheel-svg" viewBox="0 0 200 200" aria-label="Sky wheel">
                <defs id="wheel-defs">
                    <linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#fff4b8"/>
                        <stop offset=".35" stop-color="#ffd23f"/>
                        <stop offset=".7" stop-color="#e0a000"/>
                        <stop offset="1" stop-color="#9a6200"/>
                    </linearGradient>
                    <linearGradient id="g-gold-rev" x1="0" y1="1" x2="0" y2="0">
                        <stop offset="0" stop-color="#fff4b8"/>
                        <stop offset=".4" stop-color="#ffd23f"/>
                        <stop offset="1" stop-color="#b77900"/>
                    </linearGradient>
                    <linearGradient id="g-bezel" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#2d6be0"/>
                        <stop offset=".5" stop-color="#173f9e"/>
                        <stop offset="1" stop-color="#0a1f57"/>
                    </linearGradient>
                    <radialGradient id="g-shade" cx="100" cy="100" r="83" gradientUnits="userSpaceOnUse">
                        <stop offset=".55" stop-color="#000" stop-opacity="0"/>
                        <stop offset=".88" stop-color="#001033" stop-opacity=".12"/>
                        <stop offset="1" stop-color="#001033" stop-opacity=".38"/>
                    </radialGradient>
                    <linearGradient id="g-gloss" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
                        <stop offset=".75" stop-color="#fff" stop-opacity="0"/>
                    </linearGradient>
                    <radialGradient id="g-bulb-off" cx=".35" cy=".35" r=".75">
                        <stop offset="0" stop-color="#fff8e6"/>
                        <stop offset=".6" stop-color="#d9c79a"/>
                        <stop offset="1" stop-color="#8f7b4e"/>
                    </radialGradient>
                    <radialGradient id="g-bulb-on" cx=".4" cy=".4" r=".7">
                        <stop offset="0" stop-color="#ffffff"/>
                        <stop offset=".45" stop-color="#fff3a0"/>
                        <stop offset="1" stop-color="#ffb300"/>
                    </radialGradient>
                    <radialGradient id="g-halo">
                        <stop offset="0" stop-color="#fff6b0" stop-opacity=".95"/>
                        <stop offset=".35" stop-color="#ffcf33" stop-opacity=".55"/>
                        <stop offset="1" stop-color="#ff9d00" stop-opacity="0"/>
                    </radialGradient>
                    <radialGradient id="g-hub" cx=".38" cy=".32" r=".8">
                        <stop offset="0" stop-color="#4f8cff"/>
                        <stop offset=".6" stop-color="#1a47b0"/>
                        <stop offset="1" stop-color="#0a1f57"/>
                    </radialGradient>
                    <clipPath id="face-clip"><circle cx="100" cy="100" r="83"/></clipPath>
                </defs>

                <!-- drop shadow under wheel -->
                <circle cx="100" cy="104" r="99" fill="#071a47" opacity=".28"/>
                <!-- bezel -->
                <circle cx="100" cy="100" r="99.5" fill="url(#g-gold)"/>
                <circle cx="100" cy="100" r="96.5" fill="url(#g-bezel)"/>
                <circle cx="100" cy="100" r="96.5" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width=".8"/>
                <circle cx="100" cy="100" r="86.5" fill="url(#g-gold-rev)"/>

                <!-- face -->
                <g clip-path="url(#face-clip)">
                    <g id="segments-group"></g>
                    <circle cx="100" cy="100" r="83" fill="url(#g-shade)"/>
                    <g id="highlight-group"></g>
                    <ellipse cx="100" cy="58" rx="74" ry="44" fill="url(#g-gloss)" opacity=".55"/>
                </g>
                <circle cx="100" cy="100" r="83" fill="none" stroke="#7a4c00" stroke-opacity=".35" stroke-width="1"/>
                <g id="pins-group"></g>

                <!-- running lights -->
                <g id="led-container"></g>

                <!-- hub + plane pointer -->
                <circle cx="100" cy="102" r="18" fill="#071a47" opacity=".3"/>
                <circle cx="100" cy="100" r="17" fill="url(#g-gold)"/>
                <circle cx="100" cy="100" r="14" fill="url(#g-hub)"/>
                <circle cx="100" cy="100" r="14" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width=".6"/>
                <g id="plane-shadow" transform="translate(101.6 102.8) rotate(90)" opacity=".28">
                    <path fill="#000" d="M-3.4,-19 Q0,-25 3.4,-19 L3.4,-4 L20,6 L20,9.6 L3.4,4.5 L3.4,11 L9,15.5 L9,18 L1.6,16.4 Q0,19 -1.6,16.4 L-9,18 L-9,15.5 L-3.4,11 L-3.4,4.5 L-20,9.6 L-20,6 L-3.4,-4 Z"/>
                </g>
                <g id="plane" transform="translate(100 100) rotate(90)">
                    <path fill="#e6ecf7" stroke="#0b2a6b" stroke-width="1.1" stroke-linejoin="round"
                          d="M-3.4,-4 L-20,6 L-20,9.6 L-3.4,4.5 Z M3.4,-4 L20,6 L20,9.6 L3.4,4.5 Z"/>
                    <rect x="-12.6" y="1" width="3.4" height="6" rx="1.6" fill="#9fb2d6" stroke="#0b2a6b" stroke-width=".8"/>
                    <rect x="9.2" y="1" width="3.4" height="6" rx="1.6" fill="#9fb2d6" stroke="#0b2a6b" stroke-width=".8"/>
                    <path fill="#2a64d6" stroke="#0b2a6b" stroke-width="1" stroke-linejoin="round"
                          d="M-1.6,11 L-9,15.5 L-9,18 L-1.6,16.4 Z M1.6,11 L9,15.5 L9,18 L1.6,16.4 Z"/>
                    <path fill="#ffffff" stroke="#0b2a6b" stroke-width="1.1" stroke-linejoin="round"
                          d="M-3.4,-19 Q0,-25 3.4,-19 L3.4,14 Q0,20 -3.4,14 Z"/>
                    <path d="M-2,-18.6 Q0,-22 2,-18.6 Z" fill="#0b2a6b"/>
                    <line x1="0" y1="-12" x2="0" y2="10" stroke="#2a64d6" stroke-width="1.2" stroke-linecap="round"/>
                    <circle cx="0" cy="2" r="1.6" fill="#ffcf33" stroke="#9a6200" stroke-width=".5"/>
                </g>
            </svg>
        </div>
    </div>

    <div class="btn-wrap">
        <button id="spin-btn" class="spin-btn">
            <svg class="plane-ico" viewBox="-22 -22 44 44"><path fill="#6b3a00" d="M-3.4,-19 Q0,-25 3.4,-19 L3.4,-4 L20,6 L20,9.6 L3.4,4.5 L3.4,11 L9,15.5 L9,18 L1.6,16.4 Q0,19 -1.6,16.4 L-9,18 L-9,15.5 L-3.4,11 L-3.4,4.5 L-20,9.6 L-20,6 L-3.4,-4 Z"/></svg>
            <span>SPIN!</span>
        </button>
    </div>
</div>

<!-- Win Modal -->
<div id="modal" class="modal-backdrop">
    <div class="modal-content" id="ticket">
        <div class="ticket-head">
            <span class="bp"><svg viewBox="-22 -22 44 44"><path fill="#ffcf33" d="M-3.4,-19 Q0,-25 3.4,-19 L3.4,-4 L20,6 L20,9.6 L3.4,4.5 L3.4,11 L9,15.5 L9,18 L1.6,16.4 Q0,19 -1.6,16.4 L-9,18 L-9,15.5 L-3.4,11 L-3.4,4.5 L-20,9.6 L-20,6 L-3.4,-4 Z"/></svg>BOARDING PASS</span>
            <span class="flight">FLIGHT 501</span>
        </div>
        <div class="ticket-body">
            <div class="win-badge"><div id="win-icon">✈️</div></div>
            <h2 id="win-title"></h2>
            <p id="win-desc"></p>
        </div>
        <div class="ticket-perf"></div>

<canvas id="fx" class="layer"></canvas>

<script>
    const prizes = [
        {
            icon: '✈️',
            label: 'OPEN SKIES',
            color: '#FFD700',
            desc: 'Proceed directly to one of your destinations!'
        },
        {
            icon: '⭐',
            label: 'BACK TRACK',
            color: '#1E40AF',
            desc: 'Go back to the nearest star.'
        },
        {
            icon: '🌟',
            label: 'GLOWING STAR',
            color: '#312E81',
            desc: 'Proceed forward to the nearest star.'
        },
        {
            icon: '➕',
            label: 'AIRPORT ACCESS',
            color: '#E5E7EB',
            desc: 'Proceed forward to the nearest airport.'
        },
        {
            icon: '😔',
            label: 'SAD FACE',
            color: '#F3F4F6',
            desc: 'Bad luck! You lose your turn.'
        },
        {
            icon: '😊',
            label: 'HAPPY FACE',
            color: '#FDE047',
            desc: 'Lucky you! Take another turn.'
        },
        {
            icon: '🃏',
            label: 'SWITCH CARDS',
            color: '#9333EA',
            desc: 'Switch cards with another player!'
        }
    ];

    // Visual styling per segment (presentation only) — follows each prize's colour family.
    const segStyle = [
        { hi: '#fff27a', lo: '#f0b400', ink: '#6b4200', line: 'rgba(255,255,255,.7)' },
        { hi: '#4f8bff', lo: '#163a9a', ink: '#ffffff', line: 'rgba(7,26,71,.5)' },
        { hi: '#6e60f2', lo: '#251f70', ink: '#ffffff', line: 'rgba(7,26,71,.5)' },
        { hi: '#ffffff', lo: '#d3dbe8', ink: '#1b3f8f', line: 'rgba(255,255,255,.7)' },
        { hi: '#eef2f9', lo: '#aebcd3', ink: '#3b4a6b', line: 'rgba(255,255,255,.7)' },
        { hi: '#fff59e', lo: '#f6c400', ink: '#6b4700', line: 'rgba(255,255,255,.7)' },
        { hi: '#c582ff', lo: '#6b16c0', ink: '#ffffff', line: 'rgba(7,26,71,.5)' }
    ];

    const SVGNS = "http://www.w3.org/2000/svg";
    const segmentsGroup = document.getElementById('segments-group');
    const highlightGroup = document.getElementById('highlight-group');
    const pinsGroup = document.getElementById('pins-group');
    const wheelDefs = document.getElementById('wheel-defs');
    const wheelSvg = document.getElementById('wheel-svg');
    const wheelBody = document.getElementById('wheel-body');
    const ledContainer = document.getElementById('led-container');
    const spinBtn = document.getElementById('spin-btn');
    const modal = document.getElementById('modal');
    const modalCloseBtn = document.getElementById('modal-close-btn');
    const ticket = document.getElementById('ticket');
    const planeEl = document.getElementById('plane');
    const planeShadowEl = document.getElementById('plane-shadow');
    const soundBtn = document.getElementById('sound-btn');

    const totalSegments = prizes.length;
    const anglePerSegment = 360 / totalSegments;

    function svgEl(tag, attrs) {
        const el = document.createElementNS(SVGNS, tag);
        for (const k in attrs) el.setAttribute(k, attrs[k]);
        return el;
    }
    // angle measured clockwise from the top (degrees) -> point on wheel
    function pt(angleDeg, r) {
        const a = angleDeg * Math.PI / 180;
        return [100 + r * Math.sin(a), 100 - r * Math.cos(a)];
    }

    const FACE_R = 84;
    const highlights = [];

    prizes.forEach((prize, i) => {
        const startAngle = i * anglePerSegment;
        const endAngle = (i + 1) * anglePerSegment;
        const st = segStyle[i];

        const grad = svgEl('radialGradient', { id: 'seg-' + i, cx: 100, cy: 100, r: FACE_R, gradientUnits: 'userSpaceOnUse' });
        grad.appendChild(svgEl('stop', { offset: '0.15', 'stop-color': st.lo }));
        grad.appendChild(svgEl('stop', { offset: '0.6', 'stop-color': st.hi }));
        grad.appendChild(svgEl('stop', { offset: '1', 'stop-color': st.lo }));
        wheelDefs.appendChild(grad);

        const [x1, y1] = pt(startAngle, FACE_R);
        const [x2, y2] = pt(endAngle, FACE_R);
        const pathData = `M 100 100 L ${x1} ${y1} A ${FACE_R} ${FACE_R} 0 0 1 ${x2} ${y2} Z`;

        const g = svgEl('g', {});
        g.appendChild(svgEl('path', { d: pathData, fill: `url(#seg-${i})` }));

        // inner decorative arc stripe
        const [ax1, ay1] = pt(startAngle + 2.5, 78);
        const [ax2, ay2] = pt(endAngle - 2.5, 78);
        g.appendChild(svgEl('path', {
            d: `M ${ax1} ${ay1} A 78 78 0 0 1 ${ax2} ${ay2}`,
            fill: 'none', stroke: st.line, 'stroke-width': 1, 'stroke-dasharray': '1.5 3', 'stroke-linecap': 'round'
        }));

        // curved label along the outer edge
        const arcId = 'arc-' + i;
        const [lx1, ly1] = pt(startAngle + 2, 68);
        const [lx2, ly2] = pt(endAngle - 2, 68);
        wheelDefs.appendChild(svgEl('path', { id: arcId, d: `M ${lx1} ${ly1} A 68 68 0 0 1 ${lx2} ${ly2}` }));
        const label = svgEl('text', {
            class: 'seg-label', fill: st.ink, 'font-size': prize.label.length > 12 ? 6.3 : 7,
            'text-anchor': 'middle'
        });
        const tp = svgEl('textPath', { href: '#' + arcId, startOffset: '50%' });
        tp.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', '#' + arcId);
        tp.textContent = prize.label;
        label.appendChild(tp);
        g.appendChild(label);

        // icon
        const textAngle = startAngle + (anglePerSegment / 2);
        const [tx, ty] = pt(textAngle, 45);
        const glow = svgEl('circle', { cx: tx, cy: ty, r: 14, fill: '#fff', opacity: st.ink === '#ffffff' ? 0.16 : 0.45 });
        g.appendChild(glow);
        const text = svgEl('text', {
            x: tx, y: ty, class: 'emoji', 'font-size': 21,
            'text-anchor': 'middle', 'dominant-baseline': 'central',
            transform: `rotate(${textAngle}, ${tx}, ${ty})`
        });
        text.textContent = prize.icon;
        g.appendChild(text);
        segmentsGroup.appendChild(g);

        // highlight overlay (lights up while the chase passes over)
        const hl = svgEl('path', { d: pathData, class: 'seg-hl' });
        highlightGroup.appendChild(hl);
        highlights.push(hl);

        // divider line + gold pin
        const [ex, ey] = pt(startAngle, FACE_R);
        segmentsGroup.appendChild(svgEl('line', { x1: 100, y1: 100, x2: ex, y2: ey, stroke: '#fff', 'stroke-width': 1.6 }));
        const [px, py] = pt(startAngle, 79.5);
        pinsGroup.appendChild(svgEl('circle', { cx: px, cy: py, r: 2.1, fill: 'url(#g-gold)', stroke: '#7a4c00', 'stroke-width': 0.4 }));
    });

    const ledCount = 21;
    const LED_R = 91.5;
    const leds = [];
    for (let i = 0; i < ledCount; i++) {
        const angle = (i / ledCount) * 2 * Math.PI;
        const x = 100 + Math.cos(angle) * LED_R;
        const y = 100 + Math.sin(angle) * LED_R;
        const led = svgEl('g', { class: 'led', transform: `translate(${x.toFixed(2)} ${y.toFixed(2)})` });
        led.appendChild(svgEl('circle', { class: 'halo', r: 8, fill: 'url(#g-halo)' }));
        led.appendChild(svgEl('circle', { r: 3.9, fill: 'url(#g-gold)', stroke: '#6b4200', 'stroke-width': 0.4 }));
        led.appendChild(svgEl('circle', { r: 2.8, fill: 'url(#g-bulb-off)' }));
        led.appendChild(svgEl('circle', { class: 'lit', r: 2.8, fill: 'url(#g-bulb-on)' }));
        led.appendChild(svgEl('circle', { cx: -0.9, cy: -1, r: 0.8, fill: '#fff', opacity: 0.85 }));
        ledContainer.appendChild(led);
        leds.push(led);
    }

    let isSpinning = false;
    let currentLed = 0;

    function startSpin() {
        if (isSpinning) return;
        isSpinning = true;
        spinBtn.disabled = true;
        onSpinStart();

        let speed = 20;
        const totalSteps = 70 + Math.floor(Math.random() * 60);
        let steps = 0;

        function run() {
            leds.forEach(l => l.classList.remove('active'));
            currentLed = (currentLed + 1) % ledCount;
            leds[currentLed].classList.add('active');
            leds[(currentLed - 1 + ledCount) % ledCount].classList.add('active');
            onLedStep();

            steps++;
            if (steps < totalSteps) {
                if (steps > totalSteps * 0.7) speed += 15;
                else if (steps > totalSteps * 0.5) speed += 5;
                setTimeout(run, speed);
            } else {
                finish();
            }
        }
        run();
    }

    function finish() {
        isSpinning = false;
        spinBtn.disabled = false;

        const offset = ledCount * 0.25;
        const adjustedLed = (currentLed + offset) % ledCount;
        const winnerIdx = Math.floor((adjustedLed / ledCount) * totalSegments);
        const winner = prizes[winnerIdx];

        document.getElementById('win-icon').innerText = winner.icon;
        document.getElementById('win-title').innerText = winner.label;
        document.getElementById('win-desc').innerText = winner.desc;
        modal.classList.add('show');
        celebrate(winnerIdx);
    }

    function closeModal() {
        modal.classList.remove('show');
    }

    spinBtn.addEventListener('click', startSpin);
    modalCloseBtn.addEventListener('click', closeModal);

    /* =====================================================================
       Presentation layer: highlight, plane pointer, sound, sky, particles.
       None of this affects the game result.
       ===================================================================== */

    // Same mapping finish() uses, for showing which segment the lights are on.
    function segmentUnderLed(ledIdx) {
        const adjusted = (ledIdx + ledCount * 0.25) % ledCount;
        return Math.floor((adjusted / ledCount) * totalSegments);
    }

    let litSeg = -1;
    let stepCount = 0;
    let planeTarget = 90;      // degrees clockwise from top; LED 0 sits at 90°
    let planeAngle = 90;
    let spinBoost = 1;

    function setLitSegment(idx) {
        if (idx === litSeg) return;
        if (litSeg >= 0) highlights[litSeg].classList.remove('lit');
        litSeg = idx;
        if (idx >= 0) highlights[idx].classList.add('lit');
    }

    function onSpinStart() {
        highlights.forEach(h => h.classList.remove('win'));
        wheelBody.classList.remove('idle', 'pop', 'shake');
        measureWheel();
        ensureAudio();
    }

    const NOTE_SCALE = [523.25, 587.33, 659.25, 783.99, 880.0, 987.77, 1046.5];
    function onLedStep() {
        stepCount++;
        planeTarget += 360 / ledCount;
        const seg = segmentUnderLed(currentLed);
        setLitSegment(seg);
        playTick(NOTE_SCALE[seg]);
        // sparkles fly off the lead bulb
        const a = (currentLed / ledCount) * 2 * Math.PI;
        const r = wheelRect;
        const cx = r.left + r.width * (0.5 + Math.cos(a) * LED_R / 200);
        const cy = r.top + r.height * (0.5 + Math.sin(a) * LED_R / 200);
        for (let k = 0; k < 2; k++) {
            spawn(cx, cy, Math.cos(a) * 60 + (Math.random() - .5) * 120, Math.sin(a) * 60 + (Math.random() - .5) * 120,
                  0.45 + Math.random() * 0.3, 3 + Math.random() * 3, SPARK_COLORS[(Math.random() * SPARK_COLORS.length) | 0], 1, 0);
        }
    }

    function celebrate(idx) {
        setLitSegment(-1);
        highlights[idx].classList.add('win');
        wheelBody.classList.add('idle');
        modal.querySelector('.modal-content').style.setProperty('--prize', segStyle[idx].hi === '#ffffff' ? '#e9eef7' : prizes[idx].color);
        void wheelBody.offsetWidth;
        const sad = prizes[idx].label === 'SAD FACE';
        if (sad) {
            wheelBody.classList.add('shake');
            playSad();
        } else {
            wheelBody.classList.add('pop');
            playWin();
            confettiBurst();
        }
    }

    /* ---------------- Sound (WebAudio, tiny synth) ---------------- */
    let actx = null;
    let muted = false;
    try { muted = localStorage.getItem('skywheel-muted') === '1'; } catch (e) {}
    soundBtn.classList.toggle('muted', muted);
    soundBtn.addEventListener('click', () => {
        muted = !muted;
        soundBtn.classList.toggle('muted', muted);
        try { localStorage.setItem('skywheel-muted', muted ? '1' : '0'); } catch (e) {}
        if (!muted) { ensureAudio(); tone(880, 0.12, 'triangle', 0.15, 0); }
    });

    function ensureAudio() {
        try {
            if (!actx) {
                const C = window.AudioContext || window.webkitAudioContext;
                if (!C) return null;
                actx = new C();
            }
            if (actx.state === 'suspended') actx.resume();
        } catch (e) { actx = null; }
        return actx;
    }
    function tone(freq, dur, type, vol, when, slideTo) {
        if (muted || !actx || actx.state !== 'running') return;
        const t = actx.currentTime + (when || 0);
        const o = actx.createOscillator();
        const g = actx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, t);
        if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g);
        g.connect(actx.destination);
        o.start(t);
        o.stop(t + dur + 0.03);
    }
    function playTick(freq) { tone(freq * 2, 0.05, 'triangle', 0.09, 0); }
    function playWin() {
        const n = [523.25, 659.25, 783.99, 1046.5];
        n.forEach((f, i) => tone(f, i === 3 ? 0.55 : 0.16, 'triangle', 0.2, i * 0.1));
        n.forEach((f, i) => tone(f * 2, 0.12, 'sine', 0.05, 0.45 + i * 0.06));
    }
    function playSad() {
        tone(392, 0.28, 'triangle', 0.18, 0, 370);
        tone(330, 0.3, 'triangle', 0.18, 0.3, 311);
        tone(262, 0.6, 'triangle', 0.18, 0.62, 220);
    }

    /* ---------------- Canvas: sky + effects ---------------- */
    const sky = document.getElementById('sky');
    const sctx = sky.getContext('2d');
    const fx = document.getElementById('fx');
    const fctx = fx.getContext('2d');
    let VW = 0, VH = 0, DPR = 1;
    let wheelRect = { left: 0, top: 0, width: 1, height: 1 };

    function makeCloudSprite(w, seed) {
        let s = seed;
        const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
        const h = Math.round(w * 0.55);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const g = c.getContext('2d');
        const puffs = [];
        const n = 5 + Math.floor(rnd() * 3);
        for (let k = 0; k < n; k++) {
            const t = k / (n - 1);
            const mid = 1 - Math.abs(t - 0.5) * 1.6;
            const r = h * (0.17 + 0.2 * mid + rnd() * 0.08);
            const x = w * (0.16 + 0.68 * t) + (rnd() - .5) * w * 0.05;
            const y = h * 0.72 - r * (0.55 + rnd() * 0.3);
            puffs.push([x, y, r]);
        }
        // shadow pass
        g.fillStyle = 'rgba(120,150,200,.35)';
        g.beginPath();
        for (const [x, y, r] of puffs) { g.moveTo(x + r, y + h * 0.04); g.arc(x, y + h * 0.04, r, 0, Math.PI * 2); }
        g.fill();
        // body
        const grad = g.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0.2, '#ffffff');
        grad.addColorStop(0.7, '#eaf2ff');
        grad.addColorStop(1, '#c9dbf5');
        g.fillStyle = grad;
        g.beginPath();
        for (const [x, y, r] of puffs) { g.moveTo(x + r, y); g.arc(x, y, r, 0, Math.PI * 2); }
        g.fill();
        // flat base
        g.beginPath();
        const bx = w * 0.12, by = h * 0.55, bw = w * 0.76, bh = h * 0.2;
        g.moveTo(bx + bh / 2, by);
        g.lineTo(bx + bw - bh / 2, by);
        g.arc(bx + bw - bh / 2, by + bh / 2, bh / 2, -Math.PI / 2, Math.PI / 2);
        g.lineTo(bx + bh / 2, by + bh);
        g.arc(bx + bh / 2, by + bh / 2, bh / 2, Math.PI / 2, Math.PI * 1.5);
        g.fill();
        // sunlit rims
        g.globalCompositeOperation = 'source-atop';
        g.fillStyle = 'rgba(255,255,255,.7)';
        g.beginPath();
        for (const [x, y, r] of puffs) { g.moveTo(x + r * 0.8, y - r * 0.25); g.arc(x - r * 0.12, y - r * 0.25, r * 0.8, 0, Math.PI * 2); }
        g.fill();
        return c;
    }

    const cloudSprites = [];
    for (let i = 0; i < 6; i++) cloudSprites.push(makeCloudSprite(360, 17 + i * 131));

    const LAYERS = [
        { count: 6, yMin: 0.04, yMax: 0.42, sMin: 0.32, sMax: 0.48, speed: 7, alpha: 0.55 },
        { count: 5, yMin: 0.18, yMax: 0.7, sMin: 0.6, sMax: 0.85, speed: 15, alpha: 0.82 },
        { count: 7, yMin: 0.8, yMax: 0.98, sMin: 1.1, sMax: 1.55, speed: 28, alpha: 1 }
    ];
    const clouds = [];
    LAYERS.forEach((L, li) => {
        for (let k = 0; k < L.count; k++) {
            clouds.push({
                layer: li,
                fx: (k + Math.random() * 0.6) / L.count,  // fractional x until first resize
                x: 0,
                fy: L.yMin + Math.random() * (L.yMax - L.yMin),
                s: L.sMin + Math.random() * (L.sMax - L.sMin),
                sprite: cloudSprites[(Math.random() * cloudSprites.length) | 0]
            });
        }
    });
    let cloudsPlaced = false;

    const jet = { on: false, x: 0, y: 0, dir: 1, speed: 0, scale: 1, timer: 2.5 };

    function resize() {
        DPR = Math.min(2, window.devicePixelRatio || 1);
        VW = window.innerWidth;
        VH = window.innerHeight;
        for (const c of [sky, fx]) {
            c.width = Math.round(VW * DPR);
            c.height = Math.round(VH * DPR);
        }
        if (!cloudsPlaced) {
            for (const c of clouds) c.x = c.fx * (VW + 300) - 150;
            cloudsPlaced = true;
        }
        measureWheel();
    }
    function measureWheel() {
        const r = wheelSvg.getBoundingClientRect();
        wheelRect = { left: r.left, top: r.top, width: r.width, height: r.height };
    }
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 200));
    resize();
    setTimeout(measureWheel, 1100); // after intro animation settles

    function drawSky(dt) {
        sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        sctx.clearRect(0, 0, VW, VH);
        const boost = spinBoost;

        // far + mid clouds
        for (let i = 0; i < clouds.length; i++) {
            const c = clouds[i];
            const L = LAYERS[c.layer];
            const w = c.sprite.width * c.s * Math.max(0.7, Math.min(1.4, VW / 1100));
            const h = c.sprite.height * (w / c.sprite.width);
            c.x -= L.speed * boost * dt;
            if (c.x + w < -20) {
                c.x = VW + 20 + Math.random() * 160;
                c.fy = L.yMin + Math.random() * (L.yMax - L.yMin);
            }
            sctx.globalAlpha = L.alpha;
            sctx.drawImage(c.sprite, c.x, c.fy * VH - h * 0.6, w, h);
        }
        sctx.globalAlpha = 1;

        // a little jet crossing the sky now and then
        if (!jet.on) {
            jet.timer -= dt;
            if (jet.timer <= 0) {
                jet.on = true;
                jet.dir = Math.random() < 0.5 ? 1 : -1;
                jet.scale = 0.7 + Math.random() * 0.5;
                jet.x = jet.dir > 0 ? -60 : VW + 60;
                jet.y = VH * (0.08 + Math.random() * 0.22);
                jet.speed = 70 + Math.random() * 40;
            }
        } else {
            jet.x += jet.dir * jet.speed * boost * dt;
            jet.y -= 4 * dt;
            drawJet();
            if ((jet.dir > 0 && jet.x > VW + 320) || (jet.dir < 0 && jet.x < -320)) {
                jet.on = false;
                jet.timer = 6 + Math.random() * 8;
            }
        }
    }

    function drawJet() {
        const s = jet.scale;
        const tailX = jet.x - jet.dir * 18 * s;
        const len = 260 * s;
        const grad = sctx.createLinearGradient(tailX, 0, tailX - jet.dir * len, 0);
        grad.addColorStop(0, 'rgba(255,255,255,.85)');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        sctx.strokeStyle = grad;
        sctx.lineCap = 'round';
        sctx.lineWidth = 3 * s;
        sctx.beginPath();
        sctx.moveTo(tailX, jet.y - 2 * s);
        sctx.lineTo(tailX - jet.dir * len, jet.y - 2 * s + 4);
        sctx.moveTo(tailX, jet.y + 2.5 * s);
        sctx.lineTo(tailX - jet.dir * len, jet.y + 2.5 * s + 4);
        sctx.stroke();

        sctx.save();
        sctx.translate(jet.x, jet.y);
        sctx.scale(jet.dir * s, s);
        sctx.fillStyle = '#ffffff';
        sctx.strokeStyle = 'rgba(11,42,107,.55)';
        sctx.lineWidth = 1;
        // body
        sctx.beginPath();
        sctx.moveTo(20, 0);
        sctx.quadraticCurveTo(22, -3, 14, -3.4);
        sctx.lineTo(-16, -3);
        sctx.lineTo(-22, -11);
        sctx.lineTo(-26, -11);
        sctx.lineTo(-22, 1.5);
        sctx.quadraticCurveTo(0, 3.8, 14, 3);
        sctx.quadraticCurveTo(22, 2.5, 20, 0);
        sctx.closePath();
        sctx.fill();
        sctx.stroke();
        // wing
        sctx.fillStyle = '#c8d6f0';
        sctx.beginPath();
        sctx.moveTo(4, 0.5);
        sctx.lineTo(-10, 9);
        sctx.lineTo(-5, 9);
        sctx.lineTo(9, 0.5);
        sctx.closePath();
        sctx.fill();
        // stripe
        sctx.fillStyle = '#2a64d6';
        sctx.fillRect(-14, -0.8, 30, 1.4);
        sctx.restore();
    }

    /* Particles: fixed pool, no per-frame allocation */
    const SPARK_COLORS = ['#fff6b0', '#ffd23f', '#ffffff', '#ffb300'];
    const CONFETTI_COLORS = ['#ffd23f', '#2f6fe0', '#ffffff', '#9b4dff', '#ff5d8f', '#3fd0a0', '#ff9d1a'];
    const POOL = 260;
    const parts = [];
    for (let i = 0; i < POOL; i++) parts.push({ on: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, size: 4, color: '#fff', type: 0, grav: 0, rot: 0, vr: 0, wob: 0 });
    let poolIdx = 0;
    let liveParts = 0;
    let fxDirty = false;

    function spawn(x, y, vx, vy, life, size, color, type, grav) {
        const p = parts[poolIdx];
        poolIdx = (poolIdx + 1) % POOL;
        if (!p.on) liveParts++;
        p.on = true; p.x = x; p.y = y; p.vx = vx; p.vy = vy;
        p.life = life; p.max = life; p.size = size; p.color = color; p.type = type; p.grav = grav;
        p.rot = Math.random() * 6.28; p.vr = (Math.random() - .5) * 12; p.wob = Math.random() * 6.28;
    }

    function confettiBurst() {
        measureWheel();
        const cx = wheelRect.left + wheelRect.width / 2;
        const cy = wheelRect.top + wheelRect.height / 2;
        // cannons from both bottom corners
        for (let i = 0; i < 70; i++) {
            const side = i % 2 ? 1 : -1;
            const x = side < 0 ? -10 : VW + 10;
            const ang = (-Math.PI / 2) + side * -(0.25 + Math.random() * 0.45);
            const sp = VH * (1.1 + Math.random() * 0.9);
            spawn(x, VH + 10, Math.cos(ang) * sp, Math.sin(ang) * sp, 2.6 + Math.random() * 1.4,
                  6 + Math.random() * 7, CONFETTI_COLORS[i % CONFETTI_COLORS.length], 0, VH * 1.1);
        }
        // starburst from the wheel
        for (let i = 0; i < 40; i++) {
            const ang = Math.random() * Math.PI * 2;
            const sp = 180 + Math.random() * 380;
            spawn(cx, cy, Math.cos(ang) * sp, Math.sin(ang) * sp, 0.7 + Math.random() * 0.6,
                  5 + Math.random() * 6, SPARK_COLORS[i % SPARK_COLORS.length], 1, 0);
        }
    }

    function drawStar(ctx, r) {
        ctx.beginPath();
        ctx.moveTo(0, -r);
        ctx.quadraticCurveTo(0, 0, r, 0);
        ctx.quadraticCurveTo(0, 0, 0, r);
        ctx.quadraticCurveTo(0, 0, -r, 0);
        ctx.quadraticCurveTo(0, 0, 0, -r);
        ctx.fill();
    }

    function drawFx(dt) {
        if (liveParts === 0) {
            if (fxDirty) { fctx.setTransform(1, 0, 0, 1, 0, 0); fctx.clearRect(0, 0, fx.width, fx.height); fxDirty = false; }
            return;
        }
        fxDirty = true;
        fctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        fctx.clearRect(0, 0, VW, VH);
        for (let i = 0; i < POOL; i++) {
            const p = parts[i];
            if (!p.on) continue;
            p.life -= dt;
            if (p.life <= 0) { p.on = false; liveParts--; continue; }
            const t = p.life / p.max;
            if (p.type === 0) {
                // confetti: drag + gravity + flutter
                p.vx *= (1 - 1.6 * dt);
                p.vy = p.vy * (1 - 1.2 * dt) + p.grav * dt;
                p.wob += dt * 8;
                p.x += (p.vx + Math.sin(p.wob) * 40) * dt;
                p.y += p.vy * dt;
                p.rot += p.vr * dt;
                fctx.globalAlpha = Math.min(1, t * 3);
                fctx.fillStyle = p.color;
                fctx.save();
                fctx.translate(p.x, p.y);
                fctx.rotate(p.rot);
                fctx.scale(1, Math.abs(Math.cos(p.wob)) * 0.8 + 0.2);
                fctx.fillRect(-p.size / 2, -p.size * 0.3, p.size, p.size * 0.6);
                fctx.restore();
            } else {
                // sparkle star
                p.vx *= (1 - 3 * dt);
                p.vy *= (1 - 3 * dt);
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                fctx.globalAlpha = t;
                fctx.fillStyle = p.color;
                fctx.save();
                fctx.translate(p.x, p.y);
                fctx.rotate(p.rot);
                drawStar(fctx, p.size * (0.4 + t * 0.6));
                fctx.restore();
            }
        }
        fctx.globalAlpha = 1;
    }

    function updatePlane(dt, now) {
        const k = 1 - Math.exp(-dt * 22);
        planeAngle += (planeTarget - planeAngle) * k;
        const wobble = isSpinning ? 0 : Math.sin(now / 600) * 3;
        const a = (planeAngle + wobble).toFixed(2);
        planeEl.setAttribute('transform', `translate(100 100) rotate(${a})`);
        planeShadowEl.setAttribute('transform', `translate(101.6 102.8) rotate(${a})`);
    }

    let last = performance.now();
    function frame(now) {
        let dt = (now - last) / 1000;
        last = now;
        if (dt > 0.1) dt = 0.1;
        spinBoost += ((isSpinning ? 5 : 1) - spinBoost) * (1 - Math.exp(-dt * 3));
        drawSky(dt);
        drawFx(dt);
        updatePlane(dt, now);
        requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
</script>
</body>
</html>
