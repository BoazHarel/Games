    /* --- GAME STATE --- */
    let allCountries = []; // Will be populated from API
    let score = 0;
    let strikes = 0;
    const maxStrikes = 3;
    let currentMode = 'flags';
    let currentOptions = [];
    let correctIndex = 0;
    let gameActive = false;
    let countryQueue = [];
    let worldGeoJson = null;
    let zoomStates = [false, false, false, false];

    /* --- PRESENTATION-ONLY STATE (does not affect gameplay) --- */
    let shownStrikes = 0;
    let shownScore = 0;
    let streak = 0;
    const MODE_META = {
        flags: { label: 'Flags', icon: '#ico-flag' },
        globes: { label: 'Maps', icon: '#ico-globe' },
        names: { label: 'Hebrew Names', icon: '#ico-tag' }
    };
    const PRAISE = ['Great!', 'Awesome!', 'Super!', 'Well done!', 'Amazing!', 'Yes!', 'Brilliant!', 'Fantastic!'];

    /* --- DOM ELEMENTS --- */
    const screens = {
        loading: document.getElementById('loading-screen'),
        menu: document.getElementById('menu-screen'),
        game: document.getElementById('game-screen'),
        over: document.getElementById('game-over-screen')
    };

    const ui = {
        score: document.getElementById('score'),
        hearts: document.getElementById('hearts-container'),
        label: document.getElementById('question-label'),
        textContainer: document.getElementById('text-question-container'),
        visualContainer: document.getElementById('visual-question-container'),
        cName: document.getElementById('country-name'),
        cNameHe: document.getElementById('country-name-he'),
        hint: document.getElementById('hint-container'),
        finalScore: document.getElementById('final-score'),
        buttons: [
            document.getElementById('btn-0'),
            document.getElementById('btn-1'),
            document.getElementById('btn-2'),
            document.getElementById('btn-3')
        ]
    };

    /* --- INITIALIZATION --- */
    window.onload = async () => {
        try {
            document.getElementById('loading-text').textContent = "Fetching Atlas Data...";

            // Fetch both Map Data and Authoritative Country Data in parallel
            const [geoRes, countriesRes] = await Promise.all([
                fetch('https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson'),
                fetch('https://raw.githubusercontent.com/mledoze/countries/master/countries.json')
            ]);

            worldGeoJson = await geoRes.json();
            const rawCountries = await countriesRes.json();

            // Process Data:
            // 1. Create standardized country objects
            // 2. Map Hebrew names if available
            // 3. Filter to ensure we have map data (ISO3 match)

            allCountries = rawCountries.map(c => {
                const codeUpper = c.cca2.toUpperCase();
                return {
                    name: c.name.common,
                    code: c.cca2.toLowerCase(), // for flagcdn
                    iso3: c.cca3, // for d3 map
                    hebrew: hebrewMap[codeUpper] || null, // Map or null
                    independent: c.independent,
                    unMember: c.unMember
                };
            }).filter(c => {
                // Filter logic: Must be independent OR UN member
                const isValidCountry = c.independent || c.unMember;
                // Only keep countries that exist in the GeoJSON map to avoid blank globes
                const hasMapData = worldGeoJson.features.some(f => f.id === c.iso3);

                return isValidCountry && hasMapData;
            });

            // Ensure we have a decent number of countries
            if (allCountries.length < 50) throw new Error("Not enough data");

            screens.loading.classList.add('hidden');
            screens.menu.classList.remove('hidden');
            screens.menu.classList.add('flex');
            startMenuGlobe();

        } catch (e) {
            console.error(e);
            document.getElementById('loading-text').innerHTML =
                `<span class="err">Error loading data.<br>Please check connection and refresh.</span><span class="err-detail">${e.message}</span>`;
        }
    };

    function showMenu() {
        gameActive = false;
        screens.game.classList.add('hidden');
        screens.over.classList.add('hidden');
        screens.menu.classList.remove('hidden');
        screens.menu.classList.add('flex');
        startMenuGlobe();
    }

    function startGame(mode) {
        currentMode = mode;
        score = 0;
        strikes = 0;

        // Presentation: reset visual counters & mode badge
        shownStrikes = 0;
        shownScore = 0;
        streak = 0;
        updateStreak();
        screens.game.dataset.mode = mode;
        document.getElementById('mode-chip-label').textContent = MODE_META[mode].label;
        document.querySelector('#mode-chip-icon use').setAttribute('href', MODE_META[mode].icon);
        ui.hint.className = mode === 'globes' ? 'hint-flag' : 'hint-globe';

        // Filter logic based on mode
        let roundCountries = [...allCountries];
        if (mode === 'names') {
            roundCountries = roundCountries.filter(c => c.hebrew); // Only countries with Hebrew names
        }

        countryQueue = shuffleArray(roundCountries);

        updateUI();

        screens.menu.classList.add('hidden');
        screens.menu.classList.remove('flex');
        screens.over.classList.add('hidden');
        screens.game.classList.remove('hidden');
        screens.game.classList.add('flex');

        gameActive = true;
        generateRound();
    }

    function restartGame() {
        startGame(currentMode);
    }

    /* --- LOGIC --- */
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function updateUI() {
        ui.score.textContent = score;
        if (score > shownScore) bumpScore();
        shownScore = score;

        let heartsHTML = '';
        for(let i=0; i<maxStrikes; i++) {
            const heartSvg = '<svg><use href="#ico-heart"/></svg>';
            if (i < (maxStrikes - strikes)) {
                heartsHTML += `<span class="heart full" style="--i:${i}">${heartSvg}</span>`;
            } else {
                const justLost = strikes > shownStrikes && i === (maxStrikes - strikes);
                heartsHTML += `<span class="heart lost${justLost ? ' breaking' : ''}">${heartSvg}</span>`;
            }
        }
        ui.hearts.innerHTML = heartsHTML;
        shownStrikes = strikes;
    }

    function toggleZoom(e, index, iso3) {
        e.stopPropagation();
        if (!gameActive || ui.buttons[index].disabled) return;

        zoomStates[index] = !zoomStates[index];
        const btn = ui.buttons[index];
        const container = btn.querySelector('.globe-container');

        drawGlobe(container, iso3, false, zoomStates[index]);

        const svg = e.currentTarget.querySelector('svg');
        if (zoomStates[index]) {
            svg.innerHTML = '<circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line>';
            e.currentTarget.classList.add('is-zoomed');
        } else {
            svg.innerHTML = '<circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line>';
            e.currentTarget.classList.remove('is-zoomed');
        }
    }

    function generateRound() {
        if (!gameActive) return;

        zoomStates = [false, false, false, false];

        ui.buttons.forEach((btn, index) => {
            btn.className = "game-btn deal-in";
            btn.style.setProperty('--i', index);
            btn.disabled = false;
            btn.innerHTML = '';
        });

        if (countryQueue.length === 0) {
            // Re-shuffle specific to mode
            let roundCountries = [...allCountries];
            if (currentMode === 'names') {
                roundCountries = roundCountries.filter(c => c.hebrew);
            }
            countryQueue = shuffleArray(roundCountries);
        }

        const correctCountry = countryQueue.pop();

        let distractors = [];
        // Filtering distractors for names mode to ensure they also have Hebrew names
        let distractorPool = allCountries;
        if(currentMode === 'names') {
            distractorPool = allCountries.filter(c => c.hebrew);
        }

        while (distractors.length < 3) {
            const randomC = distractorPool[Math.floor(Math.random() * distractorPool.length)];
            if (randomC.name !== correctCountry.name && !distractors.includes(randomC)) {
                distractors.push(randomC);
            }
        }

        currentOptions = shuffleArray([correctCountry, ...distractors]);
        correctIndex = currentOptions.indexOf(correctCountry);

        // --- LAYOUT LOGIC ---
        ui.hint.innerHTML = '';
        replayCardIn();

        if (currentMode === 'names') {
            // -- NAMES MODE --
            ui.label.textContent = "What is this country?";
            ui.textContainer.classList.add('hidden');
            ui.visualContainer.classList.remove('hidden');

            // Flag in visual container (waving on a pole)
            ui.visualContainer.innerHTML = wavingFlagHTML(correctCountry.code);

            // Map in hint container
            drawGlobe(ui.hint, correctCountry.iso3, true, false);

        } else {
            // -- FLAGS/GLOBES MODES --
            ui.label.textContent = "Where is";
            ui.textContainer.classList.remove('hidden');
            ui.visualContainer.classList.add('hidden');

            ui.cName.textContent = correctCountry.name;
            if (correctCountry.hebrew) {
                ui.cNameHe.textContent = correctCountry.hebrew;
                ui.cNameHe.style.display = 'block';
            } else {
                ui.cNameHe.style.display = 'none';
            }

            if (currentMode === 'flags') {
                drawGlobe(ui.hint, correctCountry.iso3, true, false);
            } else {
                ui.hint.innerHTML = flagCardHTML(correctCountry.code, 'Flag Hint');
            }
        }

        // --- BUTTONS LOGIC ---
        ui.buttons.forEach((btn, index) => {
            const country = currentOptions[index];

            if (currentMode === 'names') {
                // Text Buttons
                btn.textContent = country.hebrew;
                btn.classList.add('hebrew-text');
                btn.dir = "rtl";
            } else if (currentMode === 'flags') {
                // Flag Buttons
                btn.innerHTML = `<span class="flag-slot">${flagCardHTML(country.code, 'Flag')}</span>`;
            } else {
                // Map Buttons
                const zoomBtn = document.createElement('button');
                zoomBtn.className = 'zoom-btn';
                zoomBtn.setAttribute('aria-label', 'Zoom');
                zoomBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>';
                zoomBtn.onclick = (e) => toggleZoom(e, index, country.iso3);
                btn.appendChild(zoomBtn);

                const container = document.createElement('div');
                container.className = 'globe-container';
                btn.appendChild(container);

                requestAnimationFrame(() => drawGlobe(container, country.iso3, false, false));
            }
        });
    }

    function handleGuess(btnIndex) {
        if (!gameActive) return;

        const selectedBtn = ui.buttons[btnIndex];
        const isCorrect = btnIndex === correctIndex;

        // Disable interaction immediately
        ui.buttons.forEach(btn => {
            btn.disabled = true;
            const zoomBtn = btn.querySelector('button');
            if(zoomBtn) zoomBtn.disabled = true;
        });

        if (isCorrect) {
            score++;
            selectedBtn.classList.add('correct-state');
            selectedBtn.appendChild(resultOverlay(true));
            celebrate(selectedBtn);

            setTimeout(() => {
                updateUI();
                generateRound();
            }, 1000);
        } else {
            strikes++;
            updateUI();
            streak = 0;
            updateStreak();

            selectedBtn.classList.add('shake', 'wrong-state');

            // X on wrong guess
            selectedBtn.appendChild(resultOverlay(false));

            // Show Correct Answer
            const correctBtn = ui.buttons[correctIndex];
            correctBtn.classList.add('correct-state');
            correctBtn.appendChild(resultOverlay(true));

            if (strikes >= maxStrikes) {
                setTimeout(() => {
                    endGame(currentOptions[correctIndex]);
                }, 1500);
            } else {
                // Wait longer so user can see correct answer, then proceed to NEXT question
                setTimeout(() => {
                    generateRound();
                }, 2000);
            }
        }
    }

    function endGame(lastCorrectCountry) {
        gameActive = false;
        ui.finalScore.textContent = score;

        const lastAnswerEl = document.getElementById('last-answer-display');
        if (lastCorrectCountry) {
             const hebrewHtml = lastCorrectCountry.hebrew ? `<span class="he hebrew-text" dir="rtl">${lastCorrectCountry.hebrew}</span>` : '';

             lastAnswerEl.innerHTML = `
                <p class="last-label">The correct answer was</p>
                <div class="last-card">
                    <img src="https://flagcdn.com/${lastCorrectCountry.code}.svg" alt="Flag">
                    <div class="names">
                        <span class="en">${lastCorrectCountry.name}</span>
                        ${hebrewHtml}
                    </div>
                </div>
             `;
             lastAnswerEl.classList.remove('hidden');
        } else {
             lastAnswerEl.classList.add('hidden');
        }

        screens.over.classList.remove('hidden');
        presentGameOver();
    }

    /* --- D3 MAP RENDERING --- */
    function drawGlobe(container, targetIso3, isHint, isZoomed) {
        container.innerHTML = '';

        const width = container.clientWidth;
        const height = container.clientHeight;

        const svg = d3.select(container).append("svg")
            .attr("width", "100%")
            .attr("height", "100%")
            .attr("viewBox", `0 0 ${width} ${height}`)
            .attr("class", "globe-svg");

        const feature = worldGeoJson.features.find(f => f.id === targetIso3);

        const projection = d3.geoOrthographic().clipAngle(90);

        const defaultScale = Math.min(width, height) / 2 - (isHint ? 0 : 10);
        projection.scale(defaultScale).translate([width/2, height/2]);

        if (feature) {
            const centroid = d3.geoCentroid(feature);
            projection.rotate([-centroid[0], -centroid[1]]);
        } else {
            projection.rotate([0, 0]);
        }

        if (isZoomed && feature) {
            const padding = 20;
            projection.fitExtent([[padding, padding], [width - padding, height - padding]], feature);
        }

        const path = d3.geoPath().projection(projection);

        // Ocean
        svg.append("path")
            .datum({type: "Sphere"})
            .attr("d", path)
            .attr("fill", "url(#g-ocean)");

        // Graticule
        svg.append("path")
            .datum(d3.geoGraticule10())
            .attr("d", path)
            .attr("fill", "none")
            .attr("stroke", "rgba(255,255,255,0.22)")
            .attr("stroke-width", 0.6);

        // Land
        svg.selectAll("path.land")
            .data(worldGeoJson.features)
            .enter().append("path")
            .attr("d", path)
            .attr("fill", "#A6E08C")
            .attr("stroke", "#5FA352")
            .attr("stroke-width", isZoomed ? 0.3 : 0.45);

        // Target country
        if (feature) {
            svg.append("path")
                .datum(feature)
                .attr("d", path)
                .attr("fill", "#FFC93C")
                .attr("stroke", "#E2570F")
                .attr("stroke-width", isZoomed ? 2 : 1.2)
                .attr("stroke-linejoin", "round");
        }

        // Gloss & shading
        svg.append("path")
            .datum({type: "Sphere"})
            .attr("d", path)
            .attr("fill", "url(#g-gloss)");

        svg.append("path")
            .datum({type: "Sphere"})
            .attr("d", path)
            .attr("fill", "none")
            .attr("stroke", "rgba(255,255,255,0.75)")
            .attr("stroke-width", 2);

        // Locator ring so very small countries are still visible
        if (feature && !isZoomed && path.area(feature) < 70) {
            const p = projection(d3.geoCentroid(feature));
            if (p) {
                const r = isHint ? 9 : 12;
                svg.append("circle").attr("class", "pin-ring").attr("cx", p[0]).attr("cy", p[1]).attr("r", r);
                svg.append("circle").attr("cx", p[0]).attr("cy", p[1]).attr("r", r)
                    .attr("fill", "none").attr("stroke", "#F26B1D").attr("stroke-width", 2);
            }
        }
    }

    /* =========================================================
       PRESENTATION HELPERS (visual only — no gameplay effect)
       ========================================================= */

    function fitFlag(img) {
        if (img.naturalWidth && img.naturalHeight) {
            img.parentNode.style.setProperty('--ar', (img.naturalWidth / img.naturalHeight).toFixed(4));
        }
    }

    function flagCardHTML(code, alt) {
        return `<span class="flag-card"><img src="https://flagcdn.com/${code}.svg" alt="${alt}" draggable="false" onload="fitFlag(this)"><span class="sheen"></span></span>`;
    }

    function wavingFlagHTML(code) {
        const N = 28;
        const url = `https://flagcdn.com/${code}.svg`;
        let strips = '';
        for (let i = 0; i < N; i++) {
            const left = (i / N) * 100;
            const amp = (0.6 + (i / (N - 1)) * 5).toFixed(2);
            strips += `<span class="strip" style="left:${left}%;width:calc(${100 / N}% + 1px);` +
                `--img:url('${url}');--bs:${N * 100}%;` +
                `--bp:${((i / (N - 1)) * 100).toFixed(3)}%;--amp:${amp}%;animation-delay:${(-i * 0.07).toFixed(2)}s"></span>`;
        }
        return `<div class="pole-flag">` +
            `<img class="ar-probe" alt="" src="${url}" onload="this.parentNode.style.setProperty('--ar', (this.naturalWidth/this.naturalHeight).toFixed(4)); this.parentNode.classList.add('ready')">` +
            `<div class="rig"><span class="pole"></span><div class="cloth">${strips}</div></div></div>`;
    }

    function resultOverlay(good) {
        const el = document.createElement('div');
        el.className = 'result-overlay ' + (good ? 'good' : 'bad');
        el.innerHTML = `<span class="result-badge"><svg><use href="${good ? '#ico-check' : '#ico-close'}"/></svg></span>`;
        return el;
    }

    function replayCardIn() {
        const card = document.getElementById('q-card');
        card.classList.remove('card-in');
        void card.offsetWidth;
        card.classList.add('card-in');
    }

    function bumpScore() {
        const pill = document.getElementById('score-pill');
        pill.classList.remove('bump');
        void pill.offsetWidth;
        pill.classList.add('bump');
    }

    function updateStreak() {
        const pill = document.getElementById('streak-pill');
        if (streak >= 2) {
            document.getElementById('streak-count').textContent = streak;
            if (pill.classList.contains('hidden')) {
                pill.classList.remove('hidden');
            } else {
                pill.style.animation = 'none';
                void pill.offsetWidth;
                pill.style.animation = '';
            }
        } else {
            pill.classList.add('hidden');
        }
    }

    function showToast(text) {
        const t = document.getElementById('toast');
        t.textContent = text;
        t.classList.remove('show');
        void t.offsetWidth;
        t.classList.add('show');
    }

    function celebrate(btn) {
        streak++;
        updateStreak();
        const r = btn.getBoundingClientRect();
        const cx = r.left + r.width / 2;
        const cy = r.top + r.height / 2;
        burst(cx, cy, 70);
        showToast(streak >= 3 ? `🔥 ${streak} in a row!` : PRAISE[Math.floor(Math.random() * PRAISE.length)]);

        // +1 flies to the score pill
        const target = document.getElementById('score-pill').getBoundingClientRect();
        const plus = document.createElement('div');
        plus.className = 'plus-one';
        plus.textContent = '+1';
        plus.style.left = cx + 'px';
        plus.style.top = cy + 'px';
        document.body.appendChild(plus);
        requestAnimationFrame(() => requestAnimationFrame(() => {
            plus.style.left = (target.left + 22) + 'px';
            plus.style.top = (target.top + target.height / 2) + 'px';
            plus.style.opacity = '0.2';
            plus.style.transform = 'translate(-50%, -50%) scale(.6)';
        }));
        setTimeout(() => plus.remove(), 900);
    }

    function presentGameOver() {
        // Stars (visual flourish based on final score)
        const earned = score >= 15 ? 3 : score >= 8 ? 2 : score >= 1 ? 1 : 0;
        document.querySelectorAll('#over-stars svg').forEach((s, i) => {
            s.classList.remove('on');
            s.style.animationDelay = (0.45 + i * 0.18) + 's';
            if (i < earned) s.classList.add('on');
        });

        // Count-up animation for the final score
        const target = score;
        const el = ui.finalScore;
        const start = performance.now();
        const dur = Math.min(1200, 250 + target * 60);
        el.textContent = '0';
        (function tick(now) {
            const t = Math.max(0, Math.min(1, (now - start) / dur));
            el.textContent = Math.round(target * (1 - Math.pow(1 - t, 3)));
            if (t < 1) requestAnimationFrame(tick);
            else el.textContent = target;
        })(start);

        if (target > 0) {
            setTimeout(() => {
                burst(window.innerWidth * 0.3, window.innerHeight * 0.35, 60);
                burst(window.innerWidth * 0.7, window.innerHeight * 0.35, 60);
            }, 350);
        }
    }

    /* --- Confetti / star particles --- */
    const fx = (() => {
        const canvas = document.getElementById('fx');
        const ctx = canvas.getContext('2d');
        const colors = ['#FFC93C', '#FF6B57', '#2FBF71', '#3FA6EC', '#8A5CF6', '#FF4D6D', '#ffffff'];
        let parts = [];
        let running = false;
        let dpr = 1;

        function resize() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.round(window.innerWidth * dpr);
            canvas.height = Math.round(window.innerHeight * dpr);
        }
        resize();
        window.addEventListener('resize', resize);

        function star(c, r) {
            c.beginPath();
            for (let i = 0; i < 10; i++) {
                const rad = i % 2 ? r * 0.45 : r;
                const a = (Math.PI / 5) * i - Math.PI / 2;
                c.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
            }
            c.closePath();
            c.fill();
        }

        function loop() {
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            parts = parts.filter(p => p.life > 0);
            for (const p of parts) {
                p.vx *= 0.985;
                p.vy = p.vy * 0.985 + p.g;
                p.x += p.vx;
                p.y += p.vy;
                p.rot += p.vr;
                p.life--;
                ctx.setTransform(dpr, 0, 0, dpr, p.x * dpr, p.y * dpr);
                ctx.rotate(p.rot);
                ctx.globalAlpha = Math.min(1, p.life / 25);
                ctx.fillStyle = p.color;
                if (p.shape === 'star') {
                    star(ctx, p.size);
                } else {
                    ctx.scale(1, Math.cos(p.rot * 2));
                    ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
                }
            }
            ctx.globalAlpha = 1;
            if (parts.length) {
                requestAnimationFrame(loop);
            } else {
                running = false;
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        return function burst(x, y, count) {
            for (let i = 0; i < count; i++) {
                const a = Math.random() * Math.PI * 2;
                const sp = 4 + Math.random() * 9;
                parts.push({
                    x, y,
                    vx: Math.cos(a) * sp,
                    vy: Math.sin(a) * sp - 5,
                    g: 0.32,
                    rot: Math.random() * 6,
                    vr: (Math.random() - 0.5) * 0.4,
                    size: 7 + Math.random() * 8,
                    life: 55 + Math.random() * 40,
                    color: colors[(Math.random() * colors.length) | 0],
                    shape: Math.random() < 0.3 ? 'star' : 'rect'
                });
            }
            if (!running) {
                running = true;
                requestAnimationFrame(loop);
            }
        };
    })();

    function burst(x, y, count) { fx(x, y, count); }

    /* --- Spinning menu globe --- */
    let menuGlobeRunning = false;

    function startMenuGlobe() {
        if (menuGlobeRunning || !worldGeoJson) return;
        const canvas = document.getElementById('menu-globe');
        const ctx = canvas.getContext('2d');
        const projection = d3.geoOrthographic().clipAngle(90);
        const path = d3.geoPath(projection, ctx);
        const graticule = d3.geoGraticule10();
        const land = { type: 'FeatureCollection', features: worldGeoJson.features };
        let lambda = -20;
        let lastSize = 0;
        let frame = 0;
        menuGlobeRunning = true;

        function draw() {
            if (screens.menu.classList.contains('hidden')) {
                menuGlobeRunning = false;
                return;
            }
            requestAnimationFrame(draw);
            if ((frame++ % 2) !== 0) return; // ~30fps is plenty

            const size = canvas.clientWidth;
            if (!size) return;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            if (size !== lastSize) {
                canvas.width = canvas.height = Math.round(size * dpr);
                lastSize = size;
            }
            const r = size / 2;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, size, size);
            projection.scale(r).translate([r, r]).rotate([lambda, -18]);
            lambda += 0.6;

            const ocean = ctx.createRadialGradient(r * 0.75, r * 0.7, r * 0.1, r, r, r);
            ocean.addColorStop(0, '#8FDBFF');
            ocean.addColorStop(0.55, '#3FA6EC');
            ocean.addColorStop(1, '#1D63B8');
            ctx.beginPath(); path({ type: 'Sphere' }); ctx.fillStyle = ocean; ctx.fill();

            ctx.beginPath(); path(graticule); ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 0.7; ctx.stroke();

            ctx.beginPath(); path(land); ctx.fillStyle = '#A6E08C'; ctx.fill();
            ctx.strokeStyle = '#5FA352'; ctx.lineWidth = 0.5; ctx.stroke();

            const gloss = ctx.createRadialGradient(r * 0.68, r * 0.52, 0, r, r, r * 1.05);
            gloss.addColorStop(0, 'rgba(255,255,255,0.5)');
            gloss.addColorStop(0.4, 'rgba(255,255,255,0)');
            gloss.addColorStop(1, 'rgba(11,42,91,0.35)');
            ctx.beginPath(); path({ type: 'Sphere' }); ctx.fillStyle = gloss; ctx.fill();
        }
        requestAnimationFrame(draw);
    }
</script>
